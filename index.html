options_html": ["O", "X"], "explanation_html": "정답: O. 필기 노트 [7]주차 중심극한정리 핵심: '모집단 어떤 분포 상관 X, 표본크기 $n \\ge 30$이면 표본평균 $\\bar{X}$는 정규분포에 근접'합니다."}, {"id": 59, "set": 2, "no": 29, "type": "ox", "concept": "생성형 AI 프롬프트 프레임워크 RTF", "question": "생성형 AI 프롬프트 작성 프레임워크 중 하나인 'RTF'는 Role(역할), Task(과제), Format(형식)의 3가지 핵심 요소로 구성된다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 2주차 온라인 강의교안에 명시되어 있습니다. RTF는 단순 프롬프트를 체계화하기 위한 3요소(Role, Task, Format)입니다.", "question_html": "생성형 AI 프롬프트 작성 프레임워크 중 하나인 'RTF'는 Role(역할), Task(과제), Format(형식)의 3가지 핵심 요소로 구성된다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 2주차 온라인 강의교안에 명시되어 있습니다. RTF는 단순 프롬프트를 체계화하기 위한 3요소(Role, Task, Format)입니다."}, {"id": 60, "set": 2, "no": 30, "type": "ox", "concept": "파이썬 불리언 자료형", "question": "파이썬에서 `is_new = False`로 정의했을 때, `type(is_new)` 함수의 출력값은 문자열(String)을 나타내는 `<class 'str'>`이다.", "options": ["O", "X"], "answer": "X", "explanation": "정답: X. `False`와 `True`는 따옴표가 없는 예약어로 참/거짓을 나타내는 불리언 자료형(`<class 'bool'>`)입니다. 따옴표로 감싸진 `'False'`여야 문자열(str)이 됩니다.", "question_html": "파이썬에서 <code>is_new = False</code>로 정의했을 때, <code>type(is_new)</code> 함수의 출력값은 문자열(String)을 나타내는 <code><class 'str'></code>이다.", "options_html": ["O", "X"], "explanation_html": "정답: X. <code>False</code>와 <code>True</code>는 따옴표가 없는 예약어로 참/거짓을 나타내는 불리언 자료형(<code><class 'bool'></code>)입니다. 따옴표로 감싸진 <code>'False'</code>여야 문자열(str)이 됩니다."}]}, {"set_num": 3, "title": "시즌 1 제3회 (파이썬 실습 30제)", "desc": "온라인 블렌디드 파이썬 연산, 판다스 조작, Generative AI 프롬프트 RACE, t분포와 중심극한정리", "questions": [{"id": 61, "set": 3, "no": 1, "type": "choice", "concept": "AI Director vs Coder 패러다임", "question": "1주차 온라인 강의교안에 제시된 'Coder'에서 'AI Director'로의 마케터 패러다임 변화에 대한 설명으로 가장 적절하지 않은 것은?", "options": ["과거의 Coder는 파이썬 문법을 일일이 암기하고 타이핑하며 에러를 디버깅하는 데 집중하였다.", "현재의 AI Director는 복잡한 코드를 직접 한 줄 한 줄 타이핑하기보다, 분석의 목적에 맞춰 AI에게 명확한 작업 지시서(Prompt)를 설계하는 데 주력한다.", "AI Director는 AI가 산출한 분석 코드와 통계 결과를 무비판적으로 수용하여 업무 속도를 극대화하는 것을 최우선 목표로 한다.", "AI Director에게는 AI에게 올바른 비즈니스 질문을 던지고, AI의 분석 결과를 도메인 지식에 기반하여 비판적으로 검증하고 해석하는 역량이 필수적이다."], "answer": 3, "explanation": "③ 교안에 명시되어 있듯이 AI Director는 AI가 내놓은 결과를 그대로 쓰는 것이 아니라, 방향을 잡고(Direction), 근거를 검증하고, 최종 비즈니스 판단을 내리는 '주도권(Initiative)'을 가져야 합니다. 무비판적 수용은 AI Director의 역할에 정면으로 위배됩니다.", "question_html": "1주차 온라인 강의교안에 제시된 'Coder'에서 'AI Director'로의 마케터 패러다임 변화에 대한 설명으로 가장 적절하지 않은 것은?", "options_html": ["과거의 Coder는 파이썬 문법을 일일이 암기하고 타이핑하며 에러를 디버깅하는 데 집중하였다.", "현재의 AI Director는 복잡한 코드를 직접 한 줄 한 줄 타이핑하기보다, 분석의 목적에 맞춰 AI에게 명확한 작업 지시서(Prompt)를 설계하는 데 주력한다.", "AI Director는 AI가 산출한 분석 코드와 통계 결과를 무비판적으로 수용하여 업무 속도를 극대화하는 것을 최우선 목표로 한다.", "AI Director에게는 AI에게 올바른 비즈니스 질문을 던지고, AI의 분석 결과를 도메인 지식에 기반하여 비판적으로 검증하고 해석하는 역량이 필수적이다."], "explanation_html": "③ 교안에 명시되어 있듯이 AI Director는 AI가 내놓은 결과를 그대로 쓰는 것이 아니라, 방향을 잡고(Direction), 근거를 검증하고, 최종 비즈니스 판단을 내리는 '주도권(Initiative)'을 가져야 합니다. 무비판적 수용은 AI Director의 역할에 정면으로 위배됩니다."}, {"id": 62, "set": 3, "no": 2, "type": "choice", "concept": "파이썬 연산자 실행 결과", "question": "다음 파이썬 코드의 실행 결과로 올바른 것은?\n\n```python\nprice = 6000\nprint(price // 5000)\nprint(price % 5000)\nprint(price ** 2 == 36000000)\n```", "options": ["1.2 \n 1000 \n True", "1 \n 1000 \n True", "1 \n 1000 \n False", "1000 \n 1 \n True"], "answer": 2, "explanation": "② `6000 // 5000`은 나눗셈의 정수 몫이므로 `1`입니다. `6000 % 5000`은 나눗셈의 나머지이므로 `1000`입니다. `6000 ** 2`는 6000의 제곱($6000^2 = 36,000,000$)이므로 `True`가 출력됩니다.", "question_html": "다음 파이썬 코드의 실행 결과로 올바른 것은?<br><br><pre><code class=\"language-python\">price = 6000\nprint(price // 5000)\nprint(price % 5000)\nprint(price ** 2 == 36000000)</code></pre>", "options_html": ["1.2 <br> 1000 <br> True", "1 <br> 1000 <br> True", "1 <br> 1000 <br> False", "1000 <br> 1 <br> True"], "explanation_html": "② <code>6000 // 5000</code>은 나눗셈의 정수 몫이므로 <code>1</code>입니다. <code>6000 % 5000</code>은 나눗셈의 나머지이므로 <code>1000</code>입니다. <code>6000 ** 2</code>는 6000의 제곱($6000^2 = 36,000,000$)이므로 <code>True</code>가 출력됩니다."}, {"id": 63, "set": 3, "no": 3, "type": "choice", "concept": "파이썬 불리언 연산과 문자열", "question": "다음 파이썬 코드의 출력 결과로 올바른 것은?\n\n```python\nprint(True + True)\nprint(False * True)\npromo = \"영대돈가스\" + \"! \"\nprint(promo * 2)\n```", "options": ["2 \n 0 \n 영대돈가스! 영대돈가스! ", "True \n False \n 영대돈가스! 2", "1 \n 0 \n 영대돈가스! 영대돈가스! ", "Error 발생"], "answer": 1, "explanation": "① 파이썬에서 불리언 값 `True`는 숫자 `1`, `False`는 숫자 `0`으로 자동 형변환되어 연산됩니다. 따라서 `True + True = 1 + 1 = 2`이고, `False * True = 0 * 1 = 0`입니다. 문자열에 숫자 2를 곱하면 해당 문자열이 2회 반복 연결되므로 `'영대돈가스! 영대돈가스! '`가 출력됩니다.", "question_html": "다음 파이썬 코드의 출력 결과로 올바른 것은?<br><br><pre><code class=\"language-python\">print(True + True)\nprint(False * True)\npromo = &quot;영대돈가스&quot; + &quot;! &quot;\nprint(promo * 2)</code></pre>", "options_html": ["2 <br> 0 <br> 영대돈가스! 영대돈가스! ", "True <br> False <br> 영대돈가스! 2", "1 <br> 0 <br> 영대돈가스! 영대돈가스! ", "Error 발생"], "explanation_html": "① 파이썬에서 불리언 값 <code>True</code>는 숫자 <code>1</code>, <code>False</code>는 숫자 <code>0</code>으로 자동 형변환되어 연산됩니다. 따라서 <code>True + True = 1 + 1 = 2</code>이고, <code>False * True = 0 * 1 = 0</code>입니다. 문자열에 숫자 2를 곱하면 해당 문자열이 2회 반복 연결되므로 <code>'영대돈가스! 영대돈가스! '</code>가 출력됩니다."}, {"id": 64, "set": 3, "no": 4, "type": "choice", "concept": "파이썬 리스트(List) 인덱싱", "question": "다음 파이썬 리스트 코드에 대한 설명으로 옳은 것은?\n\n```python\nls = ['제육덮밥', '영대돈가스', '천원의 아침밥', '순두부찌개']\n```", "options": ["`ls[0]`의 값은 `'영대돈가스'`이다.", "`ls[2]`의 값은 `'천원의 아침밥'`이다.", "파이썬 리스트의 인덱스는 1부터 시작하므로 `ls[1]`이 첫 번째 요소이다.", "`ls[4]`를 실행하면 `'순두부찌개'`가 출력된다."], "answer": 2, "explanation": "② 파이썬의 인덱싱은 0부터 시작합니다(0-based indexing). 따라서 `ls[0]`은 '제육덮밥', `ls[1]`은 '영대돈가스', `ls[2]`는 '천원의 아침밥', `ls[3]`은 '순두부찌개'입니다. `ls[4]`는 범위를 벗어나 Index Error가 발생합니다.", "question_html": "다음 파이썬 리스트 코드에 대한 설명으로 옳은 것은?<br><br><pre><code class=\"language-python\">ls = [&#x27;제육덮밥&#x27;, &#x27;영대돈가스&#x27;, &#x27;천원의 아침밥&#x27;, &#x27;순두부찌개&#x27;]</code></pre>", "options_html": ["<code>ls[0]</code>의 값은 <code>'영대돈가스'</code>이다.", "<code>ls[2]</code>의 값은 <code>'천원의 아침밥'</code>이다.", "파이썬 리스트의 인덱스는 1부터 시작하므로 <code>ls[1]</code>이 첫 번째 요소이다.", "<code>ls[4]</code>를 실행하면 <code>'순두부찌개'</code>가 출력된다."], "explanation_html": "② 파이썬의 인덱싱은 0부터 시작합니다(0-based indexing). 따라서 <code>ls[0]</code>은 '제육덮밥', <code>ls[1]</code>은 '영대돈가스', <code>ls[2]</code>는 '천원의 아침밥', <code>ls[3]</code>은 '순두부찌개'입니다. <code>ls[4]</code>는 범위를 벗어나 Index Error가 발생합니다."}, {"id": 65, "set": 3, "no": 5, "type": "choice", "concept": "파이썬 딕셔너리(Dictionary) 구조", "question": "다음 파이썬 딕셔너리 코드에 대한 설명으로 가장 적절하지 않은 것은?\n\n```python\nstudent = {\n    'id': 2201111,\n    'major': '경영학과',\n    'satisfaction': 6.5,\n    'has_visited': True\n}\n```", "options": ["딕셔너리는 이름표(Key)와 값(Value)이 쌍을 이루어 중괄호 `{ }` 안에 저장되는 자료형이다.", "`student['major']`를 입력하면 `'경영학과'`라는 값이 반환된다.", "딕셔너리는 리스트와 달리 순서 번호(인덱스 번호 `student[0]`)로 값을 꺼내는 것이 기본 방식이다.", "딕셔너리의 Value로는 정수, 문자열, 실수, 불리언 등 모든 파이썬 자료형이 올 수 있다."], "answer": 3, "explanation": "③ 5주차 교안에 명시되어 있듯이, 리스트는 순서 번호(인덱스 `0, 1, 2...`)로 요소를 꺼내지만, 딕셔너리는 이름표(Key, 예: `student['id']`, `student['major']`)를 사용하여 값을 조회합니다.", "question_html": "다음 파이썬 딕셔너리 코드에 대한 설명으로 가장 적절하지 않은 것은?<br><br><pre><code class=\"language-python\">student = {\n    &#x27;id&#x27;: 2201111,\n    &#x27;major&#x27;: &#x27;경영학과&#x27;,\n    &#x27;satisfaction&#x27;: 6.5,\n    &#x27;has_visited&#x27;: True\n}</code></pre>", "options_html": ["딕셔너리는 이름표(Key)와 값(Value)이 쌍을 이루어 중괄호 <code>{ }</code> 안에 저장되는 자료형이다.", "<code>student['major']</code>를 입력하면 <code>'경영학과'</code>라는 값이 반환된다.", "딕셔너리는 리스트와 달리 순서 번호(인덱스 번호 <code>student[0]</code>)로 값을 꺼내는 것이 기본 방식이다.", "딕셔너리의 Value로는 정수, 문자열, 실수, 불리언 등 모든 파이썬 자료형이 올 수 있다."], "explanation_html": "③ 5주차 교안에 명시되어 있듯이, 리스트는 순서 번호(인덱스 <code>0, 1, 2...</code>)로 요소를 꺼내지만, 딕셔너리는 이름표(Key, 예: <code>student['id']</code>, <code>student['major']</code>)를 사용하여 값을 조회합니다."}, {"id": 66, "set": 3, "no": 6, "type": "choice", "concept": "판다스 데이터프레임 구조와 통계학적 의미", "question": "판다스(Pandas)의 데이터프레임(DataFrame) 구조를 설문조사 데이터와 연계하여 설명한 내용으로 가장 옳은 것은?", "options": ["데이터프레임의 '열(Column)'은 설문 응답자 한 명(관측치)을 의미하고, '행(Row)'은 조사 문항(변수)을 의미한다.", "데이터프레임의 '열(Column)'은 하나의 변수(Variable, 예: 성별, 만족도 점수)를 나타내며 동일한 자료형을 갖는다.", "데이터프레임의 '행(Row)'에는 컬럼 고유 이름이 들어가고, 열에는 행 인덱스가 배치된다.", "데이터프레임은 엑셀과 달리 행과 열의 2차원 표 구조를 지원하지 않는다."], "answer": 2, "explanation": "② 7주차 교안에 명시되어 있듯이, 데이터프레임에서 '열(Column)'은 성별, 연령, 구매액 등 하나의 속성을 담는 '변수(Variable)'이며, '행(Row)'은 설문 응답자 1명, 관측치 1건(Observation)을 나타냅니다.", "question_html": "판다스(Pandas)의 데이터프레임(DataFrame) 구조를 설문조사 데이터와 연계하여 설명한 내용으로 가장 옳은 것은?", "options_html": ["데이터프레임의 '열(Column)'은 설문 응답자 한 명(관측치)을 의미하고, '행(Row)'은 조사 문항(변수)을 의미한다.", "데이터프레임의 '열(Column)'은 하나의 변수(Variable, 예: 성별, 만족도 점수)를 나타내며 동일한 자료형을 갖는다.", "데이터프레임의 '행(Row)'에는 컬럼 고유 이름이 들어가고, 열에는 행 인덱스가 배치된다.", "데이터프레임은 엑셀과 달리 행과 열의 2차원 표 구조를 지원하지 않는다."], "explanation_html": "② 7주차 교안에 명시되어 있듯이, 데이터프레임에서 '열(Column)'은 성별, 연령, 구매액 등 하나의 속성을 담는 '변수(Variable)'이며, '행(Row)'은 설문 응답자 1명, 관측치 1건(Observation)을 나타냅니다."}, {"id": 67, "set": 3, "no": 7, "type": "choice", "concept": "판다스 데이터 확인 메서드와 속성", "question": "판다스 데이터프레임 `df`의 특성을 점검하기 위한 도구 중, '함수/메서드'가 아니라 괄호 `()`를 붙이지 않는 '속성(Attribute)'에 해당하는 것은?", "options": ["`df.head()`", "`df.info()`", "`df.describe()`", "`df.shape`"], "answer": 4, "explanation": "④ 7주차 교안 [데이터프레임 활용] 참고 사항에 명확히 설명되어 있습니다. `df.head()`, `df.info()`, `df.describe()`는 동작을 수행하는 메서드이므로 괄호 `()`를 붙이지만, `df.shape`는 데이터프레임이 이미 가지고 있는 행과 열의 크기 정보(튜플 형태, 예: `(200, 5)`)를 단순히 꺼내오는 '속성(Attribute)'이므로 괄호가 없습니다.", "question_html": "판다스 데이터프레임 <code>df</code>의 특성을 점검하기 위한 도구 중, '함수/메서드'가 아니라 괄호 <code>()</code>를 붙이지 않는 '속성(Attribute)'에 해당하는 것은?", "options_html": ["<code>df.head()</code>", "<code>df.info()</code>", "<code>df.describe()</code>", "<code>df.shape</code>"], "explanation_html": "④ 7주차 교안 [데이터프레임 활용] 참고 사항에 명확히 설명되어 있습니다. <code>df.head()</code>, <code>df.info()</code>, <code>df.describe()</code>는 동작을 수행하는 메서드이므로 괄호 <code>()</code>를 붙이지만, <code>df.shape</code>는 데이터프레임이 이미 가지고 있는 행과 열의 크기 정보(튜플 형태, 예: <code>(200, 5)</code>)를 단순히 꺼내오는 '속성(Attribute)'이므로 괄호가 없습니다."}, {"id": 68, "set": 3, "no": 8, "type": "choice", "concept": "df.describe() 출력 통계량 해석", "question": "판다스에서 `df.describe()`를 실행했을 때 출력되는 기초통계량에 포함되지 않는 것은?", "options": ["count (유효 데이터 개수)", "mean (산술평균) 및 std (표준편차)", "min, 50%(중앙값), max", "mode (최빈값)"], "answer": 4, "explanation": "④ `df.describe()`는 수치형 데이터에 대해 count(개수), mean(평균), std(표준편차), min(최소값), 25% 분위수, 50%(중앙값, median), 75% 분위수, max(최대값)을 기본 요약해줍니다. 최빈값(mode)은 `df['컬럼'].mode()` 메서드를 별도로 호출해야 확인할 수 있습니다.", "question_html": "판다스에서 <code>df.describe()</code>를 실행했을 때 출력되는 기초통계량에 포함되지 않는 것은?", "options_html": ["count (유효 데이터 개수)", "mean (산술평균) 및 std (표준편차)", "min, 50%(중앙값), max", "mode (최빈값)"], "explanation_html": "④ <code>df.describe()</code>는 수치형 데이터에 대해 count(개수), mean(평균), std(표준편차), min(최소값), 25% 분위수, 50%(중앙값, median), 75% 분위수, max(최대값)을 기본 요약해줍니다. 최빈값(mode)은 <code>df['컬럼'].mode()</code> 메서드를 별도로 호출해야 확인할 수 있습니다."}, {"id": 69, "set": 3, "no": 9, "type": "choice", "concept": "판다스 데이터 필터링 문법", "question": "학생식당 만족도 조사 데이터프레임 `df`에서 '25세 초과인 응답자들의 행'만을 추출하여 새로운 데이터프레임으로 저장하고자 할 때 올바른 파이썬 코드는?", "options": ["`df['나이' > 25]`", "`df[df['나이'] > 25]`", "`df.filter('나이' > 25)`", "`df.select(나이 > 25)`"], "answer": 2, "explanation": "② 7주차 교안 [데이터 인덱싱과 필터링]에 제시된 정석 문법입니다. 대괄호 안에 불리언 조건식 `df['나이'] > 25`를 전달하는 `df[df['나이'] > 25]` 형태를 사용해야 조건이 `True`인 행들만 필터링됩니다.", "question_html": "학생식당 만족도 조사 데이터프레임 <code>df</code>에서 '25세 초과인 응답자들의 행'만을 추출하여 새로운 데이터프레임으로 저장하고자 할 때 올바른 파이썬 코드는?", "options_html": ["<code>df['나이' > 25]</code>", "<code>df[df['나이'] > 25]</code>", "<code>df.filter('나이' > 25)</code>", "<code>df.select(나이 > 25)</code>"], "explanation_html": "② 7주차 교안 [데이터 인덱싱과 필터링]에 제시된 정석 문법입니다. 대괄호 안에 불리언 조건식 <code>df['나이'] > 25</code>를 전달하는 <code>df[df['나이'] > 25]</code> 형태를 사용해야 조건이 <code>True</code>인 행들만 필터링됩니다."}, {"id": 70, "set": 3, "no": 10, "type": "choice", "concept": "판다스 열 인덱싱 (Series vs DataFrame)", "question": "데이터프레임 `df`에서 '성별'과 '만족도'라는 2개 이상의 열을 동시에 선택하여 가져오기 위한 올바른 대괄호 문법은?", "options": ["`df['성별', '만족도']`", "`df[['성별', '만족도']]`", "`df({'성별', '만족도'})`", "`df['성별' & '만족도']`"], "answer": 2, "explanation": "② 7주차 교안에 명시되어 있듯이, 열 하나를 가져올 때는 `df['만족도']`(시리즈 형태)를 쓰지만, 두 개 이상의 열을 가져올 때는 열 이름들의 리스트 `['성별', '만족도']`를 대괄호 안에 넣어야 하므로 이중 대괄호 `df[['성별', '만족도']]`(데이터프레임 형태)를 사용해야 합니다.", "question_html": "데이터프레임 <code>df</code>에서 '성별'과 '만족도'라는 2개 이상의 열을 동시에 선택하여 가져오기 위한 올바른 대괄호 문법은?", "options_html": ["<code>df['성별', '만족도']</code>", "<code>df[['성별', '만족도']]</code>", "<code>df({'성별', '만족도'})</code>", "<code>df['성별' & '만족도']</code>"], "explanation_html": "② 7주차 교안에 명시되어 있듯이, 열 하나를 가져올 때는 <code>df['만족도']</code>(시리즈 형태)를 쓰지만, 두 개 이상의 열을 가져올 때는 열 이름들의 리스트 <code>['성별', '만족도']</code>를 대괄호 안에 넣어야 하므로 이중 대괄호 <code>df[['성별', '만족도']]</code>(데이터프레임 형태)를 사용해야 합니다."}, {"id": 71, "set": 3, "no": 11, "type": "choice", "concept": "판다스 groupby 그룹화", "question": "학생식당 데이터프레임 `df`에서 '성별(남/여)'에 따른 '만족도'의 평균 점수를 비교하기 위해 AI에게 작성하도록 요청해야 할 파이썬 코드로 가장 적절한 것은?", "options": ["`df.groupby('성별')['만족도'].mean()`", "`df.mean().groupby('성별')`", "`df['성별'].groupby('만족도')`", "`df.sort_values('성별').sum()`"], "answer": 1, "explanation": "① 7주차 교안 [그룹화(groupby)]에 제시된 문법입니다. 특정 범주형 변수를 기준으로 집단별 통계량을 계산할 때는 `df.groupby('기준컬럼')['계산대상컬럼'].통계함수()` 형태(예: `df.groupby('성별')['만족도'].mean()`)를 사용합니다.", "question_html": "학생식당 데이터프레임 <code>df</code>에서 '성별(남/여)'에 따른 '만족도'의 평균 점수를 비교하기 위해 AI에게 작성하도록 요청해야 할 파이썬 코드로 가장 적절한 것은?", "options_html": ["<code>df.groupby('성별')['만족도'].mean()</code>", "<code>df.mean().groupby('성별')</code>", "<code>df['성별'].groupby('만족도')</code>", "<code>df.sort_values('성별').sum()</code>"], "explanation_html": "① 7주차 교안 [그룹화(groupby)]에 제시된 문법입니다. 특정 범주형 변수를 기준으로 집단별 통계량을 계산할 때는 <code>df.groupby('기준컬럼')['계산대상컬럼'].통계함수()</code> 형태(예: <code>df.groupby('성별')['만족도'].mean()</code>)를 사용합니다."}, {"id": 72, "set": 3, "no": 12, "type": "choice", "concept": "생성형 AI 프롬프트 RACE 프레임워크", "question": "마케팅 조사 보고서 작성을 위해 2주차 온라인 강의에서 학습한 'RACE 프롬프트 프레임워크'의 4가지 구성 요소와 그 역할을 올바르게 짝지은 것은?", "options": ["R(Research) - 연구자료 / A(Analysis) - 데이터분석 / C(Coding) - 파이썬코드 / E(Evaluation) - 교수평가", "R(Role) - AI의 페르소나 및 역할 부여 / A(Action) - 수행할 구체적 행동 과제 / C(Context) - 조사 배경과 맥락 제공 / E(Expectation) - 출력 형식, 분량, 제약조건 규정", "R(Report) - 보고서 양식 / A(AI) - 인공지능 모델 / C(Chat) - 대화창 인터페이스 / E(Error) - 디버깅", "R(Review) - 선행연구 검토 / A(Argument) - 주장 도출 / C(Conclusion) - 결론 / E(Execution) - 실행계획"], "answer": 2, "explanation": "② 2주차 교안에 명시된 RACE 프레임워크는 Role(역할, 톤과 전문성 제어), Action(구체적 행동 지시), Context(조사의 배경과 맥락), Expectation(기대하는 산출물 형태, 표, 분량, 조건 등)의 4요소로 구성됩니다.", "question_html": "마케팅 조사 보고서 작성을 위해 2주차 온라인 강의에서 학습한 'RACE 프롬프트 프레임워크'의 4가지 구성 요소와 그 역할을 올바르게 짝지은 것은?", "options_html": ["R(Research) - 연구자료 / A(Analysis) - 데이터분석 / C(Coding) - 파이썬코드 / E(Evaluation) - 교수평가", "R(Role) - AI의 페르소나 및 역할 부여 / A(Action) - 수행할 구체적 행동 과제 / C(Context) - 조사 배경과 맥락 제공 / E(Expectation) - 출력 형식, 분량, 제약조건 규정", "R(Report) - 보고서 양식 / A(AI) - 인공지능 모델 / C(Chat) - 대화창 인터페이스 / E(Error) - 디버깅", "R(Review) - 선행연구 검토 / A(Argument) - 주장 도출 / C(Conclusion) - 결론 / E(Execution) - 실행계획"], "explanation_html": "② 2주차 교안에 명시된 RACE 프레임워크는 Role(역할, 톤과 전문성 제어), Action(구체적 행동 지시), Context(조사의 배경과 맥락), Expectation(기대하는 산출물 형태, 표, 분량, 조건 등)의 4요소로 구성됩니다."}, {"id": 73, "set": 3, "no": 13, "type": "choice", "concept": "가상 FGI(Synthetic Persona)의 한계", "question": "3주차 강의에서 다룬 '생성형 AI를 활용한 가상 FGI(합성 페르소나 인터뷰)'의 본질적 한계로 가장 올바른 것은?", "options": ["시간과 비용이 실제 FGI에 비해 수십 배 이상 많이 소요된다.", "다양한 배경을 가진 가상의 페르소나를 여러 명 생성하는 것이 기술적으로 불가능하다.", "AI 페르소나는 실제 응답자가 아니라 학습 데이터에 기반한 '그럴듯한 추측'이므로, 그 대화 내용 자체를 새로운 사실이나 연구 가설의 최종 실증 근거로 삼을 수 없다.", "가상 FGI로는 연구 배경이나 문제의식의 출발점을 도출하는 초기 탐색 작업조차 수행할 수 없다."], "answer": 3, "explanation": "③ 3주차 교안 [가상 FGI의 한계]에 명시되어 있습니다. AI 페르소나는 실제 인간 응답자가 아니며 비언어적 반응이나 미묘한 감정을 얻을 수 없으므로, 연구의 최종 '근거'가 될 수 없으며, 오직 조사 초기 아이디어 발상과 탐색적(탐색과 발상용) 목적으로만 한정하여 활용해야 합니다.", "question_html": "3주차 강의에서 다룬 '생성형 AI를 활용한 가상 FGI(합성 페르소나 인터뷰)'의 본질적 한계로 가장 올바른 것은?", "options_html": ["시간과 비용이 실제 FGI에 비해 수십 배 이상 많이 소요된다.", "다양한 배경을 가진 가상의 페르소나를 여러 명 생성하는 것이 기술적으로 불가능하다.", "AI 페르소나는 실제 응답자가 아니라 학습 데이터에 기반한 '그럴듯한 추측'이므로, 그 대화 내용 자체를 새로운 사실이나 연구 가설의 최종 실증 근거로 삼을 수 없다.", "가상 FGI로는 연구 배경이나 문제의식의 출발점을 도출하는 초기 탐색 작업조차 수행할 수 없다."], "explanation_html": "③ 3주차 교안 [가상 FGI의 한계]에 명시되어 있습니다. AI 페르소나는 실제 인간 응답자가 아니며 비언어적 반응이나 미묘한 감정을 얻을 수 없으므로, 연구의 최종 '근거'가 될 수 없으며, 오직 조사 초기 아이디어 발상과 탐색적(탐색과 발상용) 목적으로만 한정하여 활용해야 합니다."}, {"id": 74, "set": 3, "no": 14, "type": "choice", "concept": "연구제안서와 보고서의 워크플로우", "question": "연구제안서(Research Proposal)와 최종 마케팅조사 보고서(Final Report) 간의 논리적 연결 구조에 대한 설명으로 옳은 것은?", "options": ["연구제안서에는 이미 수집된 설문 데이터의 최종 통계 분석 결과와 전략적 결론이 반드시 완결된 형태로 수록되어 있어야 한다.", "연구제안서는 조사를 시작하기 전에 '왜(연구배경), 무엇을(연구목적), 어떻게(조사설계) 조사할 것인가'를 설계하여 발주처나 의사결정자를 설득하는 계획 문서이다.", "제안서 단계에서 설정한 연구 질문(RQ)은 최종 보고서의 설문 문항 설계나 데이터 분석 방향과 아무런 관련이 없다.", "실무에서 제안서는 형식적인 요식 행위일 뿐이며 수주 여부나 실제 프로젝트 예산 확보에는 영향을 주지 않는다."], "answer": 2, "explanation": "② 4주차 교안에 명시되어 있습니다. 제안서는 조사를 시작하기 전 연구의 방향과 타당성을 설득하는 기획서(축약본)로서 '배경 ⟶ 목적 ⟶ 방법(조사설계)'을 담고 있으며, 조사가 실제로 수행된 후 '결과 ⟶ 결론 및 제언'이 결합되어 최종 보고서로 완성됩니다.", "question_html": "연구제안서(Research Proposal)와 최종 마케팅조사 보고서(Final Report) 간의 논리적 연결 구조에 대한 설명으로 옳은 것은?", "options_html": ["연구제안서에는 이미 수집된 설문 데이터의 최종 통계 분석 결과와 전략적 결론이 반드시 완결된 형태로 수록되어 있어야 한다.", "연구제안서는 조사를 시작하기 전에 '왜(연구배경), 무엇을(연구목적), 어떻게(조사설계) 조사할 것인가'를 설계하여 발주처나 의사결정자를 설득하는 계획 문서이다.", "제안서 단계에서 설정한 연구 질문(RQ)은 최종 보고서의 설문 문항 설계나 데이터 분석 방향과 아무런 관련이 없다.", "실무에서 제안서는 형식적인 요식 행위일 뿐이며 수주 여부나 실제 프로젝트 예산 확보에는 영향을 주지 않는다."], "explanation_html": "② 4주차 교안에 명시되어 있습니다. 제안서는 조사를 시작하기 전 연구의 방향과 타당성을 설득하는 기획서(축약본)로서 '배경 ⟶ 목적 ⟶ 방법(조사설계)'을 담고 있으며, 조사가 실제로 수행된 후 '결과 ⟶ 결론 및 제언'이 결합되어 최종 보고서로 완성됩니다."}, {"id": 75, "set": 3, "no": 15, "type": "choice", "concept": "결과 해석 및 전략 도출의 평가 기준", "question": "마케팅 조사의 6단계 '결과 해석 및 전략 도출' 단계에서 마케터가 갖추어야 할 5대 유의사항(평가 기준)에 해당하지 않는 것은?", "options": ["해석 용이성 (의사결정자가 이해하기 쉽게 풀어서 설명되었는가)", "정확성 (통계 분석과 수치적 근거에 오류가 없는가)", "현실성 및 활용성 (실제 기업의 자원과 환경에서 실행 가능한 전략인가)", "독점성 (해당 조사 결과를 오직 조사 담당자 1인만 열람할 수 있도록 암호화하였는가)"], "answer": 4, "explanation": "④ 필기 노트 [5]주차 결과해석·전략도출 유의사항 5대 기준은 ① 해석 용이성, ② 정확성, ③ 활용성, ④ 현실성, ⑤ 의사결정 명료성입니다. 독점성은 마케팅 조사의 평가 기준이 아닙니다.", "question_html": "마케팅 조사의 6단계 '결과 해석 및 전략 도출' 단계에서 마케터가 갖추어야 할 5대 유의사항(평가 기준)에 해당하지 않는 것은?", "options_html": ["해석 용이성 (의사결정자가 이해하기 쉽게 풀어서 설명되었는가)", "정확성 (통계 분석과 수치적 근거에 오류가 없는가)", "현실성 및 활용성 (실제 기업의 자원과 환경에서 실행 가능한 전략인가)", "독점성 (해당 조사 결과를 오직 조사 담당자 1인만 열람할 수 있도록 암호화하였는가)"], "explanation_html": "④ 필기 노트 [5]주차 결과해석·전략도출 유의사항 5대 기준은 ① 해석 용이성, ② 정확성, ③ 활용성, ④ 현실성, ⑤ 의사결정 명료성입니다. 독점성은 마케팅 조사의 평가 기준이 아닙니다."}, {"id": 76, "set": 3, "no": 16, "type": "choice", "concept": "층화추출법 사례 분석 (비례 vs 불비례)", "question": "어느 마케팅 조사에서 대구 지역 대학생 300명을 표본추출하기 위해 연세대(원주) 1,000명, 고려대(세종) 2,000명, 계명대 7,000명으로 구성된 모집단에서 대학별 인원 비율을 무시하고 각 대학마다 똑같이 100명씩 균등하게 무작위 추출하였다. 이 표본추출 방식에 대한 설명으로 옳은 것은?", "options": ["단순무작위추출법이다.", "비례 층화표본추출법이다.", "불비례 층화표본추출법(Disproportionate Stratified Sampling)이다.", "비확률 편의표본추출법이다."], "answer": 3, "explanation": "③ 모집단을 대학별 층(Strata)으로 나눈 뒤 표본을 뽑았으므로 층화추출입니다. 이때 모집단의 실제 비율(1:2:7)대로 각각 30명, 60명, 210명을 뽑으면 '비례 층화추출'이고, 특정 소수 집단의 비교 분석을 위해 각 층에서 100명씩 똑같이 뽑는 방식은 '불비례 층화추출'에 해당합니다(필기 노트 [4]주차: 연대 고대 계대 100 100 100).", "question_html": "어느 마케팅 조사에서 대구 지역 대학생 300명을 표본추출하기 위해 연세대(원주) 1,000명, 고려대(세종) 2,000명, 계명대 7,000명으로 구성된 모집단에서 대학별 인원 비율을 무시하고 각 대학마다 똑같이 100명씩 균등하게 무작위 추출하였다. 이 표본추출 방식에 대한 설명으로 옳은 것은?", "options_html": ["단순무작위추출법이다.", "비례 층화표본추출법이다.", "불비례 층화표본추출법(Disproportionate Stratified Sampling)이다.", "비확률 편의표본추출법이다."], "explanation_html": "③ 모집단을 대학별 층(Strata)으로 나눈 뒤 표본을 뽑았으므로 층화추출입니다. 이때 모집단의 실제 비율(1:2:7)대로 각각 30명, 60명, 210명을 뽑으면 '비례 층화추출'이고, 특정 소수 집단의 비교 분석을 위해 각 층에서 100명씩 똑같이 뽑는 방식은 '불비례 층화추출'에 해당합니다(필기 노트 [4]주차: 연대 고대 계대 100 100 100)."}, {"id": 77, "set": 3, "no": 17, "type": "choice", "concept": "표준정규분포 Z값의 수학적 의미", "question": "평균이 $\\mu = 50$, 표준편차가 $\\sigma = 10$인 시험 점수 분포에서 어떤 학생의 점수가 $X = 70$점이었다. 이 학생의 표준화 점수(Z값)와 그 의미로 옳은 것은?", "options": ["$Z = +1.0$ (평균보다 1 표준편차 위에 위치함)", "$Z = +2.0$ (평균보다 2 표준편차 위에 위치함)", "$Z = -2.0$ (평균보다 2 표준편차 아래에 위치함)", "$Z = +0.2$ (전체 상위 20%에 위치함)"], "answer": 2, "explanation": "② 표준화 공식 $Z = \\frac{X - \\mu}{\\sigma} = \\frac{70 - 50}{10} = +2.0$입니다. 이는 해당 학생의 점수가 평균($50$)으로부터 표준편차($10$)의 2배만큼 높은 위치($\\mu + 2\\sigma$)에 있음을 뜻합니다.", "question_html": "평균이 $\\mu = 50$, 표준편차가 $\\sigma = 10$인 시험 점수 분포에서 어떤 학생의 점수가 $X = 70$점이었다. 이 학생의 표준화 점수(Z값)와 그 의미로 옳은 것은?", "options_html": ["$Z = +1.0$ (평균보다 1 표준편차 위에 위치함)", "$Z = +2.0$ (평균보다 2 표준편차 위에 위치함)", "$Z = -2.0$ (평균보다 2 표준편차 아래에 위치함)", "$Z = +0.2$ (전체 상위 20%에 위치함)"], "explanation_html": "② 표준화 공식 $Z = \\frac{X - \\mu}{\\sigma} = \\frac{70 - 50}{10} = +2.0$입니다. 이는 해당 학생의 점수가 평균($50$)으로부터 표준편차($10$)의 2배만큼 높은 위치($\\mu + 2\\sigma$)에 있음을 뜻합니다."}, {"id": 78, "set": 3, "no": 18, "type": "choice", "concept": "t-분포와 자유도의 관계", "question": "모분산을 알지 못하는 소표본 상황에서 평균을 검정할 때 사용하는 't-분포'의 특성에 대한 설명으로 옳지 않은 것은?", "options": ["t-분포는 평균이 0을 중심으로 좌우대칭인 종 모양이다.", "t-분포는 표본 크기가 작을수록($n < 30$) 자유도($n-1$)가 작아져서, 표준정규분포에 비해 꼬리 부분이 더 두꺼워진다.", "표본의 크기 $n$이 점차 커져서 30개 이상($n \\ge 30$)이 되면, t-분포는 사실상 표준정규분포(Z)와 거의 일치하게 된다.", "자유도가 아무리 무한대로 커지더라도 t-분포는 결코 표준정규분포와 같아질 수 없다."], "answer": 4, "explanation": "④ 필기 노트 [7]주차에 명시되어 있듯이 t-분포는 표본 크기 $n$이 커질수록 자유도($n-1$)가 증가하여 정규분포 모양에 접근하며, $n \\ge 30$이 되면 '표준정규분포와 거의 동일(수렴)'해집니다.", "question_html": "모분산을 알지 못하는 소표본 상황에서 평균을 검정할 때 사용하는 't-분포'의 특성에 대한 설명으로 옳지 않은 것은?", "options_html": ["t-분포는 평균이 0을 중심으로 좌우대칭인 종 모양이다.", "t-분포는 표본 크기가 작을수록($n < 30$) 자유도($n-1$)가 작아져서, 표준정규분포에 비해 꼬리 부분이 더 두꺼워진다.", "표본의 크기 $n$이 점차 커져서 30개 이상($n \\ge 30$)이 되면, t-분포는 사실상 표준정규분포(Z)와 거의 일치하게 된다.", "자유도가 아무리 무한대로 커지더라도 t-분포는 결코 표준정규분포와 같아질 수 없다."], "explanation_html": "④ 필기 노트 [7]주차에 명시되어 있듯이 t-분포는 표본 크기 $n$이 커질수록 자유도($n-1$)가 증가하여 정규분포 모양에 접근하며, $n \\ge 30$이 되면 '표준정규분포와 거의 동일(수렴)'해집니다."}, {"id": 79, "set": 3, "no": 19, "type": "choice", "concept": "F분포와 카이스퀘어 분포", "question": "필기 노트 [7]주차에 제시된 연속확률분포 중 '카이스퀘어($\\chi^2$) 분포'와 'F-분포'의 주된 통계적 용도를 바르게 연결한 것은?", "options": ["카이스퀘어 분포: 모평균 1개의 검정 / F-분포: 중앙값 검정", "카이스퀘어 분포: 범주형 변수의 독립성 검정 및 분산 검정 / F-분포: 두 개 이상 집단 간의 분산 비교(집단비교)", "카이스퀘어 분포: 텍스트 감성 분석 / F-분포: 파이썬 문법 검사", "두 분포 모두 오직 이산확률분포로만 사용된다."], "answer": 2, "explanation": "② 필기 노트 [7]주차에 'F분포, 카이스퀘어 : (집단비교) (분산)'이라고 명확히 메모되어 있습니다. 카이스퀘어 분포는 표본 분산의 분포 및 교차분석의 적합도/독립성 검정에 쓰이며, F-분포는 두 분산의 비율을 검정하여 집단 간 차이를 비교하는 분산분석(ANOVA)에 핵심적으로 사용됩니다.", "question_html": "필기 노트 [7]주차에 제시된 연속확률분포 중 '카이스퀘어($\\chi^2$) 분포'와 'F-분포'의 주된 통계적 용도를 바르게 연결한 것은?", "options_html": ["카이스퀘어 분포: 모평균 1개의 검정 / F-분포: 중앙값 검정", "카이스퀘어 분포: 범주형 변수의 독립성 검정 및 분산 검정 / F-분포: 두 개 이상 집단 간의 분산 비교(집단비교)", "카이스퀘어 분포: 텍스트 감성 분석 / F-분포: 파이썬 문법 검사", "두 분포 모두 오직 이산확률분포로만 사용된다."], "explanation_html": "② 필기 노트 [7]주차에 'F분포, 카이스퀘어 : (집단비교) (분산)'이라고 명확히 메모되어 있습니다. 카이스퀘어 분포는 표본 분산의 분포 및 교차분석의 적합도/독립성 검정에 쓰이며, F-분포는 두 분산의 비율을 검정하여 집단 간 차이를 비교하는 분산분석(ANOVA)에 핵심적으로 사용됩니다."}, {"id": 80, "set": 3, "no": 20, "type": "choice", "concept": "중심극한정리 실전 기출 문제", "question": "다음은 영남대학교 마케팅조사론 수업에서 교수가 제시한 퀴즈이다. 물음에 대한 올바른 답은?\n\n[Quiz] '모집단이 어떤 형태의 분포를 띠고 있는지 전혀 알 수 없는 상황에서, 영남대 학생식당 이용자 중 무작위로 36명의 표본을 추출하여 이들의 평균 만족도를 계산하였다. 이 과정을 수없이 반복하여 얻은 표본평균들($\\bar{X}$)의 분포는 궁극적으로 어떤 모양을 띠게 되는가?'", "options": ["모집단과 동일하게 알 수 없는 기형적 분포", "균등분포 (Uniform Distribution)", "정규분포 (Normal Distribution) 또는 표준정규분포 모양", "포아송 분포 (Poisson Distribution)"], "answer": 3, "explanation": "③ 필기 노트 [7]주차 맨 하단 기출 예시: 'Q. 모집단에서 표본 36개 추출 ⟶ 어느 모양? / A. 정규분포(표준정규분포)'. 중심극한정리에 의해 표본 크기가 30개 이상($n=36 \\ge 30$)이면 모집단의 원래 분포 형태와 무관하게 표본평균들의 분포는 대칭적인 종 모양의 정규분포에 근사합니다.", "question_html": "다음은 영남대학교 마케팅조사론 수업에서 교수가 제시한 퀴즈이다. 물음에 대한 올바른 답은?<br><br>[Quiz] '모집단이 어떤 형태의 분포를 띠고 있는지 전혀 알 수 없는 상황에서, 영남대 학생식당 이용자 중 무작위로 36명의 표본을 추출하여 이들의 평균 만족도를 계산하였다. 이 과정을 수없이 반복하여 얻은 표본평균들($\\bar{X}$)의 분포는 궁극적으로 어떤 모양을 띠게 되는가?'", "options_html": ["모집단과 동일하게 알 수 없는 기형적 분포", "균등분포 (Uniform Distribution)", "정규분포 (Normal Distribution) 또는 표준정규분포 모양", "포아송 분포 (Poisson Distribution)"], "explanation_html": "③ 필기 노트 [7]주차 맨 하단 기출 예시: 'Q. 모집단에서 표본 36개 추출 ⟶ 어느 모양? / A. 정규분포(표준정규분포)'. 중심극한정리에 의해 표본 크기가 30개 이상($n=36 \\ge 30$)이면 모집단의 원래 분포 형태와 무관하게 표본평균들의 분포는 대칭적인 종 모양의 정규분포에 근사합니다."}, {"id": 81, "set": 3, "no": 21, "type": "ox", "concept": "파이썬 주석 기호", "question": "파이썬 코드에서 특정 코드의 역할이나 메모  <code>1</code>, <code>False</code>는 정수 <code>0</code>으로 처리됩니다. 따라서 <code>True + True</code>는 에러 없이 숫자 <code>2</code>를 정상 반환합니다 (5주차 교안 실습 코드 참조)."}]}]};
    let currentSeason = 'season2'; // 'season2' or 'season1'
    let currentSetIndex = 1; // 1, 2, 3, or 0 (all)
    let currentQuestions = [];
    let userAnswers = {}; // qId -> selected option index or string
    let isSubmitted = false;
    let timerInterval = null;
    let timeRemaining = 45 * 60; // 45 minutes

    window.addEventListener('DOMContentLoaded', function() {
      switchSeason(currentSeason);
    });

    function switchSeason(seasonKey) {
      currentSeason = seasonKey;
      document.getElementById('btnSeason2').classList.toggle('active', seasonKey === 'season2');
      document.getElementById('btnSeason1').classList.toggle('active', seasonKey === 'season1');
      document.getElementById('seasonBadge').innerText = (seasonKey === 'season2') ? '시즌 2 고난도' : '시즌 1 기본핵심';
      switchSet(1);
    }

    function switchSet(setNum) {
      currentSetIndex = setNum;
      isSubmitted = false;
      userAnswers = {};

      // Update Tab UI
      const tabs = document.querySelectorAll('.tab-bar .tab-btn');
      tabs.forEach(function(t, idx) {
        if ((setNum === 1 && idx === 0) || (setNum === 2 && idx === 1) || 
            (setNum === 3 && idx === 2) || (setNum === 0 && idx === 3)) {
          t.classList.add('active');
        } else {
          t.classList.remove('active');
        }
      });

      // Hide banners
      document.getElementById('scoreBanner').style.display = 'none';
      document.getElementById('filterBar').style.display = 'none';

      const sets = DB[currentSeason] || [];
      if (setNum === 0) {
        currentQuestions = [];
        sets.forEach(function(s) { currentQuestions = currentQuestions.concat(s.questions); });
        timeRemaining = 120 * 60;
        document.getElementById('infoTitle').innerText = '전범위 통합 90제 실전 모의고사';
        document.getElementById('infoDesc').innerText = '1회, 2회, 3회를 총망라한 90문항 실전 평가입니다. 제한시간: 120분';
      } else {
        const sObj = sets.find(function(s) { return s.set_num === setNum; });
        currentQuestions = sObj ? sObj.questions : [];
        timeRemaining = 45 * 60;
        document.getElementById('infoTitle').innerText = sObj ? sObj.title : '';
        document.getElementById('infoDesc').innerText = sObj ? sObj.desc : '';
      }

      document.getElementById('totalQuestionsCount').innerText = currentQuestions.length;
      updateAnsweredCount();
      renderQuestions();
      startTimer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        if (timeRemaining > 0 && !isSubmitted) {
          timeRemaining--;
          updateTimerDisplay();
        }
      }, 1000);
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      document.getElementById('timerDisplay').innerText = 
        String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      currentQuestions.forEach(function(q, idx) {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = 'qCard_' + q.id;
        card.dataset.id = q.id;

        const isChoice = (q.type === 'choice');
        const typeBadge = isChoice ? '4지선다 (4점)' : 'OX형 (2점)';

        let optsHtml = '';
        if (isChoice) {
          const circs = ['①', '②', '③', '④'];
          q.options_html.forEach(function(optHtml, oIdx) {
            const optVal = oIdx + 1;
            optsHtml += `
              <label class="option-label" id="optLabel_${q.id}_${optVal}" onclick="selectAnswer(${q.id}, ${optVal})">
                <input type="radio" name="q_${q.id}" value="${optVal}" onchange="selectAnswer(${q.id}, ${optVal})">
                <span>${circs[oIdx]} ${optHtml}</span>
              </label>
            `;
          });
        } else {
          ['O', 'X'].forEach(function(oxVal) {
            optsHtml += `
              <label class="option-label" id="optLabel_${q.id}_${oxVal}" onclick="selectAnswer(${q.id}, '${oxVal}')">
                <input type="radio" name="q_${q.id}" value="${oxVal}" onchange="selectAnswer(${q.id}, '${oxVal}')">
                <span>[ ${oxVal} ]</span>
              </label>
            `;
          });
        }

        card.innerHTML = `
          <div class="q-badge-row">
            <span class="q-idx-badge">Q${idx + 1}</span>
            <span class="q-type-badge">${typeBadge}</span>
            <span class="q-concept-badge">${q.concept}</span>
            <span class="q-result-badge" id="resBadge_${q.id}"></span>
          </div>
          <div class="q-title">${q.question_html}</div>
          <div class="options-list">
            ${optsHtml}
          </div>
          <div class="expl-box" id="explBox_${q.id}">
            <div style="font-weight: 700; color: #1e3a8a; margin-bottom: 6px;">💡 정답 및 심층 해설</div>
            <div style="font-size: 13px; color: #334155;">${q.explanation_html}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function selectAnswer(qId, val) {
      if (isSubmitted) return;
      userAnswers[qId] = val;
      updateAnsweredCount();

      const card = document.getElementById('qCard_' + qId);
      if (!card) return;
      card.querySelectorAll('.option-label').forEach(function(lbl) { lbl.classList.remove('selected'); });
      const activeLabel = document.getElementById('optLabel_' + qId + '_' + val);
      if (activeLabel) {
        activeLabel.classList.add('selected');
        const inp = activeLabel.querySelector('input');
        if (inp) inp.checked = true;
      }
    }

    function updateAnsweredCount() {
      const count = Object.keys(userAnswers).length;
      document.getElementById('answeredCount').innerText = count;
    }

    function submitExam() {
      if (isSubmitted) {
        alert("이미 채점이 완료되었습니다.");
        return;
      }

      const unanswered = currentQuestions.length - Object.keys(userAnswers).length;
      if (unanswered > 0) {
        if (!confirm('아직 풀지 않은 문제가 ' + unanswered + '개 남아있습니다.\n제출하고 채점하시겠습니까?')) {
          return;
        }
      }

      isSubmitted = true;
      let score = 0;
      let totalMaxScore = 0;
      let correctCount = 0;
      let wrongCount = 0;
      let choiceCorrect = 0, choiceTotal = 0;
      let oxCorrect = 0, oxTotal = 0;

      currentQuestions.forEach(function(q) {
        const userAns = userAnswers[q.id];
        const isChoice = (q.type === 'choice');
        const qPoints = isChoice ? 4 : 2;
        totalMaxScore += qPoints;

        if (isChoice) choiceTotal++; else oxTotal++;

        const card = document.getElementById('qCard_' + q.id);
        const resBadge = document.getElementById('resBadge_' + q.id);
        const explBox = document.getElementById('explBox_' + q.id);

        const correctLabel = document.getElementById('optLabel_' + q.id + '_' + q.answer);
        if (correctLabel) correctLabel.classList.add('answer-reveal');

        const isCorrect = (userAns !== undefined && String(userAns) === String(q.answer));

        if (isCorrect) {
          score += qPoints;
          correctCount++;
          if (isChoice) choiceCorrect++; else oxCorrect++;
          card.classList.add('state-correct');
          card.dataset.state = 'correct';
          resBadge.className = 'q-result-badge correct';
          resBadge.innerText = '⭕ 정답 (+ ' + qPoints + '점)';
        } else {
          wrongCount++;
          card.classList.add('state-wrong');
          card.dataset.state = 'wrong';
          resBadge.className = 'q-result-badge wrong';
          resBadge.innerText = '❌ 오답 (0점)';
          if (userAns !== undefined) {
            const wrongLabel = document.getElementById('optLabel_' + q.id + '_' + userAns);
            if (wrongLabel) wrongLabel.classList.add('user-wrong');
          }
        }

        explBox.classList.add('show');
      });

      document.querySelectorAll('input[type="radio"]').forEach(function(inp) { inp.disabled = true; });

      const finalScoreScaled = Math.round((score / totalMaxScore) * 100);
      const accRate = Math.round((correctCount / currentQuestions.length) * 100);

      let grade = 'A+';
      if (finalScoreScaled < 60) grade = 'F';
      else if (finalScoreScaled < 70) grade = 'D';
      else if (finalScoreScaled < 80) grade = 'C+';
      else if (finalScoreScaled < 85) grade = 'B0';
      else if (finalScoreScaled < 90) grade = 'B+';
      else if (finalScoreScaled < 95) grade = 'A0';
      else grade = 'A+';

      document.getElementById('bannerTotalScore').innerText = finalScoreScaled + '점';
      document.getElementById('scoreChoice').innerText = choiceCorrect + ' / ' + choiceTotal;
      document.getElementById('scoreOX').innerText = oxCorrect + ' / ' + oxTotal;
      document.getElementById('scoreRate').innerText = accRate + '%';
      document.getElementById('scoreGrade').innerText = grade;

      document.getElementById('cntAll').innerText = currentQuestions.length;
      document.getElementById('cntWrong').innerText = wrongCount;
      document.getElementById('cntCorrect').innerText = correctCount;

      document.getElementById('scoreBanner').style.display = 'block';
      document.getElementById('filterBar').style.display = 'flex';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterQuestions(type) {
      const btns = document.querySelectorAll('.filter-btn');
      btns.forEach(function(b) { b.classList.remove('active'); });
      if (event && event.target) event.target.classList.add('active');

      const cards = document.querySelectorAll('.q-card');
      cards.forEach(function(card) {
        const state = card.dataset.state;
        if (type === 'all') {
          card.style.display = 'block';
        } else if (type === 'wrong') {
          card.style.display = (state === 'wrong') ? 'block' : 'none';
        } else if (type === 'correct') {
          card.style.display = (state === 'correct') ? 'block' : 'none';
        }
      });
    }

    function resetExam() {
      if (confirm('모든 답안을 지우고 시험을 처음부터 다시 시작하시겠습니까?')) {
        switchSet(currentSetIndex);
      }
    }
  </script>
</body>
</html>
