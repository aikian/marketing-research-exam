한 핵심 상권(홍대/강남)의 성공 사례를 전국 소비자의 일반적 특성으로 지나치게 일반화한 '대표성 편향(Representativeness Bias)'", "과거 10년간의 오프라인 유통 매장 매출 데이터를 지나치게 신뢰한 '역사적 오염'", "설문 문항에서 긍정적 수식어를 사용하여 발생한 '유도 질문 오류'", "표본오류가 0에 가까워 비표본오류가 전무하다고 가정한 '군집추출 오류'"], "answer": 1, "explanation": "① 특정하고 이례적인 하위 집단(홍대·강남의 패션 고관여 20대)의 반응이 전체 모집단(전국 중소도시의 다양한 연령층)을 대표한다고 경솔하게 유추한 전형적인 '대표성 편향(Representativeness Bias)'입니다.", "question_html": "패션 플랫폼 무신사가 자체 PB 브랜드인 '무신사 스탠다드'의 오프라인 플래그십 매장을 홍대와 강남에 오픈하여 대성공을 거두었다. 이를 바탕으로 경영진이 '전국 모든 중소도시 및 지방 상권에서도 무신사 스탠다드가 무조건 성공할 것'이라고 판단하여 공격적인 전국 출점을 결정하였다. 이 의사결정에 내포된 휴리스틱 편향은?", "options_html": ["트렌드에 민감한 20대 유동인구가 밀집한 핵심 상권(홍대/강남)의 성공 사례를 전국 소비자의 일반적 특성으로 지나치게 일반화한 '대표성 편향(Representativeness Bias)'", "과거 10년간의 오프라인 유통 매장 매출 데이터를 지나치게 신뢰한 '역사적 오염'", "설문 문항에서 긍정적 수식어를 사용하여 발생한 '유도 질문 오류'", "표본오류가 0에 가까워 비표본오류가 전무하다고 가정한 '군집추출 오류'"], "explanation_html": "① 특정하고 이례적인 하위 집단(홍대·강남의 패션 고관여 20대)의 반응이 전체 모집단(전국 중소도시의 다양한 연령층)을 대표한다고 경솔하게 유추한 전형적인 '대표성 편향(Representativeness Bias)'입니다."}, {"id": 262, "set": 3, "no": 2, "type": "choice", "concept": "위워크(WeWork)의 과대 포장과 공유오피스 시장 조사 실패", "question": "공유오피스 기업 위워크(WeWork)는 단순한 '부동산 전대업(Lease)'임에도 불구하고 스스로를 '글로벌 테크 플랫폼'으로 포장하여 한때 470억 달러의 기업가치를 인정받았다가 파산에 직면하였다. 마케팅 조사의 연구 문제 정의 및 데이터 관점에서 위워크 사태의 본질적 교훈은?", "options": ["표본 크기 $n$이 30 미만이어서 중심극한정리가 작동하지 않았다.", "화려한 수사적 브랜드 이미지(Tech Hype)에 가려져, 장기 임차 부채와 단기 전대 수익 구조라는 비즈니스 모델의 근본적 재무 현실과 고객 지속가능성(Real Problem)을 객관적 데이터로 검증하지 못했다.", "등간척도 대신 비율척도를 사용하여 설문 조사를 설계했기 때문이다.", "군집표본추출 대신 층화표본추출을 사용하여 표본오류가 증가했기 때문이다."], "answer": 2, "explanation": "② 필기 노트 [2]주차 연구문제 정의 깔때기 구조: 겉으로 드러난 화려한 현상(Symptom/Hype: 테크 기업 이미지)에 현혹되지 않고, 밑바탕에 깔린 근본 원인(Real Problem: 경기 침체 시 공실률 급증과 장기 리스 고정비 부담)을 객관적 시장 조사와 데이터로 검증해야 한다는 핵심 교훈입니다.", "question_html": "공유오피스 기업 위워크(WeWork)는 단순한 '부동산 전대업(Lease)'임에도 불구하고 스스로를 '글로벌 테크 플랫폼'으로 포장하여 한때 470억 달러의 기업가치를 인정받았다가 파산에 직면하였다. 마케팅 조사의 연구 문제 정의 및 데이터 관점에서 위워크 사태의 본질적 교훈은?", "options_html": ["표본 크기 $n$이 30 미만이어서 중심극한정리가 작동하지 않았다.", "화려한 수사적 브랜드 이미지(Tech Hype)에 가려져, 장기 임차 부채와 단기 전대 수익 구조라는 비즈니스 모델의 근본적 재무 현실과 고객 지속가능성(Real Problem)을 객관적 데이터로 검증하지 못했다.", "등간척도 대신 비율척도를 사용하여 설문 조사를 설계했기 때문이다.", "군집표본추출 대신 층화표본추출을 사용하여 표본오류가 증가했기 때문이다."], "explanation_html": "② 필기 노트 [2]주차 연구문제 정의 깔때기 구조: 겉으로 드러난 화려한 현상(Symptom/Hype: 테크 기업 이미지)에 현혹되지 않고, 밑바탕에 깔린 근본 원인(Real Problem: 경기 침체 시 공실률 급증과 장기 리스 고정비 부담)을 객관적 시장 조사와 데이터로 검증해야 한다는 핵심 교훈입니다."}, {"id": 263, "set": 3, "no": 3, "type": "choice", "concept": "ESG 마케팅과 그린워싱(Greenwashing) 태도-행동 괴리", "question": "소비자들을 대상으로 한 설문조사에서는 응답자의 85%가 '친환경 제품에 20% 이상의 프리미엄 가격을 지불할 의향이 있다'고 응답했으나, 실제 매장 판매 실적에서는 일반 저가 제품이 압도적으로 팔려나갔다. 이와 같은 '태도-행동 괴리(Attitude-Behavior Gap)'가 발생하는 가장 주된 조사론적 원인은?", "options": ["사회적 바람직성 편향(Social Desirability Bias)으로 인해 응답자가 설문에서는 도덕적으로 올바른 답변을 하고, 실제 구매에서는 경제적 실리를 추구하기 때문이다.", "설문 조사에서 명목척도를 사용하지 않고 비율척도를 사용했기 때문이다.", "실험 처치에서 통제집단을 사전에 무작위로 배정했기 때문이다.", "단순무작위추출법을 적용하여 표본 크기가 과도하게 커졌기 때문이다."], "answer": 1, "explanation": "① 환경 보호나 윤리적 소비 문항은 응답자가 사회적으로 착하고 도덕적으로 보이도록 응답하는 '사회적 바람직성 편향(Social Desirability Bias)'이 극심하게 나타납니다. 따라서 설문 응답(선언적 태도)과 실제 POS 구매 데이터(행동 관찰) 간의 괴리를 항상 보정해야 합니다.", "question_html": "소비자들을 대상으로 한 설문조사에서는 응답자의 85%가 '친환경 제품에 20% 이상의 프리미엄 가격을 지불할 의향이 있다'고 응답했으나, 실제 매장 판매 실적에서는 일반 저가 제품이 압도적으로 팔려나갔다. 이와 같은 '태도-행동 괴리(Attitude-Behavior Gap)'가 발생하는 가장 주된 조사론적 원인은?", "options_html": ["사회적 바람직성 편향(Social Desirability Bias)으로 인해 응답자가 설문에서는 도덕적으로 올바른 답변을 하고, 실제 구매에서는 경제적 실리를 추구하기 때문이다.", "설문 조사에서 명목척도를 사용하지 않고 비율척도를 사용했기 때문이다.", "실험 처치에서 통제집단을 사전에 무작위로 배정했기 때문이다.", "단순무작위추출법을 적용하여 표본 크기가 과도하게 커졌기 때문이다."], "explanation_html": "① 환경 보호나 윤리적 소비 문항은 응답자가 사회적으로 착하고 도덕적으로 보이도록 응답하는 '사회적 바람직성 편향(Social Desirability Bias)'이 극심하게 나타납니다. 따라서 설문 응답(선언적 태도)과 실제 POS 구매 데이터(행동 관찰) 간의 괴리를 항상 보정해야 합니다."}, {"id": 264, "set": 3, "no": 4, "type": "choice", "concept": "스타벅스 사이렌 오더 대기 시간과 기계적 관찰법", "question": "스타벅스가 매장 내 고객 혼잡도와 주문 대기 시간을 최적화하기 위해, 모바일 앱의 사이렌 오더 주문 시점부터 매장 바리스타의 음료 제조 완료 바코드 스캔 시점까지의 디지털 로그 데이터를 전수 기록·분석하였다. 이 조사 기법에 대한 설명으로 가장 적절한 것은?", "options": ["인간 조사원의 주관적 왜곡이나 응답자의 회상 오류(Recall Error)가 배제된 정밀한 '기계적/디지털 직접 관찰법'에 해당한다.", "고객의 심리적 불만 이유와 내면적 인지 과정을 즉각적으로 규명할 수 있는 정성적 탐색 조사이다.", "모집단 명부(Sampling Frame)가 전혀 존재하지 않아 표본오류를 측정할 수 없는 비확률 눈덩이 표본추출이다.", "외생변수를 완벽히 통제한 진실험설계(True Experimental Design)에 해당한다."], "answer": 1, "explanation": "① 필기 노트 [3]주차 관찰법: POS 바코드 시스템이나 디지털 로그를 활용한 측정은 응답자의 기억 왜곡이나 조사원의 주관적 개입이 없는 객관적인 '기계적 직접 관찰조사'입니다. 단, 관찰법의 한계상 고객이 대기 시간 동안 느낀 내면의 심리적 감정(왜 불만인지)은 직접적으로 측정할 수 없습니다.", "question_html": "스타벅스가 매장 내 고객 혼잡도와 주문 대기 시간을 최적화하기 위해, 모바일 앱의 사이렌 오더 주문 시점부터 매장 바리스타의 음료 제조 완료 바코드 스캔 시점까지의 디지털 로그 데이터를 전수 기록·분석하였다. 이 조사 기법에 대한 설명으로 가장 적절한 것은?", "options_html": ["인간 조사원의 주관적 왜곡이나 응답자의 회상 오류(Recall Error)가 배제된 정밀한 '기계적/디지털 직접 관찰법'에 해당한다.", "고객의 심리적 불만 이유와 내면적 인지 과정을 즉각적으로 규명할 수 있는 정성적 탐색 조사이다.", "모집단 명부(Sampling Frame)가 전혀 존재하지 않아 표본오류를 측정할 수 없는 비확률 눈덩이 표본추출이다.", "외생변수를 완벽히 통제한 진실험설계(True Experimental Design)에 해당한다."], "explanation_html": "① 필기 노트 [3]주차 관찰법: POS 바코드 시스템이나 디지털 로그를 활용한 측정은 응답자의 기억 왜곡이나 조사원의 주관적 개입이 없는 객관적인 '기계적 직접 관찰조사'입니다. 단, 관찰법의 한계상 고객이 대기 시간 동안 느낀 내면의 심리적 감정(왜 불만인지)은 직접적으로 측정할 수 없습니다."}, {"id": 265, "set": 3, "no": 5, "type": "choice", "concept": "무응답 편향(Non-response Bias)과 사후 추적 검증", "question": "대기업 멤버십 회원 10,000명에게 이메일 고객만족도 설문지를 발송하였으나, 회수율이 8%(800명)에 불과하였다. 분석 결과 평균 만족도가 4.8점(5점 만점)으로 매우 높게 나타났다. 이 결과에 대한 통계학적 해석과 대응 방안으로 가장 올바른 것은?", "options": ["표본 크기가 800명으로 $n \\ge 30$을 훨씬 초과하므로 중심극한정리에 의해 결과는 모집단을 완벽히 대표한다.", "서비스에 극도로 만족한 적극적 팬층만 주로 응답하고 불만족 고객이나 무관심층은 대거 이탈한 '무응답 편향(Non-response Bias)'의 가능성이 높으므로, 미응답자 중 일부를 표본 추출하여 비응답자 사후 조사(Follow-up)를 진행해야 한다.", "회수율이 8%이므로 표본오류는 정확히 92%이며, 모든 데이터는 즉시 전량 폐기해야 한다.", "응답자 수가 충분하므로 분산분석(ANOVA) 대신 카이스퀘어 독립성 검정을 수행하면 무응답 왜곡이 자동으로 사라진다."], "answer": 2, "explanation": "② 필기 노트 [6]주차 비표본오류: 회수율이 낮을 때 발생하는 '무응답 편향'은 응답 집단과 비응답 집단 간에 체계적인 특성 차이(예: 고만족 고객만 자발적 응답)가 존재할 위험이 큽니다. 따라서 미응답자 일부를 전화나 대면으로 추가 추적 조사(Follow-up)하여 응답자 집단과의 통계적 차이를 검증해야 합니다.", "question_html": "대기업 멤버십 회원 10,000명에게 이메일 고객만족도 설문지를 발송하였으나, 회수율이 8%(800명)에 불과하였다. 분석 결과 평균 만족도가 4.8점(5점 만점)으로 매우 높게 나타났다. 이 결과에 대한 통계학적 해석과 대응 방안으로 가장 올바른 것은?", "options_html": ["표본 크기가 800명으로 $n \\ge 30$을 훨씬 초과하므로 중심극한정리에 의해 결과는 모집단을 완벽히 대표한다.", "서비스에 극도로 만족한 적극적 팬층만 주로 응답하고 불만족 고객이나 무관심층은 대거 이탈한 '무응답 편향(Non-response Bias)'의 가능성이 높으므로, 미응답자 중 일부를 표본 추출하여 비응답자 사후 조사(Follow-up)를 진행해야 한다.", "회수율이 8%이므로 표본오류는 정확히 92%이며, 모든 데이터는 즉시 전량 폐기해야 한다.", "응답자 수가 충분하므로 분산분석(ANOVA) 대신 카이스퀘어 독립성 검정을 수행하면 무응답 왜곡이 자동으로 사라진다."], "explanation_html": "② 필기 노트 [6]주차 비표본오류: 회수율이 낮을 때 발생하는 '무응답 편향'은 응답 집단과 비응답 집단 간에 체계적인 특성 차이(예: 고만족 고객만 자발적 응답)가 존재할 위험이 큽니다. 따라서 미응답자 일부를 전화나 대면으로 추가 추적 조사(Follow-up)하여 응답자 집단과의 통계적 차이를 검증해야 합니다."}, {"id": 266, "set": 3, "no": 6, "type": "choice", "concept": "가설검정 연구가설 vs 귀무가설의 대립 구조", "question": "어느 화장품 브랜드가 '새로운 레티놀 세럼이 기존 세럼보다 피부 탄력 개선 효과가 더 뛰어날 것이다'라는 신제품 효과를 과학적으로 입증하고자 한다. 통계적 가설 검정 절차에 대한 설명으로 가장 옳은 것은?", "options": ["귀무가설($H_0$): '새로운 세럼과 기존 세럼 간에 피부 탄력 개선 효과의 차이가 없다($\\mu_1 = \\mu_2$)'로 설정한다.", "연구가설($H_1$): '새로운 세럼과 기존 세럼의 효과 차이는 0이다'로 설정한다.", "연구자는 자신이 입증하고 싶은 주장인 '효과가 더 뛰어나다'를 귀무가설($H_0$)로 설정하여 이를 채택하려고 노력한다.", "유의확률(p-value)이 유의수준 $\\alpha = 0.05$보다 클 때 연구가설이 통계적으로 지지된다."], "answer": 1, "explanation": "① 필기 노트 [7]주차 가설 설정: '귀무가설($H_0$)'은 '효과가 없다, 차이가 없다($\\mu_1 = \\mu_2$)'는 현상 유지의 가설이며, 연구자가 입증하고자 하는 실질적 가설은 '대립가설/연구가설($H_1$)'입니다. p-value가 $\\alpha(0.05)$보다 작을 때 귀무가설을 기각하고 대립가설을 채택합니다.", "question_html": "어느 화장품 브랜드가 '새로운 레티놀 세럼이 기존 세럼보다 피부 탄력 개선 효과가 더 뛰어날 것이다'라는 신제품 효과를 과학적으로 입증하고자 한다. 통계적 가설 검정 절차에 대한 설명으로 가장 옳은 것은?", "options_html": ["귀무가설($H_0$): '새로운 세럼과 기존 세럼 간에 피부 탄력 개선 효과의 차이가 없다($\\mu_1 = \\mu_2$)'로 설정한다.", "연구가설($H_1$): '새로운 세럼과 기존 세럼의 효과 차이는 0이다'로 설정한다.", "연구자는 자신이 입증하고 싶은 주장인 '효과가 더 뛰어나다'를 귀무가설($H_0$)로 설정하여 이를 채택하려고 노력한다.", "유의확률(p-value)이 유의수준 $\\alpha = 0.05$보다 클 때 연구가설이 통계적으로 지지된다."], "explanation_html": "① 필기 노트 [7]주차 가설 설정: '귀무가설($H_0$)'은 '효과가 없다, 차이가 없다($\\mu_1 = \\mu_2$)'는 현상 유지의 가설이며, 연구자가 입증하고자 하는 실질적 가설은 '대립가설/연구가설($H_1$)'입니다. p-value가 $\\alpha(0.05)$보다 작을 때 귀무가설을 기각하고 대립가설을 채택합니다."}, {"id": 267, "set": 3, "no": 7, "type": "choice", "concept": "가설검정 분석 기법 선택 매트릭스", "question": "마케팅 연구 과제와 이에 적용해야 할 통계 분석 기법의 연결이 가장 올바른 것은?", "options": ["3개 이상의 서로 다른 광고 모델(아이돌, 배우, 인플루언서)에 따른 소비자 브랜드 태도 평균 점수 차이 검정 ➔ 일원배치 분산분석(One-way ANOVA)", "스마트폰 브랜드(삼성, 애플)와 사용 통신사(SKT, KT, LGU+) 간의 관련성 분석 ➔ 독립표본 t-검정(Independent two-sample t-test)", "가격 할인율(%)이 실제 판매 수량(개)에 미치는 영향 분석 ➔ 교차분석 및 카이스퀘어 독립성 검정", "남성과 여성 두 집단 간의 1회 평균 커피 소비 금액 차이 검정 ➔ F-검정 기반 분산분석(ANOVA)만 사용 가능하고 t-검정은 사용 불가"], "answer": 1, "explanation": "① 독립변수가 '3개 이상의 집단(아이돌, 배우, 인플루언서)'이고 종속변수가 연속형 점수(브랜드 태도)이므로 '일원배치 분산분석(One-way ANOVA)'을 적용해야 합니다. ②는 두 범주형 변수이므로 카이스퀘어 교차분석, ③은 두 연속형 변수이므로 회귀분석/상관분석, ④는 두 독립집단 평균 비교이므로 독립표본 t-검정이 표준입니다.", "question_html": "마케팅 연구 과제와 이에 적용해야 할 통계 분석 기법의 연결이 가장 올바른 것은?", "options_html": ["3개 이상의 서로 다른 광고 모델(아이돌, 배우, 인플루언서)에 따른 소비자 브랜드 태도 평균 점수 차이 검정 ➔ 일원배치 분산분석(One-way ANOVA)", "스마트폰 브랜드(삼성, 애플)와 사용 통신사(SKT, KT, LGU+) 간의 관련성 분석 ➔ 독립표본 t-검정(Independent two-sample t-test)", "가격 할인율(%)이 실제 판매 수량(개)에 미치는 영향 분석 ➔ 교차분석 및 카이스퀘어 독립성 검정", "남성과 여성 두 집단 간의 1회 평균 커피 소비 금액 차이 검정 ➔ F-검정 기반 분산분석(ANOVA)만 사용 가능하고 t-검정은 사용 불가"], "explanation_html": "① 독립변수가 '3개 이상의 집단(아이돌, 배우, 인플루언서)'이고 종속변수가 연속형 점수(브랜드 태도)이므로 '일원배치 분산분석(One-way ANOVA)'을 적용해야 합니다. ②는 두 범주형 변수이므로 카이스퀘어 교차분석, ③은 두 연속형 변수이므로 회귀분석/상관분석, ④는 두 독립집단 평균 비교이므로 독립표본 t-검정이 표준입니다."}, {"id": 268, "set": 3, "no": 8, "type": "choice", "concept": "모집단-표본-모수-통계량 기호 매칭", "question": "통계학에서 모집단의 특성을 나타내는 '모수(Parameter)'와 표본의 특성을 나타내는 '통계량(Statistic)'의 기호 매칭으로 가장 옳은 것은?", "options": ["모평균: $\\bar{X}$ / 표본평균: $\\mu$", "모분산: $\\sigma^2$ / 표본분산: $s^2$", "모표준편차: $s$ / 표본표준편차: $\\sigma$", "모비율: $\\hat{p}$ / 표본비율: $P$"], "answer": 2, "explanation": "② 필기 노트 [7]주차 기호 정리: 모수는 그리스 문자(모평균 $\\mu$, 모분산 $\\sigma^2$, 모표준편차 $\\sigma$, 모비율 $P$), 통계량은 영문자(표본평균 $\\bar{X}$, 표본분산 $s^2$, 표본표준편차 $s$, 표본비율 $\\hat{p}$ 또는 $p$)를 사용합니다.", "question_html": "통계학에서 모집단의 특성을 나타내는 '모수(Parameter)'와 표본의 특성을 나타내는 '통계량(Statistic)'의 기호 매칭으로 가장 옳은 것은?", "options_html": ["모평균: $\\bar{X}$ / 표본평균: $\\mu$", "모분산: $\\sigma^2$ / 표본분산: $s^2$", "모표준편차: $s$ / 표본표준편차: $\\sigma$", "모비율: $\\hat{p}$ / 표본비율: $P$"], "explanation_html": "② 필기 노트 [7]주차 기호 정리: 모수는 그리스 문자(모평균 $\\mu$, 모분산 $\\sigma^2$, 모표준편차 $\\sigma$, 모비율 $P$), 통계량은 영문자(표본평균 $\\bar{X}$, 표본분산 $s^2$, 표본표준편차 $s$, 표본비율 $\\hat{p}$ 또는 $p$)를 사용합니다."}, {"id": 269, "set": 3, "no": 9, "type": "choice", "concept": "표본추출틀(Sampling Frame) 오차 구조", "question": "다음 그림은 목표 모집단(Target Population)과 실제 조사에 사용된 표본추출틀(Sampling Frame) 간의 포함 관계를 나타낸 벤 다이어그램이다. (A) 영역에 해당하는 표본추출틀 오차의 명칭과 사례로 가장 적절한 것은?\n\n[다이어그램 설명]\n- 전체 사각형: 대한민국 성인 전체\n- 원 1: 모집단 (실제 신용카드 발급 자격이 있는 성인)\n- 원 2: 표본추출틀 (전국 유선전화 가입자 명부)\n- 영역 (A): 표본추출틀에는 포함되어 있으나 모집단 자격이 없는 영역 (원 2에만 속한 부분)", "options": ["과대 포함(Over-coverage) 오차: 신용카드 발급 자격이 없는 미성년자나 파산자가 명부에 포함된 경우", "과소 포함(Under-coverage) 오차: 유선전화가 없고 휴대전화만 보유한 20~30대 청년층이 명부에서 누락된 경우", "무응답 편향(Non-response Bias): 전화를 걸었으나 부재중이어서 응답을 받지 못한 경우", "측정 도구 오류: 설문지 질문 문항이 너무 길어서 발생한 오류"], "answer": 1, "explanation": "① 필기 노트 [6]주차 표본추출틀 오차: 표본추출틀에 등록되어 있으나 실제 연구 대상 모집단에 속하지 않는 대상이 추출되는 것을 '과대 포함(Over-coverage)'이라고 합니다. 반대로 모집단에 속하지만 명부에 누락된 것은 '과소 포함(Under-coverage)'입니다.", "question_html": "다음 그림은 목표 모집단(Target Population)과 실제 조사에 사용된 표본추출틀(Sampling Frame) 간의 포함 관계를 나타낸 벤 다이어그램이다. (A) 영역에 해당하는 표본추출틀 오차의 명칭과 사례로 가장 적절한 것은?<br><br>[다이어그램 설명]<br>- 전체 사각형: 대한민국 성인 전체<br>- 원 1: 모집단 (실제 신용카드 발급 자격이 있는 성인)<br>- 원 2: 표본추출틀 (전국 유선전화 가입자 명부)<br>- 영역 (A): 표본추출틀에는 포함되어 있으나 모집단 자격이 없는 영역 (원 2에만 속한 부분)", "options_html": ["과대 포함(Over-coverage) 오차: 신용카드 발급 자격이 없는 미성년자나 파산자가 명부에 포함된 경우", "과소 포함(Under-coverage) 오차: 유선전화가 없고 휴대전화만 보유한 20~30대 청년층이 명부에서 누락된 경우", "무응답 편향(Non-response Bias): 전화를 걸었으나 부재중이어서 응답을 받지 못한 경우", "측정 도구 오류: 설문지 질문 문항이 너무 길어서 발생한 오류"], "explanation_html": "① 필기 노트 [6]주차 표본추출틀 오차: 표본추출틀에 등록되어 있으나 실제 연구 대상 모집단에 속하지 않는 대상이 추출되는 것을 '과대 포함(Over-coverage)'이라고 합니다. 반대로 모집단에 속하지만 명부에 누락된 것은 '과소 포함(Under-coverage)'입니다."}, {"id": 270, "set": 3, "no": 10, "type": "choice", "concept": "외생변수 통제 방법: 매칭 vs 무작위화", "question": "실험 설계에서 피험자들의 사전 개인차(지능, 소득, 브랜드 사전 친숙도 등)가 종속변수에 미치는 교란 효과를 차단하기 위해 사용하는 기법에 대한 설명으로 가장 옳지 않은 것은?", "options": ["무작위 할당(Randomization)은 대규모 피험자를 실험집단과 통제집단에 확률적으로 골고루 배정하여, 연구자가 미처 인지하지 못한 외생변수들까지 통계적으로 균등화시키는 가장 강력한 통제 기법이다.", "매칭(Matching)은 연령이나 성별 등 핵심 외생변수를 기준으로 실험집단과 통제집단의 피험자를 1:1로 짝지어 배정하는 방법이다.", "통제집단 사후검사 설계(Posttest-Only Control Group Design)는 무작위 할당이 보장된다면 사전 측정이 없어도 내적 타당성을 확보할 수 있는 진실험설계이다.", "사전 측정을 실시하면 피험자의 사전 상태를 파악할 수 있으므로 시험 효과(Testing Effect)가 원천적으로 완전히 제거되는 장점이 있다."], "answer": 4, "explanation": "④ 필기 노트 [3]주차 시험 효과(Testing Effect): 사전 검사(Pre-test)를 실시하면 피험자가 본 실험의 목적을 눈치채거나 질문에 익숙해지는 '시험 효과'가 오히려 발생할 수 있습니다. 시험 효과가 완전히 제거된다는 설명은 틀렸습니다.", "question_html": "실험 설계에서 피험자들의 사전 개인차(지능, 소득, 브랜드 사전 친숙도 등)가 종속변수에 미치는 교란 효과를 차단하기 위해 사용하는 기법에 대한 설명으로 가장 옳지 않은 것은?", "options_html": ["무작위 할당(Randomization)은 대규모 피험자를 실험집단과 통제집단에 확률적으로 골고루 배정하여, 연구자가 미처 인지하지 못한 외생변수들까지 통계적으로 균등화시키는 가장 강력한 통제 기법이다.", "매칭(Matching)은 연령이나 성별 등 핵심 외생변수를 기준으로 실험집단과 통제집단의 피험자를 1:1로 짝지어 배정하는 방법이다.", "통제집단 사후검사 설계(Posttest-Only Control Group Design)는 무작위 할당이 보장된다면 사전 측정이 없어도 내적 타당성을 확보할 수 있는 진실험설계이다.", "사전 측정을 실시하면 피험자의 사전 상태를 파악할 수 있으므로 시험 효과(Testing Effect)가 원천적으로 완전히 제거되는 장점이 있다."], "explanation_html": "④ 필기 노트 [3]주차 시험 효과(Testing Effect): 사전 검사(Pre-test)를 실시하면 피험자가 본 실험의 목적을 눈치채거나 질문에 익숙해지는 '시험 효과'가 오히려 발생할 수 있습니다. 시험 효과가 완전히 제거된다는 설명은 틀렸습니다."}, {"id": 271, "set": 3, "no": 11, "type": "choice", "concept": "1차 자료 vs 2차 자료 비용-시간 트레이드오프", "question": "신규 음료 제품 런칭을 앞둔 마케팅 팀장이 데이터 수집 계획을 수립할 때, 필기 노트 [3]주차의 '1차 자료 vs 2차 자료' 원칙에 입각하여 내린 결정으로 가장 타당한 것은?", "options": ["조사의 신선도와 신뢰성이 가장 중요하므로, 외부 통계청 자료나 POS 데이터는 일절 보지 않고 즉시 대규모 전국 가구 1차 방문 면접 조사부터 착수한다.", "비용과 시간을 절감하기 위해 먼저 사내 CRM 데이터와 통계청 인구 센서스 등 기존 2차 자료를 철저히 검토하고, 해결되지 않는 고유한 신제품 선호도 문제에 한하여 1차 정량 조사를 설계한다.", "2차 자료는 항상 1차 자료보다 정확하므로 설문조사나 실험은 영구히 생략한다.", "1차 자료는 과거에 이미 수집된 자료이므로 수집 비용이 거의 들지 않는다."], "answer": 2, "explanation": "② 필기 노트 [3]주차 자료 수집 원칙: 조사는 '내부/외부 2차 자료 수집 ➔ 미해결 과제 정의 ➔ 1차 자료(설문, 실험 등) 수집'의 순서로 진행하는 것이 비용과 시간($V - C > 0$) 면에서 가장 경제적이고 효율적입니다.", "question_html": "신규 음료 제품 런칭을 앞둔 마케팅 팀장이 데이터 수집 계획을 수립할 때, 필기 노트 [3]주차의 '1차 자료 vs 2차 자료' 원칙에 입각하여 내린 결정으로 가장 타당한 것은?", "options_html": ["조사의 신선도와 신뢰성이 가장 중요하므로, 외부 통계청 자료나 POS 데이터는 일절 보지 않고 즉시 대규모 전국 가구 1차 방문 면접 조사부터 착수한다.", "비용과 시간을 절감하기 위해 먼저 사내 CRM 데이터와 통계청 인구 센서스 등 기존 2차 자료를 철저히 검토하고, 해결되지 않는 고유한 신제품 선호도 문제에 한하여 1차 정량 조사를 설계한다.", "2차 자료는 항상 1차 자료보다 정확하므로 설문조사나 실험은 영구히 생략한다.", "1차 자료는 과거에 이미 수집된 자료이므로 수집 비용이 거의 들지 않는다."], "explanation_html": "② 필기 노트 [3]주차 자료 수집 원칙: 조사는 '내부/외부 2차 자료 수집 ➔ 미해결 과제 정의 ➔ 1차 자료(설문, 실험 등) 수집'의 순서로 진행하는 것이 비용과 시간($V - C > 0$) 면에서 가장 경제적이고 효율적입니다."}, {"id": 272, "set": 3, "no": 12, "type": "choice", "concept": "상관관계와 인과관계의 구별 (아이스크림과 익사사고)", "question": "어느 지자체의 여름철 빅데이터 분석에서 '해수욕장 부근 아이스크림 판매량'과 '해수욕장 익사 사고 발생 건수' 사이에 $r = +0.88$의 매우 강한 양의 상관관계가 나타났다. 이를 보고 정책 담당자가 '익사 사고를 줄이기 위해 아이스크림 판매를 전면 금지해야 한다'고 결론을 내렸다. 이 결론의 결정적 통계적 오류는?", "options": ["두 변수 모두 '기온 상승(무더위)'이라는 공통의 제3의 잠재 외생변수(Lurking Variable)에 의해 동시에 증가한 허위 상관(Spurious Correlation)인데, 인과관계로 오판하였다.", "아이스크림 판매량이 비율척도가 아니라 서열척도로 측정되었기 때문이다.", "표본 크기가 10,000건 이상으로 너무 커서 표준오차가 0이 되었기 때문이다.", "귀무가설을 채택해야 하는 상황에서 제2종 오류를 범했기 때문이다."], "answer": 1, "explanation": "① 필기 노트 [2]주차 상관관계 $\\neq$ 인과관계: 아이스크림 판매와 익사 사고는 둘 다 '여름철 폭염/기온'이라는 제3의 외생변수에 의해 함께 변동한 전형적인 '허위 상관(Spurious Correlation)'입니다. 제3의 외생변수를 통제하지 않은 채 상관관계를 인과관계로 단정하면 잘못된 정책을 펴게 됩니다.", "question_html": "어느 지자체의 여름철 빅데이터 분석에서 '해수욕장 부근 아이스크림 판매량'과 '해수욕장 익사 사고 발생 건수' 사이에 $r = +0.88$의 매우 강한 양의 상관관계가 나타났다. 이를 보고 정책 담당자가 '익사 사고를 줄이기 위해 아이스크림 판매를 전면 금지해야 한다'고 결론을 내렸다. 이 결론의 결정적 통계적 오류는?", "options_html": ["두 변수 모두 '기온 상승(무더위)'이라는 공통의 제3의 잠재 외생변수(Lurking Variable)에 의해 동시에 증가한 허위 상관(Spurious Correlation)인데, 인과관계로 오판하였다.", "아이스크림 판매량이 비율척도가 아니라 서열척도로 측정되었기 때문이다.", "표본 크기가 10,000건 이상으로 너무 커서 표준오차가 0이 되었기 때문이다.", "귀무가설을 채택해야 하는 상황에서 제2종 오류를 범했기 때문이다."], "explanation_html": "① 필기 노트 [2]주차 상관관계 $\\neq$ 인과관계: 아이스크림 판매와 익사 사고는 둘 다 '여름철 폭염/기온'이라는 제3의 외생변수에 의해 함께 변동한 전형적인 '허위 상관(Spurious Correlation)'입니다. 제3의 외생변수를 통제하지 않은 채 상관관계를 인과관계로 단정하면 잘못된 정책을 펴게 됩니다."}, {"id": 273, "set": 3, "no": 13, "type": "choice", "concept": "눈덩이표본추출(Snowball)의 적용 환경", "question": "다음 중 비확률표본추출 기법인 '눈덩이표본추출(Snowball Sampling)'을 적용하기에 가장 적합한 마케팅 조사 대상은?", "options": ["전국 20대 남녀 대학생의 주간 커피 소비 빈도 조사", "희귀 질환 치료용 특수 식이요법 식품을 정기 복용하는 환자 또는 폐쇄적 VIP 명품 프라이빗 클럽 회원 조사", "대형 할인점(이마트) 방문 고객의 당일 평균 장바구니 결제 금액 조사", "국내 10대 고등학생의 유튜브 쇼츠 일일 시청 시간 조사"], "answer": 2, "explanation": "② 필기 노트 [6]주차 눈덩이표본추출: 표본추출틀이 존재하지 않고 모집단의 접근이 극히 어렵거나 폐쇄적인 특수 집단(희귀 질환자, 극소수 고액 자산가 등)의 경우, 최초 대상자로부터 소개를 받아 표본을 점진적으로 눈덩이처럼 불려 나가는 눈덩이 표본추출이 가장 유효합니다.", "question_html": "다음 중 비확률표본추출 기법인 '눈덩이표본추출(Snowball Sampling)'을 적용하기에 가장 적합한 마케팅 조사 대상은?", "options_html": ["전국 20대 남녀 대학생의 주간 커피 소비 빈도 조사", "희귀 질환 치료용 특수 식이요법 식품을 정기 복용하는 환자 또는 폐쇄적 VIP 명품 프라이빗 클럽 회원 조사", "대형 할인점(이마트) 방문 고객의 당일 평균 장바구니 결제 금액 조사", "국내 10대 고등학생의 유튜브 쇼츠 일일 시청 시간 조사"], "explanation_html": "② 필기 노트 [6]주차 눈덩이표본추출: 표본추출틀이 존재하지 않고 모집단의 접근이 극히 어렵거나 폐쇄적인 특수 집단(희귀 질환자, 극소수 고액 자산가 등)의 경우, 최초 대상자로부터 소개를 받아 표본을 점진적으로 눈덩이처럼 불려 나가는 눈덩이 표본추출이 가장 유효합니다."}, {"id": 274, "set": 3, "no": 14, "type": "choice", "concept": "p-value의 정확한 정의와 판정", "question": "어느 온라인 광고 집행 전후의 구매전환율 차이에 대한 가설검정을 수행한 결과 유의확률 $p = 0.012$가 도출되었다. 유의수준 $\\alpha = 0.05$ 기준에서의 통계적 의사결정과 p-value의 통계학적 의미로 가장 옳은 것은?", "options": ["귀무가설이 참일 확률이 정확히 98.8%이므로, 귀무가설을 채택한다.", "'귀무가설(차이가 없다)이 참이라는 전제하에', 실제로 관측된 표본 통계량만큼 극단적인 결과가 우연히 나타날 확률이 약 1.2%에 불과하므로 귀무가설을 기각하고 대립가설(광고 효과가 유의함)을 채택한다.", "연구가설이 틀릴 확률이 1.2%라는 뜻이므로, 조사를 처음부터 다시 설계해야 한다.", "$p > 0.01$이므로 신뢰수준 90%에서도 기각할 수 없다."], "answer": 2, "explanation": "② 필기 노트 [7]주차 p-value의 정의: p-value는 '귀무가설($H_0$)이 참이라고 가정할 때, 표본 데이터와 같거나 더 극단적인 검정통계량이 관측될 확률'입니다. $p = 0.012 < 0.05$이므로 우연히 일어났다고 보기 어려워 귀무가설을 기각하고 광고 효과가 통계적으로 유의하다고 판정합니다.", "question_html": "어느 온라인 광고 집행 전후의 구매전환율 차이에 대한 가설검정을 수행한 결과 유의확률 $p = 0.012$가 도출되었다. 유의수준 $\\alpha = 0.05$ 기준에서의 통계적 의사결정과 p-value의 통계학적 의미로 가장 옳은 것은?", "options_html": ["귀무가설이 참일 확률이 정확히 98.8%이므로, 귀무가설을 채택한다.", "'귀무가설(차이가 없다)이 참이라는 전제하에', 실제로 관측된 표본 통계량만큼 극단적인 결과가 우연히 나타날 확률이 약 1.2%에 불과하므로 귀무가설을 기각하고 대립가설(광고 효과가 유의함)을 채택한다.", "연구가설이 틀릴 확률이 1.2%라는 뜻이므로, 조사를 처음부터 다시 설계해야 한다.", "$p > 0.01$이므로 신뢰수준 90%에서도 기각할 수 없다."], "explanation_html": "② 필기 노트 [7]주차 p-value의 정의: p-value는 '귀무가설($H_0$)이 참이라고 가정할 때, 표본 데이터와 같거나 더 극단적인 검정통계량이 관측될 확률'입니다. $p = 0.012 < 0.05$이므로 우연히 일어났다고 보기 어려워 귀무가설을 기각하고 광고 효과가 통계적으로 유의하다고 판정합니다."}, {"id": 275, "set": 3, "no": 15, "type": "choice", "concept": "조사 보고서의 전략적 가치: Actionable Insight", "question": "필기 노트 [1]주차 및 교안 [조사 결과 보고서]에서 강조하는 '성공적인 마케팅 조사 보고서'의 핵심 특성으로 가장 올바른 것은?", "options": ["복잡하고 난해한 고급 통계 수식과 모든 원시 데이터(Raw Data)를 가감 없이 나열하는 기술적 방대함", "데이터 통계표 나열에 그치지 않고, 경영진이 구체적인 마케팅 전략과 실행 계획으로 직결시킬 수 있는 '실행 가능한 통찰(Actionable Insight)'의 명확한 제시", "조사 기획 단계에서 수립한 가설이 틀렸을 때 이를 숨기고 기존 직관에 맞춰 수치를 사후 조작하는 보고서", "정성 조사와 정량 조사를 분리하여 상호 모순되는 결론을 그대로 방치하는 보고서"], "answer": 2, "explanation": "② 필기 노트 [1]주차 및 교안: 마케팅 조사의 궁극적 목적은 단순한 학술 연구가 아니라 의사결정자의 불확실성을 줄이고(위험↓), 실제 비즈니스에 적용할 수 있는 '실행 가능한 통찰(Actionable Insight)'을 도출하여 수익성과 가치를 창출하는 데 있습니다.", "question_html": "필기 노트 [1]주차 및 교안 [조사 결과 보고서]에서 강조하는 '성공적인 마케팅 조사 보고서'의 핵심 특성으로 가장 올바른 것은?", "options_html": ["복잡하고 난해한 고급 통계 수식과 모든 원시 데이터(Raw Data)를 가감 없이 나열하는 기술적 방대함", "데이터 통계표 나열에 그치지 않고, 경영진이 구체적인 마케팅 전략과 실행 계획으로 직결시킬 수 있는 '실행 가능한 통찰(Actionable Insight)'의 명확한 제시", "조사 기획 단계에서 수립한 가설이 틀렸을 때 이를 숨기고 기존 직관에 맞춰 수치를 사후 조작하는 보고서", "정성 조사와 정량 조사를 분리하여 상호 모순되는 결론을 그대로 방치하는 보고서"], "explanation_html": "② 필기 노트 [1]주차 및 교안: 마케팅 조사의 궁극적 목적은 단순한 학술 연구가 아니라 의사결정자의 불확실성을 줄이고(위험↓), 실제 비즈니스에 적용할 수 있는 '실행 가능한 통찰(Actionable Insight)'을 도출하여 수익성과 가치를 창출하는 데 있습니다."}, {"id": 276, "set": 3, "no": 16, "type": "choice", "concept": "[블렌디드 7주차] 판다스 df.describe() 왜도 및 사분위수 해석", "question": "다음은 어느 전자상거래 앱 이용자들의 '1회 주문 금액(원)'에 대해 판다스 `df['주문금액'].describe()`를 실행하여 얻은 결과 요약표이다. 이 요약 통계량에 대한 해석으로 가장 타당한 것은?\n\n| 통계량 | 수치 |\n| :--- | :--- |\n| count | 1,000.0 |\n| mean | 54,200.0 |\n| std | 48,500.0 |\n| min | 8,000.0 |\n| 25% | 22,000.0 |\n| 50% | 35,000.0 |\n| 75% | 68,000.0 |\n| max | 450,000.0 |", "options": ["평균(54,200원)과 중앙값(50% 값, 35,000원)이 완벽히 일치하므로 이 데이터는 좌우 대칭 정규분포를 따른다.", "평균(54,200원)이 중앙값(35,000원)보다 훨씬 크고 최댓값(450,000원)이 3사분위수(68,000원)와 격차가 극심하므로, 소수의 초고액 결제자로 인해 오른쪽 꼬리가 긴 양의 왜도(Right-skewed) 분포를 띤다.", "사분위범위(IQR)는 $450,000 - 8,000 = 442,000$원이다.", "표준편차가 48,500원이므로 모든 고객의 결제 금액은 8,000원과 54,200원 사이에 100% 밀집해 있다."], "answer": 2, "explanation": "② 7주차 교안 [기술통계 확인 describe()]: 평균($54,200$) > 중앙값($50\\% = 35,000$)이고 최댓값이 매우 큰 것은 전형적인 오른쪽으로 꼬리가 긴 비대칭(Right-skewed, 양의 왜도) 분포입니다. 이때는 평균이 이상치(극단치)에 취약하므로 대표값으로 중앙값(Median)을 함께 고려해야 합니다. IQR은 $Q3 - Q1 = 68,000 - 22,000 = 46,000$원입니다.", "question_html": "다음은 어느 전자상거래 앱 이용자들의 '1회 주문 금액(원)'에 대해 판다스 <code>df['주문금액'].describe()</code>를 실행하여 얻은 결과 요약표이다. 이 요약 통계량에 대한 해석으로 가장 타당한 것은?<br><br><table class=\"q-table\"><thead><tr><th>통계량</th><th>수치</th></tr></thead><tbody><tr><td>count</td><td>1,000.0</td></tr><tr><td>mean</td><td>54,200.0</td></tr><tr><td>std</td><td>48,500.0</td></tr><tr><td>min</td><td>8,000.0</td></tr><tr><td>25%</td><td>22,000.0</td></tr><tr><td>50%</td><td>35,000.0</td></tr><tr><td>75%</td><td>68,000.0</td></tr><tr><td>max</td><td>450,000.0</td></tr></tbody></table>", "options_html": ["평균(54,200원)과 중앙값(50% 값, 35,000원)이 완벽히 일치하므로 이 데이터는 좌우 대칭 정규분포를 따른다.", "평균(54,200원)이 중앙값(35,000원)보다 훨씬 크고 최댓값(450,000원)이 3사분위수(68,000원)와 격차가 극심하므로, 소수의 초고액 결제자로 인해 오른쪽 꼬리가 긴 양의 왜도(Right-skewed) 분포를 띤다.", "사분위범위(IQR)는 $450,000 - 8,000 = 442,000$원이다.", "표준편차가 48,500원이므로 모든 고객의 결제 금액은 8,000원과 54,200원 사이에 100% 밀집해 있다."], "explanation_html": "② 7주차 교안 [기술통계 확인 describe()]: 평균($54,200$) > 중앙값($50\\% = 35,000$)이고 최댓값이 매우 큰 것은 전형적인 오른쪽으로 꼬리가 긴 비대칭(Right-skewed, 양의 왜도) 분포입니다. 이때는 평균이 이상치(극단치)에 취약하므로 대표값으로 중앙값(Median)을 함께 고려해야 합니다. IQR은 $Q3 - Q1 = 68,000 - 22,000 = 46,000$원입니다."}, {"id": 277, "set": 3, "no": 17, "type": "choice", "concept": "[블렌디드 5주차] 파이썬 문자열 연산과 형변환 오류", "question": "파이썬 주피터 노트북에서 설문 조사 응답 점수를 처리하기 위해 다음과 같은 코드를 순차적으로 실행하였다. 최종 출력되는 `result`의 값과 자료형은?\n\n```python\nscore_input = \"5\"\nbonus = 2\nresult = score_input * bonus\nprint(result)\n```", "options": ["정수 `10`", "문자열 `'55'`", "문자열 `'10'`", "`TypeError` 에러 발생"], "answer": 2, "explanation": "② 5주차 교안 [자료형의 연산]: `score_input`은 따옴표로 감싸진 문자열(str) `'5'`입니다. 파이썬에서 '문자열 * 정수'는 문자열을 해당 횟수만큼 반복 연결(Repetition)하므로 `'5' * 2`의 결과는 문자열 `'55'`가 됩니다. 산술 곱셈을 하려면 `int(score_input) * bonus`로 명시적 형변환을 해야 합니다.", "question_html": "파이썬 주피터 노트북에서 설문 조사 응답 점수를 처리하기 위해 다음과 같은 코드를 순차적으로 실행하였다. 최종 출력되는 <code>result</code>의 값과 자료형은?<br><br><pre><code class=\"language-python\">score_input = &quot;5&quot;\nbonus = 2\nresult = score_input * bonus\nprint(result)</code></pre>", "options_html": ["정수 <code>10</code>", "문자열 <code>'55'</code>", "문자열 <code>'10'</code>", "<code>TypeError</code> 에러 발생"], "explanation_html": "② 5주차 교안 [자료형의 연산]: <code>score_input</code>은 따옴표로 감싸진 문자열(str) <code>'5'</code>입니다. 파이썬에서 '문자열 * 정수'는 문자열을 해당 횟수만큼 반복 연결(Repetition)하므로 <code>'5' * 2</code>의 결과는 문자열 <code>'55'</code>가 됩니다. 산술 곱셈을 하려면 <code>int(score_input) * bonus</code>로 명시적 형변환을 해야 합니다."}, {"id": 278, "set": 3, "no": 18, "type": "choice", "concept": "[블렌디드 6주차] 파이썬 사용자 정의 함수와 return", "question": "고객의 구매 금액에 따라 할인율을 반환하는 파이썬 함수가 다음과 같이 정의되어 있다. `calc_discount(150000)`을 호출했을 때 반환되는 값은?\n\n```python\ndef calc_discount(spent):\n    if spent >= 200000:\n        rate = 0.20\n    elif spent >= 100000:\n        rate = 0.10\n    elif spent >= 50000:\n        rate = 0.05\n    else:\n        rate = 0.00\n    return rate\n```", "options": ["`0.20`", "`0.10`", "`0.05`", "`0.00`"], "answer": 2, "explanation": "② 6주차 교안 [조건문과 함수]: 입력값 `spent = 150000`은 첫 번째 `if spent >= 200000`은 거짓이지만, 두 번째 `elif spent >= 100000`을 참으로 만족하므로 `rate = 0.10`이 할당되고 반환됩니다.", "question_html": "고객의 구매 금액에 따라 할인율을 반환하는 파이썬 함수가 다음과 같이 정의되어 있다. <code>calc_discount(150000)</code>을 호출했을 때 반환되는 값은?<br><br><pre><code class=\"language-python\">def calc_discount(spent):\n    if spent &gt;= 200000:\n        rate = 0.20\n    elif spent &gt;= 100000:\n        rate = 0.10\n    elif spent &gt;= 50000:\n        rate = 0.05\n    else:\n        rate = 0.00\n    return rate</code></pre>", "options_html": ["<code>0.20</code>", "<code>0.10</code>", "<code>0.05</code>", "<code>0.00</code>"], "explanation_html": "② 6주차 교안 [조건문과 함수]: 입력값 <code>spent = 150000</code>은 첫 번째 <code>if spent >= 200000</code>은 거짓이지만, 두 번째 <code>elif spent >= 100000</code>을 참으로 만족하므로 <code>rate = 0.10</code>이 할당되고 반환됩니다."}, {"id": 279, "set": 3, "no": 19, "type": "choice", "concept": "[블렌디드 3주차] 가상 FGI(Synthetic FGI)의 실무적 효용", "question": "블렌디드 3주차에서 다룬 '생성형 AI를 활용한 가상 소비자 FGI(Synthetic Focus Group Interview)'의 가장 올바른 실무적 활용 방안은?", "options": ["실제 인간 소비자를 섭외하는 정량 설문조사를 100% 영구적으로 대체하여 최종 통계 가설 검증 데이터를 확보한다.", "본격적인 대규모 소비자 조사에 착수하기 전, 다양한 가상 페르소나(연령별, 라이프스타일별)를 구축하여 빠른 브레인스토밍, 잠재적 불만 요인 탐색, 설문 문항 초안 발상용 보조 도구로 활용한다.", "인간의 미묘한 표정 변화, 시선 처리, 음성 톤 등 비언어적 상호작용 데이터를 완벽하게 수집하기 위해 사용한다.", "AI가 생성한 텍스트 답변이 항상 100% 객관적 팩트이므로 검증 절차를 생략하고 최고경영진 최종 의사결정 보고서로 바로 제출한다."], "answer": 2, "explanation": "② 3주차 교안 [가상 FGI의 효용과 한계]: 가상 FGI는 비용과 시간을 대폭 아끼며 초기 탐색 단계에서 아이디어를 도출하고 설문지 문항을 정교화하는 '발상 및 가설 생성 보조 도구'로 매우 유용합니다. 단, 실제 소비자의 비언어적 반응이나 현실적 팩트를 검증할 수는 없으므로 실증 검증을 완전히 대체할 수는 없습니다.", "question_html": "블렌디드 3주차에서 다룬 '생성형 AI를 활용한 가상 소비자 FGI(Synthetic Focus Group Interview)'의 가장 올바른 실무적 활용 방안은?", "options_html": ["실제 인간 소비자를 섭외하는 정량 설문조사를 100% 영구적으로 대체하여 최종 통계 가설 검증 데이터를 확보한다.", "본격적인 대규모 소비자 조사에 착수하기 전, 다양한 가상 페르소나(연령별, 라이프스타일별)를 구축하여 빠른 브레인스토밍, 잠재적 불만 요인 탐색, 설문 문항 초안 발상용 보조 도구로 활용한다.", "인간의 미묘한 표정 변화, 시선 처리, 음성 톤 등 비언어적 상호작용 데이터를 완벽하게 수집하기 위해 사용한다.", "AI가 생성한 텍스트 답변이 항상 100% 객관적 팩트이므로 검증 절차를 생략하고 최고경영진 최종 의사결정 보고서로 바로 제출한다."], "explanation_html": "② 3주차 교안 [가상 FGI의 효용과 한계]: 가상 FGI는 비용과 시간을 대폭 아끼며 초기 탐색 단계에서 아이디어를 도출하고 설문지 문항을 정교화하는 '발상 및 가설 생성 보조 도구'로 매우 유용합니다. 단, 실제 소비자의 비언어적 반응이나 현실적 팩트를 검증할 수는 없으므로 실증 검증을 완전히 대체할 수는 없습니다."}, {"id": 280, "set": 3, "no": 20, "type": "choice", "concept": "[블렌디드 1주차] Google Colab의 마운트 및 라이브러리 임포트", "question": "Google Colab 환경에서 구글 드라이브에 저장된 고객 설문 CSV 파일(`survey.csv`)을 불러와 분석하고자 할 때 취해야 할 올바른 작업 절차가 아닌 것은?", "options": ["`from goo . 필기 노트 [3]주차 2차 자료: 사내 내부 데이터(POS, CRM, 회계 기록)는 비용이 저렴하고 즉시 활용 가능한 최우선 분석 자산입니다."}, {"id": 282, "set": 3, "no": 22, "type": "ox", "concept": "온라인 패널 조사의 비확률 편향", "question": "리서치 회사가 구축한 상설 온라인 패널(Online Panel)을 활용한 조사는 패널에 자발적으로 가입한 사람들을 대상으로 하므로, 엄밀한 의미에서 무작위 표본추출이 보장되지 않는 비확률 편향(자발적 참여자 편향)을 내포할 수 있다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 필기 노트 [6]주차 표본추출: 온라인 패널은 인터넷 접근성이 높고 리워드에 관심이 많은 특정 계층이 자발적으로 등록하는 경향이 있어 전형적인 비확률 표본의 특성을 갖습니다.", "question_html": "리서치 회사가 구축한 상설 온라인 패널(Online Panel)을 활용한 조사는 패널에 자발적으로 가입한 사람들을 대상으로 하므로, 엄밀한 의미에서 무작위 표본추출이 보장되지 않는 비확률 편향(자발적 참여자 편향)을 내포할 수 있다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 필기 노트 [6]주차 표본추출: 온라인 패널은 인터넷 접근성이 높고 리워드에 관심이 많은 특정 계층이 자발적으로 등록하는 경향이 있어 전형적인 비확률 표본의 특성을 갖습니다."}, {"id": 283, "set": 3, "no": 23, "type": "ox", "concept": "표준정규분포의 평균과 분산 모수", "question": "표준정규분포(Standard Normal Distribution, Z-분포)는 평균 $\\mu = 0$이고 분산 $\\sigma^2 = 1$인 정규분포를 의미한다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 필기 노트 [7]주차 표준화: 일반 정규분포 $X \\sim N(\\mu, \\sigma^2)$를 표준화 공식 $Z = \\frac{X - \\mu}{\\sigma}$로 변환하면 평균은 0, 분산 및 표준편차는 1인 표준정규분포 $Z \\sim N(0, 1)$이 됩니다.", "question_html": "표준정규분포(Standard Normal Distribution, Z-분포)는 평균 $\\mu = 0$이고 분산 $\\sigma^2 = 1$인 정규분포를 의미한다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 필기 노트 [7]주차 표준화: 일반 정규분포 $X \\sim N(\\mu, \\sigma^2)$를 표준화 공식 $Z = \\frac{X - \\mu}{\\sigma}$로 변환하면 평균은 0, 분산 및 표준편차는 1인 표준정규분포 $Z \\sim N(0, 1)$이 됩니다."}, {"id": 284, "set": 3, "no": 24, "type": "ox", "concept": "탐색적 조사의 목적과 가설 생성", "question": "탐색적 조사(Exploratory Research)의 주된 목적은 확정적인 통계적 결론을 내리거나 가설을 최종 검증하는 것이 아니라, 모호한 문제를 명확히 규명하고 연구 가설을 구체화(발상)하기 위한 통찰을 얻는 데 있다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 필기 노트 [2]주차 조사 유형: 탐색 조사는 유연한 방식으로 아이디어와 통찰을 얻고 가설을 도출하는 단계이며, 가설 검증은 기술 조사나 인과 조사의 몫입니다.", "question_html": "탐색적 조사(Exploratory Research)의 주된 목적은 확정적인 통계적 결론을 내리거나 가설을 최종 검증하는 것이 아니라, 모호한 문제를 명확히 규명하고 연구 가설을 구체화(발상)하기 위  "의사결정과 휴리스틱 편향", "question": "다음 중 마케팅 의사결정에서 발생하는 휴리스틱(Heuristics)과 그에 따른 편향(Bias)에 대한 설명으로 가장 적절하지 않은 것은?", "options": ["휴리스틱은 복잡한 문제 상황에서 직관과 경험에 의존하여 신속하게 결정을 내리는 의사결정 방식이다.", "가용성 편향(Availability Bias)은 발생 가능성이나 빈도를 판단할 때 머릿속에 가장 쉽게 떠오르는 사례에 과도하게 의존하는 경향이다.", "대표성 편향(Representativeness Bias)은 특정 대상이 속한 범주의 전형적 이미지에만 집착하여 실제 확률이나 문화적 차이를 간과하는 오류이다.", "기준점 설정 편향(Anchoring Bias)은 최초에 접한 정보나 기준점을 바탕으로 합리적인 사후 조정을 거치므로 객관적 마케팅 조사와 동일한 결과를 낳는다."], "answer": 4, "explanation": "④ 기준점 설정 편향(Anchoring Bias)은 초기에 설정된 임의의 기준점(Anchor)에 의사결정이 과도하게 고착되어, 이후 충분한 수정이나 객관적 조정을 거치지 못하고 왜곡된 판단을 내리는 오류입니다(예: 공유오피스 WeWork가 부동산 임대업 본질 대신 기술 플랫폼 가치로 과대평가된 사례). 객관적 마케팅 조사와 동일한 결과를 낳는다는 설명은 틀렸습니다.", "question_html": "다음 중 마케팅 의사결정에서 발생하는 휴리스틱(Heuristics)과 그에 따른 편향(Bias)에 대한 설명으로 가장 적절하지 않은 것은?", "options_html": ["휴리스틱은 복잡한 문제 상황에서 직관과 경험에 의존하여 신속하게 결정을 내리는 의사결정 방식이다.", "가용성 편향(Availability Bias)은 발생 가능성이나 빈도를 판단할 때 머릿속에 가장 쉽게 떠오르는 사례에 과도하게 의존하는 경향이다.", "대표성 편향(Representativeness Bias)은 특정 대상이 속한 범주의 전형적 이미지에만 집착하여 실제 확률이나 문화적 차이를 간과하는 오류이다.", "기준점 설정 편향(Anchoring Bias)은 최초에 접한 정보나 기준점을 바탕으로 합리적인 사후 조정을 거치므로 객관적 마케팅 조사와 동일한 결과를 낳는다."], "explanation_html": "④ 기준점 설정 편향(Anchoring Bias)은 초기에 설정된 임의의 기준점(Anchor)에 의사결정이 과도하게 고착되어, 이후 충분한 수정이나 객관적 조정을 거치지 못하고 왜곡된 판단을 내리는 오류입니다(예: 공유오피스 WeWork가 부동산 임대업 본질 대신 기술 플랫폼 가치로 과대평가된 사례). 객관적 마케팅 조사와 동일한 결과를 낳는다는 설명은 틀렸습니다."}, {"id": 2, "set": 1, "no": 2, "type": "choice", "concept": "휴리스틱과 편향 사례", "question": "다음 사례와 가장 관련 깊은 휴리스틱 편향을 바르게 짝지은 것은?\n\n[사례 1] 소비자의 감성적인 VOC(고객의 소리) 한두 건이나 눈에 띄는 최근 뉴스만 믿고, 통조림 제품의 전체 수요가 급감했다고 속단하여 생산량을 줄였다가 매출이 급감함.\n[사례 2] 한국 대형마트(이마트, 롯데마트)가 해외 진출 시 '동남아 소비자도 젊고 역동적이니 한국과 비슷한 쇼핑몰 형태를 선호할 것'이라고 단순 분류했다가 현지 문화(이슬람 등) 차이를 간과하여 실패함.", "options": ["[사례 1] 대표성 편향, [사례 2] 기준점 설정 편향", "[사례 1] 가용성 편향, [사례 2] 대표성 편향", "[사례 1] 기준점 설정 편향, [사례 2] 가용성 편향", "[사례 1] 가용성 편향, [사례 2] 기준점 설정 편향"], "answer": 2, "explanation": "② [사례 1]은 머릿속에 즉각 떠오르는 생생한 정보에 기초한 '가용성 편향(Availability Bias, 캠벨 통조림 사례)'이며, [사례 2]는 복잡한 시장 특성을 전형적 범주로 단순화하여 일반화해버린 '대표성 편향(Representativeness Bias, 동남아 진출 실패 사례)'입니다.", "question_html": "다음 사례와 가장 관련 깊은 휴리스틱 편향을 바르게 짝지은 것은?<br><br>[사례 1] 소비자의 감성적인 VOC(고객의 소리) 한두 건이나 눈에 띄는 최근 뉴스만 믿고, 통조림 제품의 전체 수요가 급감했다고 속단하여 생산량을 줄였다가 매출이 급감함.<br>[사례 2] 한국 대형마트(이마트, 롯데마트)가 해외 진출 시 '동남아 소비자도 젊고 역동적이니 한국과 비슷한 쇼핑몰 형태를 선호할 것'이라고 단순 분류했다가 현지 문화(이슬람 등) 차이를 간과하여 실패함.", "options_html": ["[사례 1] 대표성 편향, [사례 2] 기준점 설정 편향", "[사례 1] 가용성 편향, [사례 2] 대표성 편향", "[사례 1] 기준점 설정 편향, [사례 2] 가용성 편향", "[사례 1] 가용성 편향, [사례 2] 기준점 설정 편향"], "explanation_html": "② [사례 1]은 머릿속에 즉각 떠오르는 생생한 정보에 기초한 '가용성 편향(Availability Bias, 캠벨 통조림 사례)'이며, [사례 2]는 복잡한 시장 특성을 전형적 범주로 단순화하여 일반화해버린 '대표성 편향(Representativeness Bias, 동남아 진출 실패 사례)'입니다."}, {"id": 3, "set": 1, "no": 3, "type": "choice", "concept": "정보의 가치와 비용", "question": "다음 중 마케팅 조사에서 '정보 획득 비용'과 '정보 가치' 간의 관계를 설명한 것으로 옳은 것은?", "options": ["정보 획득 비용은 정보량이 늘어날수록 한계비용이 체감한다.", "정보의 가치는 정보량이 축적될수록 한계효용이 체증하므로 무한정 수집하는 것이 항상 유리하다.", "정보의 가치 곡선은 체감하고 정보 획득 비용 곡선은 체증하므로, '정보 가치 - 비용'의 차이가 극대화되는 최적점에서 조사를 멈추어야 한다.", "완벽한 의사결정을 위해서는 비용과 무관하게 100% 전수조사를 통해 모든 정보를 획득해야 한다."], "answer": 3, "explanation": "③ 정보 수집량이 늘어날수록 정보의 가치는 '한계효용 체감의 법칙'에 따라 체감하고, 수집 비용은 탐색 난이도 증가 등으로 '체증'합니다. 따라서 정보 가치와 정보 비용의 차이가 최대가 되는 '최적점(=비용 대비 높은 가치 지점)'을 찾아 의사결정을 내려야 합니다.", "question_html": "다음 중 마케팅 조사에서 '정보 획득 비용'과 '정보 가치' 간의 관계를 설명한 것으로 옳은 것은?", "options_html": ["정보 획득 비용은 정보량이 늘어날수록 한계비용이 체감한다.", "정보의 가치는 정보량이 축적될수록 한계효용이 체증하므로 무한정 수집하는 것이 항상 유리하다.", "정보의 가치 곡선은 체감하고 정보 획득 비용 곡선은 체증하므로, '정보 가치 - 비용'의 차이가 극대화되는 최적점에서 조사를 멈추어야 한다.", "완벽한 의사결정을 위해서는 비용과 무관하게 100% 전수조사를 통해 모든 정보를 획득해야 한다."], "explanation_html": "③ 정보 수집량이 늘어날수록 정보의 가치는 '한계효용 체감의 법칙'에 따라 체감하고, 수집 비용은 탐색 난이도 증가 등으로 '체증'합니다. 따라서 정보 가치와 정보 비용의 차이가 최대가 되는 '최적점(=비용 대비 높은 가치 지점)'을 찾아 의사결정을 내려야 합니다."}, {"id": 4, "set": 1, "no": 4, "type": "choice", "concept": "조직 계층별 마케팅 조사 활용", "question": "조직 계층(경영자, 관리자, 실무자)에 따른 의사결정 및 마케팅 조사의 역할에 대한 설명으로 가장 적절한 것은?", "options": ["최고경영자 계층은 전사적·전략적 의사결정을 내릴 때 오직 객관적 수치 데이터만을 활용하고 직관은 배제한다.", "실무자 계층으로 갈수록 직관적 판단의 비중이 커지고, 경영자 계층으로 갈수록 마케팅 조사의 정량적 실행 비중이 커진다.", "중간 관리자 계층은 전략과 실행을 연결하는 위치로, 가장 많은 마케팅 조사(마케팅조사 多)를 기획하고 활용하여 객관적 판단을 도모한다.", "마케팅 조사는 이미 결정된 경영자의 직관적 결정을 사후적으로 무조건 정당화하기 위해 사용되어야 한다."], "answer": 3, "explanation": "③ 강의 필기 조직계층 역삼각형 다이어그램에 따르면, 최고경영자는 전략적·전사적 판단 시 '직관'의 비중이 높고, 실무자는 구체적 과업 수행 중심이며, 중간 관리자 계층에서 전략 검증 및 실행을 위해 '마케팅 조사'를 가장 활발하게 기획·활용(마케팅조사 多)합니다. ④는 마케팅 조사의 오류(결정 정당화의 함정)입니다.", "question_html": "조직 계층(경영자, 관리자, 실무자)에 따른 의사결정 및 마케팅 조사의 역할에 대한 설명으로 가장 적절한 것은?", "options_html": ["최고경영자 계층은 전사적·전략적 의사결정을 내릴 때 오직 객관적 수치 데이터만을 활용하고 직관은 배제한다.", "실무자 계층으로 갈수록 직관적 판단의 비중이 커지고, 경영자 계층으로 갈수록 마케팅 조사의 정량적 실행 비중이 커진다.", "중간 관리자 계층은 전략과 실행을 연결하는 위치로, 가장 많은 마케팅 조사(마케팅조사 多)를 기획하고 활용하여 객관적 판단을 도모한다.", "마케팅 조사는 이미 결정된 경영자의 직관적 결정을 사후적으로 무조건 정당화하기 위해 사용되어야 한다."], "explanation_html": "③ 강의 필기 조직계층 역삼각형 다이어그램에 따르면, 최고경영자는 전략적·전사적 판단 시 '직관'의 비중이 높고, 실무자는 구체적 과업 수행 중심이며, 중간 관리자 계층에서 전략 검증 및 실행을 위해 '마케팅 조사'를 가장 활발하게 기획·활용(마케팅조사 多)합니다. ④는 마케팅 조사의 오류(결정 정당화의 함정)입니다."}, {"id": 5, "set": 1, "no": 5, "type": "choice", "concept": "조사의 종류 (탐색, 기술, 인과)", "question": "마케팅 조사의 3대 유형(탐색조사, 기술조사, 인과조사)에 대한 설명으로 올바르지 않은 것은?", "options": ["탐색조사는 문제 정의가 불명확할 때 문제점과 기회를 파악하고 통찰력을 얻기 위해 실시하는 질적 조사이다.", "기술조사는 시장의 특성이나 변수 간의 상관관계를 파악하기 위한 양적 조사로 서베이법과 횡단/시계열 조사가 대표적이다.", "인과조사는 특정 마케팅 변수(원인)가 결과 변수에 미치는 인과관계를 입증하기 위해 실험설계를 주로 사용한다.", "탐색조사에서 도출된 소규모 표적집단의 결과는 통계적 대표성이 충분하므로 추가적인 기술·인과조사 없이 전체 시장으로 일반화할 수 있다."], "answer": 4, "explanation": "④ 탐색조사(문헌조사, FGI, 전문가 인터뷰 등)는 소규모 표본을 대상으로 진행되는 질적 조사이므로 '일반화의 한계'를 갖습니다. 따라서 탐색조사를 통해 가설을 수립하고, 이후 기술조사나 인과조사(양적 조사)를 통해 통계적 검증과 일반화를 진행해야 합니다.", "question_html": "마케팅 조사의 3대 유형(탐색조사, 기술조사, 인과조사)에 대한 설명으로 올바르지 않은 것은?", "options_html": ["탐색조사는 문제 정의가 불명확할 때 문제점과 기회를 파악하고 통찰력을 얻기 위해 실시하는 질적 조사이다.", "기술조사는 시장의 특성이나 변수 간의 상관관계를 파악하기 위한 양적 조사로 서베이법과 횡단/시계열 조사가 대표적이다.", "인과조사는 특정 마케팅 변수(원인)가 결과 변수에 미치는 인과관계를 입증하기 위해 실험설계를 주로 사용한다.", "탐색조사에서 도출된 소규모 표적집단의 결과는 통계적 대표성이 충분하므로 추가적인 기술·인과조사 없이 전체 시장으로 일반화할 수 있다."], "explanation_html": "④ 탐색조사(문헌조사, FGI, 전문가 인터뷰 등)는 소규모 표본을 대상으로 진행되는 질적 조사이므로 '일반화의 한계'를 갖습니다. 따라서 탐색조사를 통해 가설을 수립하고, 이후 기술조사나 인과조사(양적 조사)를 통해 통계적 검증과 일반화를 진행해야 합니다."}, {"id": 6, "set": 1, "no": 6, "type": "choice", "concept": "탐색조사의 방법", "question": "다음 중 탐색조사(Exploratory Research)의 세부 방법에 대한 설명으로 옳지 않은 것은?", "options": ["문헌조사: 기존에 이미 존재하는 2차 자료를 조사하는 것으로 가장 경제적이고 신속한 탐색 방법이다.", "전문가의견조사: 문헌조사로 파악하기 힘든 실무적 통찰, 미래 전망, 전문적 조언을 얻기 위해 보조적으로 활용된다.", "사례조사: 과거 유사 기업의 성공/실패 사례(예: 신세계백화점 대구점 복합환승센터 광역 상권 설정 사례)를 벤치마킹하여 간접 경험과 논리적 유추를 얻는다.", "표적집단면접법(FGI): 고도로 구조화된 설문지를 대규모 패널에게 배포하여 통계적 상관계수를 산출하는 대표적인 양적 분석 기법이다."], "answer": 4, "explanation": "④ FGI(Focus Group Interview)는 6~8명 안팎의 소수 표적 집단을 모아 모더레이터(진행자)의 유도 하에 자유롭고 심층적인 의견을 교환하는 '비구조적 정성(질적) 면접 기법'입니다. 대규모 패널 대상의 구조화된 설문 조사는 기술조사의 서베이법입니다.", "question_html": "다음 중 탐색조사(Exploratory Research)의 세부 방법에 대한 설명으로 옳지 않은 것은?", "options_html": ["문헌조사: 기존에 이미 존재하는 2차 자료를 조사하는 것으로 가장 경제적이고 신속한 탐색 방법이다.", "전문가의견조사: 문헌조사로 파악하기 힘든 실무적 통찰, 미래 전망, 전문적 조언을 얻기 위해 보조적으로 활용된다.", "사례조사: 과거 유사 기업의 성공/실패 사례(예: 신세계백화점 대구점 복합환승센터 광역 상권 설정 사례)를 벤치마킹하여 간접 경험과 논리적 유추를 얻는다.", "표적집단면접법(FGI): 고도로 구조화된 설문지를 대규모 패널에게 배포하여 통계적 상관계수를 산출하는 대표적인 양적 분석 기법이다."], "explanation_html": "④ FGI(Focus Group Interview)는 6~8명 안팎의 소수 표적 집단을 모아 모더레이터(진행자)의 유도 하에 자유롭고 심층적인 의견을 교환하는 '비구조적 정성(질적) 면접 기법'입니다. 대규모 패널 대상의 구조화된 설문 조사는 기술조사의 서베이법입니다."}, {"id": 7, "set": 1, "no": 7, "type": "choice", "concept": "인과관계 성립의 3대 조건", "question": "마케팅 조사에서 변수 X(원인)와 변수 Y(결과) 간의 인과관계(Causality)가 성립하기 위해 반드시 충족되어야 하는 3가지 조건이 아닌 것은?", "options": ["원인과 결과의 동시 측정성: 원인변수와 결과변수가 통계적으로 함께 변화함(공변성)이 측정 가능해야 한다.", "시간적 우선순위(시간우위): 원인변수 X의 변화가 결과변수 Y의 변화보다 시간적으로 앞서서 발생해야 한다.", "외생변수의 통제 및 제거: 결과변수 Y의 변화를 유발할 수 있는 제3의 외부 요인들이 철저히 통제되어야 한다.", "결과 변수의 정규분포성: 결과변수 Y의 데이터는 반드시 사전에 표준정규분포 Z~N(0,1)을 따라야만 인과관계가 성립한다."], "answer": 4, "explanation": "④ 인과관계 성립의 3대 필수 조건은 ① 동반변화(공변성, 원인-결과 측정가능), ② 시간적 우선성(원인이 결과보다 선행), ③ 외생변수의 통제(가짜 상관관계 배제)입니다. 결과변수가 사전에 표준정규분포를 따라야 한다는 조건은 인과관계 성립 요건이 아닙니다.", "question_html": "마케팅 조사에서 변수 X(원인)와 변수 Y(결과) 간의 인과관계(Causality)가 성립하기 위해 반드시 충족되어야 하는 3가지 조건이 아닌 것은?", "options_html": ["원인과 결과의 동시 측정성: 원인변수와 결과변수가 통계적으로 함께 변화함(공변성)이 측정 가능해야 한다.", "시간적 우선순위(시간우위): 원인변수 X의 변화가 결과변수 Y의 변화보다 시간적으로 앞서서 발생해야 한다.", "외생변수의 통제 및 제거: 결과변수 Y의 변화를 유발할 수 있는 제3의 외부 요인들이 철저히 통제되어야 한다.", "결과 변수의 정규분포성: 결과변수 Y의 데이터는 반드시 사전에 표준정규분포 Z~N(0,1)을 따라야만 인과관계가 성립한다."], "explanation_html": "④ 인과관계 성립의 3대 필수 조건은 ① 동반변화(공변성, 원인-결과 측정가능), ② 시간적 우선성(원인이 결과보다 선행), ③ 외생변수의 통제(가짜 상관관계 배제)입니다. 결과변수가 사전에 표준정규분포를 따라야 한다는 조건은 인과관계 성립 요건이 아닙니다."}, {"id": 8, "set": 1, "no": 8, "type": "choice", "concept": "인과조사 실무 사례 분석", "question": "마트 시식 코너에서 '시식 제공(원인)'이 '매출 증대(결과)'로 이어지는 메커니즘을 심리학적/마케팅적으로 분석한 내용으로 가장 옳은 것은?", "options": ["건강 지향성(Virtue) 식품은 시식을 제공했을 때 소비자의 쾌락적 동기를 즉각 자극하여 매출 상승폭이 가장 크다.", "쾌락적 속성(Vice: 과자, 소시지 등) 식품은 시식을 통해 순간적인 욕구와 General Motivation(일반적 동기부여)을 유발하여 즉각적인 구매 행동(매출↑)으로 이어지기 쉽다.", "시식 제공은 소비자의 이성적 비용 대비 편익 계산을 촉진하여 계획 구매만을 증가시킨다.", "외생변수(가격 할인, 매대 위치 등)가 개입되더라도 시식 행위 자체만으로 100% 순수한 인과효과를 분리해낼 수 있다."], "answer": 2, "explanation": "② 필기 노트에 따르면 마트 시식 코너의 Vice(쾌락적 속성) 식품은 시식 경험을 통해 뇌의 General Motivation(일반적 쾌락 동기)을 급상승시켜 즉각적 충동 구매 행동(매출↑)을 유도합니다. 반면 Virtue(건강 지향) 식품은 상대적으로 그러한 즉각적 쾌락 유발 효과가 낮습니다.", "question_html": "마트 시식 코너에서 '시식 제공(원인)'이 '매출 증대(결과)'로 이어지는 메커니즘을 심리학적/마케팅적으로 분석한 내용으로 가장 옳은 것은?", "options_html": ["건강 지향성(Virtue) 식품은 시식을 제공했을 때 소비자의 쾌락적 동기를 즉각 자극하여 매출 상승폭이 가장 크다.", "쾌락적 속성(Vice: 과자, 소시지 등) 식품은 시식을 통해 순간적인 욕구와 General Motivation(일반적 동기부여)을 유발하여 즉각적인 구매 행동(매출↑)으로 이어지기 쉽다.", "시식 제공은 소비자의 이성적 비용 대비 편익 계산을 촉진하여 계획 구매만을 증가시킨다.", "외생변수(가격 할인, 매대 위치 등)가 개입되더라도 시식 행위 자체만으로 100% 순수한 인과효과를 분리해낼 수 있다."], "explanation_html": "② 필기 노트에 따르면 마트 시식 코너의 Vice(쾌락적 속성) 식품은 시식 경험을 통해 뇌의 General Motivation(일반적 쾌락 동기)을 급상승시켜 즉각적 충동 구매 행동(매출↑)을 유도합니다. 반면 Virtue(건강 지향) 식품은 상대적으로 그러한 즉각적 쾌락 유발 효과가 낮습니다."}, {"id": 9, "set": 1, "no": 9, "type": "choice", "concept": "실험설계의 전제조건", "question": "독립변수와 종속변수 간의 인과관계를 명확히 규명하기 위해 '실험설계(Experimental Design)'를 수립할 때 갖추어야 할 3대 전제조건으로 가장 적절한 것은?", "options": ["실험변수의 인위적 조작 / 외생변수의 통제 및 제거 / 실험대상의 무작위 할당(Randomization)", "표본 크기의 극대화 / 2차 자료의 전수 분석 / 면접원의 비구조화", "비확률 편의추출 / 실험환경의 자연방치 / 사전 설문조사 생략", "공개 관찰 실시 / 정성적 텍스트 코딩 / 독립변수의 자연적 방임"], "answer": 1, "explanation": "① 실험설계의 3대 핵심 전제조건은 ① 연구자가 독립변수(실험변수)를 인위적으로 처치/조작(Manipulation), ② 종속변수에 영향을 줄 수 있는 외생변수를 엄격히 통제/제거(Control), ③ 실험집단과 통제집단에 실험대상을 무작위로 배치(Randomization)하는 것입니다.", "question_html": "독립변수와 종속변수 간의 인과관계를 명확히 규명하기 위해 '실험설계(Experimental Design)'를 수립할 때 갖추어야 할 3대 전제조건으로 가장 적절한 것은?", "options_html": ["실험변수의 인위적 조작 / 외생변수의 통제 및 제거 / 실험대상의 무작위 할당(Randomization)", "표본 크기의 극대화 / 2차 자료의 전수 분석 / 면접원의 비구조화", "비확률 편의추출 / 실험환경의 자연방치 / 사전 설문조사 생략", "공개 관찰 실시 / 정성적 텍스트 코딩 / 독립변수의 자연적 방임"], "explanation_html": "① 실험설계의 3대 핵심 전제조건은 ① 연구자가 독립변수(실험변수)를 인위적으로 처치/조작(Manipulation), ② 종속변수에 영향을 줄 수 있는 외생변수를 엄격히 통제/제거(Control), ③ 실험집단과 통제집단에 실험대상을 무작위로 배치(Randomization)하는 것입니다."}, {"id": 10, "set": 1, "no": 10, "type": "choice", "concept": "마케팅조사 프로세스 및 제안서", "question": "마케팅 조사의 전반적 실행 과정(1단계~6단계)에 대한 설명 중 가장 옳지 않은 것은?", "options": ["1단계: 기업이 당면한 경영 문제(예: 서비스 유료화 검토, 고객 이탈 방지 등)를 명확히 인지하고 문제 맥락을 3C(Company, Customer, Competitor) 관점에서 파악한다.", "2단계: 전문성과 객관성 확보를 위해 외부 전문 마케팅 조사 기관을 선정하고 이들로부터 연구제안서를 제출받는다.", "3단계: 조사 목적, 조사 대상, 기간, 기대효과, 예산 및 일정 등을 담은 구체적인 조사 계획을 수립한다.", "6단계: 도출된 통계 분석 결과는 학술적 분석에 그쳐야 하며, 기업의 구체적인 가격 정책이나 세분시장별 차등화 전략 등 실무적 대안 도출로 연결되어서는 안 된다."], "answer": 4, "explanation": "④ 마케팅 조사의 궁극적인 목적은 실무적 문제 해결을 위한 전략 대안 도출(Actionable Insight)입니다. 6단계 결과 해석 및 분석 단계에서는 '이용자 분류 및 가격탄력성을 고려한 단계적 유료화' 등 구체적인 비즈니스 실행 전략을 제시해야 합니다.", "question_html": "마케팅 조사의 전반적 실행 과정(1단계~6단계)에 대한 설명 중 가장 옳지 않은 것은?", "options_html": ["1단계: 기업이 당면한 경영 문제(예: 서비스 유료화 검토, 고객 이탈 방지 등)를 명확히 인지하고 문제 맥락을 3C(Company, Customer, Competitor) 관점에서 파악한다.", "2단계: 전문성과 객관성 확보를 위해 외부 전문 마케팅 조사 기관을 선정하고 이들로부터 연구제안서를 제출받는다.", "3단계: 조사 목적, 조사 대상, 기간, 기대효과, 예산 및 일정 등을 담은 구체적인 조사 계획을 수립한다.", "6단계: 도출된 통계 분석 결과는 학술적 분석에 그쳐야 하며, 기업의 구체적인 가격 정책이나 세분시장별 차등화 전략 등 실무적 대안 도출로 연결되어서는 안 된다."], "explanation_html": "④ 마케팅 조사의 궁극적인 목적은 실무적 문제 해결을 위한 전략 대안 도출(Actionable Insight)입니다. 6단계 결과 해석 및 분석 단계에서는 '이용자 분류 및 가격탄력성을 고려한 단계적 유료화' 등 구체적인 비즈니스 실행 전략을 제시해야 합니다."}, {"id": 11, "set": 1, "no": 11, "type": "choice", "concept": "1차 자료 vs 2차 자료", "question": "마케팅 조사에서 활용되는 '1차 자료(Primary Data)'와 '2차 자료(Secondary Data)'에 대한 비교 설명으로 가장 옳은 것은?", "options": ["1차 자료는 기존에 다른 목적으로 이미 수집된 자료(POS, 정부 통계 등)를 의미한다.", "2차 자료는 당면한 특정 조사 목적을 위해 연구자가 직접 현장에서 수집하는 자료이다.", "1차 자료는 2차 자료에 비해 획득에 드는 시간과 비용이 많이 들지만, 당면 과제에 대한 적합성과 정확도가 높다.", "조사를 진행할 때 가장 바람직한 순서는 1차 자료를 먼저 수집하고, 부족할 경우 2차 자료를 보완하는 것이다."], "answer": 3, "explanation": "③ 1차 자료는 당면 문제를 해결하기 위해 직접 수집하므로 시간·비용이 많이 들지만 정확도와 목적 적합성이 높습니다. 반면 2차 자료(POS, 기존 통계 등)는 신속하고 저렴하지만 목적 불일치나 최신성 부족 한계가 있습니다. 조사 시에는 항상 '2차 자료 검토'를 먼저 진행한 후 1차 자료를 수집하는 것이 원칙입니다.", "question_html": "마케팅 조사에서 활용되는 '1차 자료(Primary Data)'와 '2차 자료(Secondary Data)'에 대한 비교 설명으로 가장 옳은 것은?", "options_html": ["1차 자료는 기존에 다른 목적으로 이미 수집된 자료(POS, 정부 통계 등)를 의미한다.", "2차 자료는 당면한 특정 조사 목적을 위해 연구자가 직접 현장에서 수집하는 자료이다.", "1차 자료는 2차 자료에 비해 획득에 드는 시간과 비용이 많이 들지만, 당면 과제에 대한 적합성과 정확도가 높다.", "조사를 진행할 때 가장 바람직한 순서는 1차 자료를 먼저 수집하고, 부족할 경우 2차 자료를 보완하는 것이다."], "explanation_html": "③ 1차 자료는 당면 문제를 해결하기 위해 직접 수집하므로 시간·비용이 많이 들지만 정확도와 목적 적합성이 높습니다. 반면 2차 자료(POS, 기존 통계 등)는 신속하고 저렴하지만 목적 불일치나 최신성 부족 한계가 있습니다. 조사 시에는 항상 '2차 자료 검토'를 먼저 진행한 후 1차 자료를 수집하는 것이 원칙입니다."}, {"id": 12, "set": 1, "no": 12, "type": "choice", "concept": "서베이법(설문지법)의 유형별 특성", "question": "서베이(설문지법)의 수집 방식인 대인면접조사, 전화조사, 인터넷조사의 특성을 올바르게 연결한 것은?", "options": ["대인면접조사: 수집 비용이 가장 저렴하고 조사 속도가 가장 빠르다.", "전화조사: 복잡한 시각 자료나 긴 질문지를 활용하기에 가장 적합하며 질문 양에 제한이 없다.", "인터넷조사: 비용과 시간 면에서 효율적이며 멀티미디어 자극물 제시가 용이하지만, 표본 프레임의 대표성 확보와 불성실 응답 통제에 유의해야 한다.", "전화조사: 응답자의 표정과 비언어적 태도를 관찰하여 심층적인 통찰을 얻을 수 있다."], "answer": 3, "explanation": "③ 인터넷 조사는 비용과 시간 효율성이 뛰어나고 이미지/동영상 제시가 용이한 반면, 표본의 대표성 왜곡(인터넷 이용층 편중) 및 불성실 응답 관리가 핵심 과제입니다. 대인면접은 비용이 가장 높고 질이 높으며, 전화조사는 속도가 빠르지만 질문 양(양↓)에 한계가 있습니다.", "question_html": "서베이(설문지법)의 수집 방식인 대인면접조사, 전화조사, 인터넷조사의 특성을 올바르게 연결한 것은?", "options_html": ["대인면접조사: 수집 비용이 가장 저렴하고 조사 속도가 가장 빠르다.", "전화조사: 복잡한 시각 자료나 긴 질문지를 활용하기에 가장 적합하며 질문 양에 제한이 없다.", "인터넷조사: 비용과 시간 면에서 효율적이며 멀티미디어 자극물 제시가 용이하지만, 표본 프레임의 대표성 확보와 불성실 응답 통제에 유의해야 한다.", "전화조사: 응답자의 표정과 비언어적 태도를 관찰하여 심층적인 통찰을 얻을 수 있다."], "explanation_html": "③ 인터넷 조사는 비용과 시간 효율성이 뛰어나고 이미지/동영상 제시가 용이한 반면, 표본의 대표성 왜곡(인터넷 이용층 편중) 및 불성실 응답 관리가 핵심 과제입니다. 대인면접은 비용이 가장 높고 질이 높으며, 전화조사는 속도가 빠르지만 질문 양(양↓)에 한계가 있습니다."}, {"id": 13, "set": 1, "no": 13, "type": "choice", "concept": "투사법(Projective Techniques)", "question": "소비자가 사회적 체면, 죄책감, 또는 무의식적 이유로 인해 솔직한 속마음을 직접 진술하기 어려워할 때 사용하는 '투사법(Projective Techniques)'에 해당하지 않는 것은?", "options": ["단어연상법 (Word Association Test)", "문장완성법 (Sentence Completion Test)", "만화완성법 및 그림묘사법 (Thematic Apperception Test)", "리커트 7점 척도를 이용한 다문항 만족도 서베이"], "answer": 4, "explanation": "④ 투사법은 응답자에게 모호한 자극을 제시하고 이를 제3자나 상황에 투사하게 하여 내면의 무의식적 동기나 태도를 측정하는 비구조적 정성조사 기법(단어연상, 문장완성, 만화/그림완성 등)입니다. 리커트 척도 서베이는 직접적인 정량 의사소통법입니다.", "question_html": "소비자가 사회적 체면, 죄책감, 또는 무의식적 이유로 인해 솔직한 속마음을 직접 진술하기 어려워할 때 사용하는 '투사법(Projective Techniques)'에 해당하지 않는 것은?", "options_html": ["단어연상법 (Word Association Test)", "문장완성법 (Sentence Completion Test)", "만화완성법 및 그림묘사법 (Thematic Apperception Test)", "리커트 7점 척도를 이용한 다문항 만족도 서베이"], "explanation_html": "④ 투사법은 응답자에게 모호한 자극을 제시하고 이를 제3자나 상황에 투사하게 하여 내면의 무의식적 동기나 태도를 측정하는 비구조적 정성조사 기법(단어연상, 문장완성, 만화/그림완성 등)입니다. 리커트 척도 서베이는 직접적인 정량 의사소통법입니다."}, {"id": 14, "set": 1, "no": 14, "type": "choice", "concept": "관찰법의 분류", "question": "관찰법(Observation Method)의 분류 기준에 대한 설명으로 가장 적절하지 않은 것은?", "options": ["공개 여부: 관찰 대상자가 자신이 관찰되고 있음을 아는지 여부에 따라 공개 관찰과 비공개(은폐) 관찰로 나뉜다.", "인위성 여부: 자연스러운 실제 구매 환경에서 관찰하는 자연적 관찰과, 실험실 모의 매장에서 관찰하는 인위적 관찰이 있다.", "체계성 여부: 사전에 규정된 관찰표에 따라 정형화하여 기록하는 체계적 관찰과, 유연하게 전반을 기록하는 비체계적 관찰이 있다.", "조사도구: 관찰법은 인간의 오감만을 사용해야 하며, 바코드 스캐너, 피플미터, 아이트래커 등 기계 장치를 사용하는 것은 관찰법에 해당하지 않는다."], "answer": 4, "explanation": "④ 관찰법은 인간 관찰자뿐만 아니라 POS 바코드 스캐너, 시선 추적기(Eye-tracker), CCTV, 피플미터 등 다양한 '기계적 조사도구(기계관찰)'를 적극적으로 활용합니다.", "question_html": "관찰법(Observation Method)의 분류 기준에 대한 설명으로 가장 적절하지 않은 것은?", "options_html": ["공개 여부: 관찰 대상자가 자신이 관찰되고 있음을 아는지 여부에 따라 공개 관찰과 비공개(은폐) 관찰로 나뉜다.", "인위성 여부: 자연스러운 실제 구매 환경에서 관찰하는 자연적 관찰과, 실험실 모의 매장에서 관찰하는 인위적 관찰이 있다.", "체계성 여부: 사전에 규정된 관찰표에 따라 정형화하여 기록하는 체계적 관찰과, 유연하게 전반을 기록하는 비체계적 관찰이 있다.", "조사도구: 관찰법은 인간의 오감만을 사용해야 하며, 바코드 스캐너, 피플미터, 아이트래커 등 기계 장치를 사용하는 것은 관찰법에 해당하지 않는다."], "explanation_html": "④ 관찰법은 인간 관찰자뿐만 아니라 POS 바코드 스캐너, 시선 추적기(Eye-tracker), CCTV, 피플미터 등 다양한 '기계적 조사도구(기계관찰)'를 적극적으로 활용합니다."}, {"id": 15, "set": 1, "no": 15, "type": "choice", "concept": "표본추출과정 및 표본프레임", "question": "표본추출의 5단계 과정에서 '모집단 확정' 다음 단계로 진행되며, 모집단 내의 개별 표본 단위들이 수록되어 있는 실제 명부를 의미하는 것은?", "options": ["표본프레임 (Sampling Frame) 결정", "표본추출 방법 결정", "표본 크기 결정", "실제 표본 추출"], "answer": 1, "explanation": "① 표본추출의 정석 프로세스는 [모집단 확정 → 표본프레임 결정 → 표본추출 방법 결정 → 표본크기 선정 → 추출]입니다. 여기서 표본프레임은 전화번호부, 학생 명부, 고객 데이터베이스 등 표본을 추출하기 위해 확보된 물리적 대상 목록입니다.", "question_html": "표본추출의 5단계 과정에서 '모집단 확정' 다음 단계로 진행되며, 모집단 내의 개별 표본 단위들이 수록되어 있는 실제 명부를 의미하는 것은?", "options_html": ["표본프레임 (Sampling Frame) 결정", "표본추출 방법 결정", "표본 크기 결정", "실제 표본 추출"], "explanation_html": "① 표본추출의 정석 프로세스는 [모집단 확정 → 표본프레임 결정 → 표본추출 방법 결정 → 표본크기 선정 → 추출]입니다. 여기서 표본프레임은 전화번호부, 학생 명부, 고객 데이터베이스 등 표본을 추출하기 위해 확보된 물리적 대상 목록입니다."}, {"id": 16, "set": 1, "no": 16, "type": "choice", "concept": "확률표본추출법의 분류", "question": "다음 중 '확률표본추출법(Probability Sampling)'의 유형과 그 사례가 바르게 연결된 것은?", "options": ["단순무작위추출법(SRS): 모집단 구성원에게 번호를 부여하고 난수표나 제비뽑기(로또 방식)로 무작위 추출함.", "체계적추출법: 조사원이 길거리에서 마주치는 사람 중 편리한 대상을 임의로 추출함.", "층화표본추출법: 모집단을 행정구역별로 묶은 뒤 특정 구역을 무작위로 골라 해당 구역의 주민 전체를 전수 조사함.", "군집표본추출법: 학년별, 성별 비율에 맞추어 사전에 할당표를 짜두고 조사원이 주관적으로 채워 넣음."], "answer": 1, "explanation": "① 단순무작위추출법(SRS)은 모든 원소의 추출 확률이 동일하도록 번호를 부여하고 난수나 로또 방식으로 무작위 추출하는 방식입니다. 체계적 추출은 k번째 간격 추출이며, 특정 구역 전체 조사는 군집추출, 주관적 할당은 비확률 할당추출법입니다.", "question_html": "다음 중 '확률표본추출법(Probability Sampling)'의 유형과 그 사례가 바르게 연결된 것은?", "options_html": ["단순무작위추출법(SRS): 모집단 구성원에게 번호를 부여하고 난수표나 제비뽑기(로또 방식)로 무작위 추출함.", "체계적추출법: 조사원이 길거리에서 마주치는 사람 중 편리한 대상을 임의로 추출함.", "층화표본추출법: 모집단을 행정구역별로 묶은 뒤 특정 구역을 무작위로 골라 해당 구역의 주민 전체를 전수 조사함.", "군집표본추출법: 학년별, 성별 비율에 맞추어 사전에 할당표를 짜두고 조사원이 주관적으로 채워 넣음."], "explanation_html": "① 단순무작위추출법(SRS)은 모든 원소의 추출 확률이 동일하도록 번호를 부여하고 난수나 로또 방식으로 무작위 추출하는 방식입니다. 체계적 추출은 k번째 간격 추출이며, 특정 구역 전체 조사는 군집추출, 주관적 할당은 비확률 할당추출법입니다."}, {"id": 17, "set": 1, "no": 17, "type": "choice", "concept": "층화추출 vs 군집추출", "question": "확률표본추출법 중 '층화표본추출법(Stratified Sampling)'과 '군집표본추출법(Cluster Sampling)'의 집단 구성 특성을 가장 올바르게 비교한 것은?", "options": ["층화추출: 집단 내부는 이질적이고, 집단 간은 동질적이어야 효율적이다.", "군집추출: 집단 내부는 동질적이고, 집단 간은 이질적이어야 표본 대표성이 보장된다.", "층화추출: 집단 내부는 동질적이고 집단 간은 이질적인 여러 층으로 나눈 후 각 층에서 무작위 추출한다.", "군집추출: 모든 층에서 반드시 표본을 골고루 추출해야 하므로 비용이 가장 많이 든다."], "answer": 3, "explanation": "③ 층화표본추출은 '집단 내 동질, 집단 간 이질'(예: 1학년, 2학년, 3학년, 4학년 각 학년 내는 동질, 학기간은 이질)로 나누어 모든 층에서 무작위로 뽑아 대표성을 극대화합니다. 반대로 군집추출은 각 군집 자체가 모집단의 축소판처럼 '집단 내 이질, 집단 간 동질'이어야 합니다.", "question_html": "확률표본추출법 중 '층화표본추출법(Stratified Sampling)'과 '군집표본추출법(Cluster Sampling)'의 집단 구성 특성을 가장 올바르게 비교한 것은?", "options_html": ["층화추출: 집단 내부는 이질적이고, 집단 간은 동질적이어야 효율적이다.", "군집추출: 집단 내부는 동질적이고, 집단 간은 이질적이어야 표본 대표성이 보장된다.", "층화추출: 집단 내부는 동질적이고 집단 간은 이질적인 여러 층으로 나눈 후 각 층에서 무작위 추출한다.", "군집추출: 모든 층에서 반드시 표본을 골고루 추출해야 하므로 비용이 가장 많이 든다."], "explanation_html": "③ 층화표본추출은 '집단 내 동질, 집단 간 이질'(예: 1학년, 2학년, 3학년, 4학년 각 학년 내는 동질, 학기간은 이질)로 나누어 모든 층에서 무작위로 뽑아 대표성을 극대화합니다. 반대로 군집추출은 각 군집 자체가 모집단의 축소판처럼 '집단 내 이질, 집단 간 동질'이어야 합니다."}, {"id": 18, "set": 1, "no": 18, "type": "choice", "concept": "표본오류와 비표본오류", "question": "조사에서 발생하는 '표본오류(Sampling Error)'와 '비표본오류(Non-sampling Error)'에 대한 설명으로 옳은 것은?", "options": ["표본오류는 조사원의 기록 실수, 응답자의 거짓말 등 조사 과정의 실수를 의미한다.", "전수조사를 실시하면 모집단 전체를 조사하므로 표본오류와 비표본오류가 둘 다 0이 된다.", "표본의 크기(n)가 증가할수록 표본오류는 감소하지만, 조사 관리 대상이 늘어나 비표본오류는 증가할 위험이 있다.", "비표본오류는 표본조사에서만 발생하며 전수조사에서는 전혀 발생하지 않는다."], "answer": 3, "explanation": "③ 표본오류는 모집단의 일부만 추출했기 때문에 필연적으로 생기는 통계적 오차로 표본 크기가 커지면 '반비례하여 감소'합니다. 반면 비표본오류(불포함, 무응답, 불성실 응답, 입력 오류 등)는 조사 대상 규모가 커질수록 관리 난이도로 인해 '비례하여 증가'합니다. 전수조사는 표본오류는 0이지만 비표본오류가 최대가 될 수 있습니다.", "question_html": "조사에서 발생하는 '표본오류(Sampling Error)'와 '비표본오류(Non-sampling Error)'에 대한 설명으로 옳은 것은?", "options_html": ["표본오류는 조사원의 기록 실수, 응답자의 거짓말 등 조사 과정의 실수를 의미한다.", "전수조사를 실시하면 모집단 전체를 조사하므로 표본오류와 비표본오류가 둘 다 0이 된다.", "표본의 크기(n)가 증가할수록 표본오류는 감소하지만, 조사 관리 대상이 늘어나 비표본오류는 증가할 위험이 있다.", "비표본오류는 표본조사에서만 발생하며 전수조사에서는 전혀 발생하지 않는다."], "explanation_html": "③ 표본오류는 모집단의 일부만 추출했기 때문에 필연적으로 생기는 통계적 오차로 표본 크기가 커지면 '반비례하여 감소'합니다. 반면 비표본오류(불포함, 무응답, 불성실 응답, 입력 오류 등)는 조사 대상 규모가 커질수록 관리 난이도로 인해 '비례하여 증가'합니다. 전수조사는 표본오류는 0이지만 비표본오류가 최대가 될 수 있습니다."}, {"id": 19, "set": 1, "no": 19, "type": "choice", "concept": "4대 척도의 특성", "question": "측정 척도(명목, 서열, 등간, 비율척도)에 대한 설명 중 가장 타당하지 않은 것은?", "options": ["명목척도: 단순히 대상을 분류하고 구분하기 위한 척도로, 부여된 숫자는 연산적 의미가 없고 최빈값만 확인 가능하다(예: 성별 남=1, 여=2).", "서열척도: 대상 간의 순위나 서열을 나타내지만 순위 간의 간격이 동일하지는 않다(예: 금, 은, 동메달).", "등간척도: 순위뿐만 아니라 속성 간의 간격이 동일하며 절대영점(0)이 존재하여 곱셈과 나눗셈 등 사칙연산이 모두 가능하다.", "비율척도: 절대영점(자연적 영점)이 존재하여 사칙연산이 모두 가능하고 배수 비교(예: 매출액 200억은 100억의 2배)가 가능하다."], "answer": 3, "explanation": "③ 등간척도(Interval Scale, 예: 온도 ℃, IQ, 리커트 척도)는 간격이 일정하여 덧셈/뺄셈 및 평균 계산이 가능하지만, '절대영점(Absolute Zero)'이 없으므로 곱셈이나 나눗셈, 배수 비교는 불가능합니다. 절대영점이 존재하여 사칙연산이 모두 가능한 척도는 '비율척도(Ratio Scale)'입니다.", "question_html": "측정 척도(명목, 서열, 등간, 비율척도)에 대한 설명 중 가장 타당하지 않은 것은?", "options_html": ["명목척도: 단순히 대상을 분류하고 구분하기 위한 척도로, 부여된 숫자는 연산적 의미가 없고 최빈값만 확인 가능하다(예: 성별 남=1, 여=2).", "서열척도: 대상 간의 순위나 서열을 나타내지만 순위 간의 간격이 동일하지는 않다(예: 금, 은, 동메달).", "등간척도: 순위뿐만 아니라 속성 간의 간격이 동일하며 절대영점(0)이 존재하여 곱셈과 나눗셈 등 사칙연산이 모두 가능하다.", "비율척도: 절대영점(자연적 영점)이 존재하여 사칙연산이 모두 가능하고 배수 비교(예: 매출액 200억은 100억의 2배)가 가능하다."], "explanation_html": "③ 등간척도(Interval Scale, 예: 온도 ℃, IQ, 리커트 척도)는 간격이 일정하여 덧셈/뺄셈 및 평균 계산이 가능하지만, '절대영점(Absolute Zero)'이 없으므로 곱셈이나 나눗셈, 배수 비교는 불가능합니다. 절대영점이 존재하여 사칙연산이 모두 가능한 척도는 '비율척도(Ratio Scale)'입니다."}, {"id": 20, "set": 1, "no": 20, "type": "choice", "concept": "기술통계량과 평균의 함정", "question": "다음 중 대푯값(평균, 중앙값, 최빈값)에 대한 설명으로 옳은 것은?", "options": ["평균(Mean)은 수학적 계산이 용이하지만 극단적인 이상치(Outlier)의 영향을 크게 받는다는 치명적 한계가 있다.", "'평균의 오류(함정)' 사례처럼 모든 조종사의 신체 평균치로 설계한 조종석은 모든 조종사에게 가장 완벽하게 들어맞는다.", "중앙값(Median)은 이상치에 매우 민감하여 소득 수준 조사 시 평균보다 왜곡이 심하게 발생한다.", "최빈값(Mode)은 데이터에서 가장 드물게 나타나는 극단값을 파악할 때 사용하는 통계량이다."], "answer": 1, "explanation": "① 산술평균은 모든 관측치를 반영하므로 수학적 계산이 용이하나, 극단적인 이상치(Outlier)에 매우 취약합니다(예: 억만장자가 포함된 동네의 평균 소득 왜곡). 필기 노트의 미 공군 조종사 사례(모든 조종사의 신체 평균치로 콕핏을 만들었더니 단 한 명의 체형에도 맞지 않았음)가 바로 '평균의 함정'을 보여줍니다.", "question_html": "다음 중 대푯값(평균, 중앙값, 최빈값)에 대한 설명으로 옳은 것은?", "options_html": ["평균(Mean)은 수학적 계산이 용이하지만 극단적인 이상치(Outlier)의 영향을 크게 받는다는 치명적 한계가 있다.", "'평균의 오류(함정)' 사례처럼 모든 조종사의 신체 평균치로 설계한 조종석은 모든 조종사에게 가장 완벽하게 들어맞는다.", "중앙값(Median)은 이상치에 매우 민감하여 소득 수준 조사 시 평균보다 왜곡이 심하게 발생한다.", "최빈값(Mode)은 데이터에서 가장 드물게 나타나는 극단값을 파악할 때 사용하는 통계량이다."], "explanation_html": "① 산술평균은 모든 관측치를 반영하므로 수학적 계산이 용이하나, 극단적인 이상치(Outlier)에 매우 취약합니다(예: 억만장자가 포함된 동네의 평균 소득 왜곡). 필기 노트의 미 공군 조종사 사례(모든 조종사의 신체 평균치로 콕핏을 만들었더니 단 한 명의 체형에도 맞지 않았음)가 바로 '평균의 함정'을 보여줍니다."}, {"id": 21, "set": 1, "no": 21, "type": "ox", "concept": "휴리스틱의 특성", "question": "휴리스틱(Heuristics)은 시간과 정보가 제한된 상황에서 유용한 의사결정 방식이 될 수 있으나, 과거의 성공 경험에 얽매여 환경 변화에 적응하지 못하는 '성공의 덫'에 빠질 위험이 있다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 필기 노트에 따르면 휴리스틱은 직관과 경험으로 문제를 신속히 해결할 수 있는 장점이 있으나, 과거 성공 방식에만 구속되어 변화를 거부하다 매출 하락을 겪는 '성공의 덫(예: NC소프트의 리니지 Pay-to-win 성공 경험 구속)'을 초래할 수 있습니다.", "question_html": "휴리스틱(Heuristics)은 시간과 정보가 제한된 상황에서 유용한 의사결정 방식이 될 수 있으나, 과거의 성공 경험에 얽매여 환경 변화에 적응하지 못하는 '성공의 덫'에 빠질 위험이 있다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 필기 노트에 따르면 휴리스틱은 직관과 경험으로 문제를 신속히 해결할 수 있는 장점이 있으나, 과거 성공 방식에만 구속되어 변화를 거부하다 매출 하락을 겪는 '성공의 덫(예: NC소프트의 리니지 Pay-to-win 성공 경험 구속)'을 초래할 수 있습니다."}, {"id": 22, "set": 1, "no": 22, "type": "ox", "concept": "정보 획득 비용의 한계비용", "question": "마케팅 조사에서 정보량이 증가함에 따라 정보 획득 비용은 '한계비용 체감'의 형태를 보이므로 정보를 많이 수집할수록 단위 비용은 계속 줄어든다.", "options": ["O", "X"], "answer": "X", "explanation": "정답: X. 정보 수집 비용 곡선은 '체증'합니다. 즉, 초기 기본 정보 수집 이후 심층적이고 희귀한 정보를 획득하려면 탐색 비용과 난이도가 급증하므로 한계비용이 체증합니다.", "question_html": "마케팅 조사에서 정보량이 증가함에 따라 정보 획득 비용은 '한계비용 체감'의 형태를 보이므로 정보를 많이 수집할수록 단위 비용은 계속 줄어든다.", "options_html": ["O", "X"], "explanation_html": "정답: X. 정보 수집 비용 곡선은 '체증'합니다. 즉, 초기 기본 정보 수집 이후 심층적이고 희귀한 정보를 획득하려면 탐색 비용과 난이도가 급증하므로 한계비용이 체증합니다."}, {"id": 23, "set": 1, "no": 23, "type": "ox", "concept": "탐색조사의 일반화 한계", "question": "탐색조사(Exploratory Research)는 연구 초기 통찰력을 얻고 연구 가설을 설정하는 데 유용하지만, 표본의 대표성이 부족하여 결과를 전체 시장으로 일반화하기에는 한계가 있다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 필기 노트 [2]주차에 명시되어 있듯이, 탐색조사는 가설 설정과 문제점 파악에 유용하지만 소규모 정성 조사이므로 '일반화의 한계(but 일반화 한계)'를 가집니다.", "question_html": "탐색조사(Exploratory Research)는 연구 초기 통찰력을 얻고 연구 가설을 설정하는 데 유용하지만, 표본의 대표성이 부족하여 결과를 전체 시장으로 일반화하기에는 한계가 있다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 필기 노트 [2]주차에 명시되어 있듯이, 탐색조사는 가설 설정과 문제점 파악에 유용하지만 소규모 정성 조사이므로 '일반화의 한계(but 일반화 한계)'를 가집니다."}, {"id": 24, "set": 1, "no": 24, "type": "ox", "concept": "인과관계의 시간적 우선성", "question": "인과관계 성립 조건 중 '시간적 우선순위'란 결과 변수의 변화가 원인 변수의 변화보다 시간적으로 먼저 발생하거나 동시에 기록되어야 함을 뜻한다.", "options": ["O", "X"], "answer": "X", "explanation": "정답: X. 시간적 우선성(우선순위)은 원인변수(X)가 반드시 결과변수(Y)보다 시간적으로 먼저 발생해야 함을 의미합니다. 결과가 원인보다 먼저 발생할 수는 없습니다.", "question_html": "인과관계 성립 조건 중 '시간적 우선순위'란 결과 변수의 변화가 원인 변수의 변화보다 시간적으로 먼저 발생하거나 동시에 기록되어야 함을 뜻한다.", "options_html": ["O", "X"], "explanation_html": "정답: X. 시간적 우선성(우선순위)은 원인변수(X)가 반드시 결과변수(Y)보다 시간적으로 먼저 발생해야 함을 의미합니다. 결과가 원인보다 먼저 발생할 수는 없습니다."}, {"id": 25, "set": 1, "no": 25, "type": "ox", "concept": "비확률추출과 표본프레임", "question": "비확률표본추출법(Non-probability Sampling)은 사전에 정확한 표본프레임이 구축되어 있지 않거나 각 표본이 추출될 확률을 알 수 없는 경우에도 실무적으로 널리 사용된다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 필기 노트 [4]주차 표에 명시되어 있듯이, 비확률표본추출은 표본프레임(모집단 명부)과 사전 확률 인지가 불가능(X, X)할 때 상업적 실무 조사에서 신속성과 비용 절감을 위해 빈번하게(상업적 多) 사용됩니다.", "question_html": "비확률표본추출법(Non-probability Sampling)은 사전에 정확한 표본프레임이 구축되어 있지 않거나 각 표본이 추출될 확률을 알 수 없는 경우에도 실무적으로 널리 사용된다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 필기 노트 [4]주차 표에 명시되어 있듯이, 비확률표본추출은 표본프레임(모집단 명부)과 사전 확률 인지가 불가능(X, X)할 때 상업적 실무 조사에서 신속성과 비용 절감을 위해 빈번하게(상업적 多) 사용됩니다."}, {"id": 26, "set": 1, "no": 26, "type": "ox", "concept": "전수조사의 오류 특성", "question": "전수조사는 모집단 전체를 관찰하므로 표본오류(Sampling Error)는 전혀 발생하지 않지만, 조사 규모 확대로 인해 조사원 오류, 무응답 등 비표본오류는 표본조사에 비해 커질 수 있다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 전수조사는 모집단=표본이므로 표본오류=0입니다. 그러나 대규모 조사로 인해 비표본오류가 급증하므로, 정밀하게 관리된 표본조사가 비표본오류가 통제되지 않은 전수조사보다 오히려 더 정확할 수 있습니다.", "question_html": "전수조사는 모집단 전체를 관찰하므로 표본오류(Sampling Error)는 전혀 발생하지 않지만, 조사 규모 확대로 인해 조사원 오류, 무응답 등 비표본오류는 표본조사에 비해 커질 수 있다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 전수조사는 모집단=표본이므로 표본오류=0입니다. 그러나 대규모 조사로 인해 비표본오류가 급증하므로, 정밀하게 관리된 표본조사가 비표본오류가 통제되지 않은 전수조사보다 오히려 더 정확할 수 있습니다."}, {"id": 27, "set": 1, "no": 27, "type": "ox", "concept": "척도 정보량의 포섭 관계", "question": "비율척도로 측정된 데이터(예: 키 180cm, 몸무게 75kg)는 서열척도(대/중/소)나 명목척도(비만/정상) 등 하위 척도 형태로 변환하여 분석하는 것이 이론적으로 불가능하다.", "options": ["O", "X"], "answer": "X", "explanation": "정답: X. 상위 척도인 양적변수(비율/등간)는 정보량이 더 많으므로 하위 척도인 질적변수(서열/명목)로의 변환이 항상 가능합니다(양적 ⟶ 질적 변환 O). 반면 하위 척도를 상위 척도로 거꾸로 변환하는 것은 불가능합니다(질적 ⟶ 양적 변환 X).", "question_html": "비율척도로 측정된 데이터(예: 키 180cm, 몸무게 75kg)는 서열척도(대/중/소)나 명목척도(비만/정상) 등 하위 척도 형태로 변환하여 분석하는 것이 이론적으로 불가능하다.", "options_html": ["O", "X"], "explanation_html": "정답: X. 상위 척도인 양적변수(비율/등간)는 정보량이 더 많으므로 하위 척도인 질적변수(서열/명목)로의 변환이 항상 가능합니다(양적 ⟶ 질적 변환 O). 반면 하위 척도를 상위 척도로 거꾸로 변환하는 것은 불가능합니다(질적 ⟶ 양적 변환 X)."}, {"id": 28, "set": 1, "no": 28, "type": "ox", "concept": "리커트 척도의 척도 유형", "question": "마케팅 설문조사에서 가장 흔히 쓰이는 '리커트 척도(1점: 전혀 그렇지 않다 ~ 7점: 매우 그렇다)'는 점수 0이 '만족도가 전혀 없음'을 뜻하는 절대영점이므로 비율척도에 해당한다.", "options": ["O", "X"], "answer": "X", "explanation": "정답: X. 리커트 척도는 응답 범주 간의 간격이 동일하다고 가정하여 평균 계산을 수행하는 대표적인 '등간척도(Interval Scale)'입니다. 절대영점이 없으므로 6점 응답자가 3점 응답자보다 만족도가 정확히 2배 높다고 단정할 수 없습니다.", "question_html": "마케팅 설문조사에서 가장 흔히 쓰이는 '리커트 척도(1점: 전혀 그렇지 않다 ~ 7점: 매우 그렇다)'는 점수 0이 '만족도가 전혀 없음'을 뜻하는 절대영점이므로 비율척도에 해당한다.", "options_html": ["O", "X"], "explanation_html": "정답: X. 리커트 척도는 응답 범주 간의 간격이 동일하다고 가정하여 평균 계산을 수행하는 대표적인 '등간척도(Interval Scale)'입니다. 절대영점이 없으므로 6점 응답자가 3점 응답자보다 만족도가 정확히 2배 높다고 단정할 수 없습니다."}, {"id": 29, "set": 1, "no": 29, "type": "ox", "concept": "표본분산의 자유도", "question": "표본분산($s^2$)을 계산할 때 편차 제곱합을 표본 크기 $n$ 대신 $(n-1)$로 나누는 것은, 모분산에 대한 불편추정량(unbiased estimator)을 얻기 위한 자유도 보정 때문이다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 필기 노트 [7]주차에 명시되어 있듯이 표본분산 계산 시 표본평균 $\\bar{X}$가 이미 1개의 제약조건을 차지하므로 자유도는 $(n-1)$이 되며, 이를 나누어야 모분산을 과소추정하지 않고 정확히 추정할 수 있습니다.", "question_html": "표본분산($s^2$)을 계산할 때 편차 제곱합을 표본 크기 $n$ 대신 $(n-1)$로 나누는 것은, 모분산에 대한 불편추정량(unbiased estimator)을 얻기 위한 자유도 보정 때문이다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 필기 노트 [7]주차에 명시되어 있듯이 표본분산 계산 시 표본평균 $\\bar{X}$가 이미 1개의 제약조건을 차지하므로 자유도는 $(n-1)$이 되며, 이를 나누어야 모분산을 과소추정하지 않고 정확히 추정할 수 있습니다."}, {"id": 30, "set": 1, "no": 30, "type": "ox", "concept": "파이썬 산술연산자 문법", "question": "파이썬에서 `price = 6000`일 때, `price // 5000`은 나눗셈의 나머지를 구하므로 결과값은 `1000`이다.", "options": ["O", "X"], "answer": "X", "explanation": "정답: X. 파이썬에서 `//` 연산자는 나눗셈의 '몫(정수)'을 구하는 연산자이므로 `6000 // 5000`의 결과는 `1`입니다. 나눗셈의 나머지를 구하는 연산자는 `%`이며, `6000 % 5000`의 결과가 `1000`입니다.", "question_html": "파이썬에서 <code>price = 6000</code>일 때, <code>price // 5000</code>은 나눗셈의 나머지를 구하므로 결과값은 <code>1000</code>이다.", "options_html": ["O", "X"], "explanation_html": "정답: X. 파이썬에서 <code>//</code> 연산자는 나눗셈의 '몫(정수)'을 구하는 연산자이므로 <code>6000 // 5000</code>의 결과는 <code>1</code>입니다. 나눗셈의 나머지를 구하는 연산자는 <code>%</code>이며, <code>6000 % 5000</code>의 결과가 <code>1000</code>입니다."}]}, {"set_num": 2, "title": "시즌 1 제2회 (심화 함정 30제)", "desc": "비즈니스 실패 사례(NC, 프리챌), 실험설계 외생변수 통제, 설문지 MECE, 정규분포 계산 응용", "questions": [{"id": 31, "set": 2, "no": 1, "type": "choice", "concept": "직관과 성공의 덫 (NC 리니지 사례)", "question": "다음 중 과거의 성공 경험과 직관에 과도하게 의존하여 발생하는 '성공의 덫(Success Trap)'에 대한 설명으로 가장 적절하지 않은 것은?", "options": ["과거에 막대한 매출을 창출했던 특정 비즈니스 모델(예: Pay-to-Win)을 시장 환경과 소비자 세대가 바뀌었음에도 무비판적으로 고수하는 현상이다.", "성공 경험에 대한 구속이 강할수록 객관적인 시장 피드백이나 마케팅 조사의 시사점을 수용하기 쉬워진다.", "기업이 과거 성공 공식에 집착하여 게임 이용자들의 플레이 중심(Play-to-Win) 니즈 변화를 외면할 경우 이용자 이탈과 기업 가치 하락을 초래할 수 있다.", "휴리스틱 의사결정의 한계를 극복하기 위해서는 직관을 맹신하기보다 객관적인 마케팅 조사를 통해 시장 트렌드를 지속적으로 모니터링해야 한다."], "answer": 2, "explanation": "② 과거 성공 경험에 대한 구속이 강할수록(성공의 덫) 경영진은 자기 확증 편향에 빠져 새로운 마케팅 조사의 객관적 피드백이나 외부 시장 신호를 오히려 무시하거나 배척하게 됩니다. 따라서 수용하기 쉬워진다는 설명은 틀렸습니다.", "question_html": "다음 중 과거의 성공 경험과 직관에 과도하게 의존하여 발생하는 '성공의 덫(Success Trap)'에 대한 설명으로 가장 적절하지 않은 것은?", "options_html": ["과거에 막대한 매출을 창출했던 특정 비즈니스 모델(예: Pay-to-Win)을 시장 환경과 소비자 세대가 바뀌었음에도 무비판적으로 고수하는 현상이다.", "성공 경험에 대한 구속이 강할수록 객관적인 시장 피드백이나 마케팅 조사의 시사점을 수용하기 쉬워진다.", "기업이 과거 성공 공식에 집착하여 게임 이용자들의 플레이 중심(Play-to-Win) 니즈 변화를 외면할 경우 이용자 이탈과 기업 가치 하락을 초래할 수 있다.", "휴리스틱 의사결정의 한계를 극복하기 위해서는 직관을 맹신하기보다 객관적인 마케팅 조사를 통해 시장 트렌드를 지속적으로 모니터링해야 한다."], "explanation_html": "② 과거 성공 경험에 대한 구속이 강할수록(성공의 덫) 경영진은 자기 확증 편향에 빠져 새로운 마케팅 조사의 객관적 피드백이나 외부 시장 신호를 오히려 무시하거나 배척하게 됩니다. 따라서 수용하기 쉬워진다는 설명은 틀렸습니다."}, {"id": 32, "set": 2, "no": 2, "type": "choice", "concept": "가용성 편향의 심화 분석", "question": "기업의 신제품 개발 회의에서 한 마케팅 담당자가 '어제 SNS에서 우리 제품 포장에 불만을 제기한 인플루언서의 릴스 영상이 폭발적 조회를 기록했으니, 전 제품의 패키지를 즉시 전면 교체해야 합니다'라고 주장하였다. 이 담당자가 범하고 있는 오류와 가장 관련 깊은 휴리스틱은?", "options": ["가용성 편향 (Availability Heuristic)", "기준점 설정 및 조정 편향 (Anchoring & Adjustment)", "대표성 편향 (Representativeness Heuristic)", "군집 표본추출 편향 (Cluster Sampling Bias)"], "answer": 1, "explanation": "① 최근에 보고 강하게 각인된 자극적이고 생생한 SNS 정보에 과도한 가중치를 두어 전체 고객의 일반적 반응으로 착각하는 것은 전형적인 '가용성 편향(Availability Heuristic)'입니다. 전체 고객 대상의 객관적 VOC 빈도 분석이나 서베이를 거치지 않은 편향된 결정입니다.", "question_html": "기업의 신제품 개발 회의에서 한 마케팅 담당자가 '어제 SNS에서 우리 제품 포장에 불만을 제기한 인플루언서의 릴스 영상이 폭발적 조회를 기록했으니, 전 제품의 패키지를 즉시 전면 교체해야 합니다'라고 주장하였다. 이 담당자가 범하고 있는 오류와 가장 관련 깊은 휴리스틱은?", "options_html": ["가용성 편향 (Availability Heuristic)", "기준점 설정 및 조정 편향 (Anchoring & Adjustment)", "대표성 편향 (Representativeness Heuristic)", "군집 표본추출 편향 (Cluster Sampling Bias)"], "explanation_html": "① 최근에 보고 강하게 각인된 자극적이고 생생한 SNS 정보에 과도한 가중치를 두어 전체 고객의 일반적 반응으로 착각하는 것은 전형적인 '가용성 편향(Availability Heuristic)'입니다. 전체 고객 대상의 객관적 VOC 빈도 분석이나 서베이를 거치지 않은 편향된 결정입니다."}, {"id": 33, "set": 2, "no": 3, "type": "choice", "concept": "대표성 편향과 비즈니스 실패", "question": "국내 유통 대기업(이마트, 롯데마트 등)의 동남아 시장 진출 실패 사례에서 지적된 '대표성 편향(Representativeness Bias)'의 본질로 가장 옳은 것은?", "options": ["동남아 소비자의 평균 연령이 낮다는 단편적 특징만 보고 '젊은 층은 개방적이고 한국식 대형마트를 무조건 선호할 것'이라고 단순 분류하여 현지의 종교적 식문화(할랄 등)와 전통 재래시장 선호도를 간과하였다.", "초기 매장 부지 선정 시 임대료를 너무 높게 책정하여 앵커링 효과로 인해 철수하지 못하였다.", "통계 패키지 R이나 파이썬의 회귀분석 결과만을 맹신하여 현장 방문 조사를 소홀히 하였다.", "표본 크기를 30개 미만으로 추출하여 중심극한정리가 성립하지 않았다."], "answer": 1, "explanation": "① 필기 노트 [1]주차에 명시되어 있듯이 동남아 진출 실패는 '젊으니까 창의적/소비지향적일 것'이라는 대표 범주의 고정관념에 기초하여, 이슬람 문화권의 종교적 규율이나 현지 고유의 생활 방식을 무시한 '대표성 오류(단순화)'의 대표적 사례입니다.", "question_html": "국내 유통 대기업(이마트, 롯데마트 등)의 동남아 시장 진출 실패 사례에서 지적된 '대표성 편향(Representativeness Bias)'의 본질로 가장 옳은 것은?", "options_html": ["동남아 소비자의 평균 연령이 낮다는 단편적 특징만 보고 '젊은 층은 개방적이고 한국식 대형마트를 무조건 선호할 것'이라고 단순 분류하여 현지의 종교적 식문화(할랄 등)와 전통 재래시장 선호도를 간과하였다.", "초기 매장 부지 선정 시 임대료를 너무 높게 책정하여 앵커링 효과로 인해 철수하지 못하였다.", "통계 패키지 R이나 파이썬의 회귀분석 결과만을 맹신하여 현장 방문 조사를 소홀히 하였다.", "표본 크기를 30개 미만으로 추출하여 중심극한정리가 성립하지 않았다."], "explanation_html": "① 필기 노트 [1]주차에 명시되어 있듯이 동남아 진출 실패는 '젊으니까 창의적/소비지향적일 것'이라는 대표 범주의 고정관념에 기초하여, 이슬람 문화권의 종교적 규율이나 현지 고유의 생활 방식을 무시한 '대표성 오류(단순화)'의 대표적 사례입니다."}, {"id": 34, "set": 2, "no": 4, "type": "choice", "concept": "기준점 설정 편향 (위워크 사례)", "question": "공유오피스 기업 위워크(WeWork)가 기업공개(IPO) 과정에서 470억 달러라는 천문학적 기업가치를 인정받았다가 급격히 몰락한 사례와 관련하여, '기준점 설정(Anchoring)'의 마케팅 조사적 시사점으로 가장 옳은 것은?", "options": ["단순한 '공간 대여(부동산 임대업)'라는 본질 대신 '혁신 테크 플랫폼 기업'이라는 임의의 기준점(Anchor)을 설정하고 PER 배수를 과도하게 부여하여 가치를 왜곡 평가하였다.", "FGI 조사 시 사회자가 중립을 지키지 않고 유도질문을 던졌기 때문이다.", "비표본오류 중 불포함 오류가 발생하여 모집단의 대표성을 잃었기 때문이다.", "설문지 문항을 MECE 원칙에 따라 설계하여 응답자의 피로도가 극대화되었기 때문이다."], "answer": 1, "explanation": "① 필기 노트 [1]주차 'we work: 일 공간 대여, per 기준설정 잘못'에 나타나듯, 위워크는 전통적인 부동산 전대업임에도 불구하고 하이테크 IT 플랫폼이라는 잘못된 앵커(기준점)를 설정하여 기업가치를 비정상적으로 부풀렸던 기준점 설정 오류의 대표적 사례입니다.", "question_html": "공유오피스 기업 위워크(WeWork)가 기업공개(IPO) 과정에서 470억 달러라는 천문학적 기업가치를 인정받았다가 급격히 몰락한 사례와 관련하여, '기준점 설정(Anchoring)'의 마케팅 조사적 시사점으로 가장 옳은 것은?", "options_html": ["단순한 '공간 대여(부동산 임대업)'라는 본질 대신 '혁신 테크 플랫폼 기업'이라는 임의의 기준점(Anchor)을 설정하고 PER 배수를 과도하게 부여하여 가치를 왜곡 평가하였다.", "FGI 조사 시 사회자가 중립을 지키지 않고 유도질문을 던졌기 때문이다.", "비표본오류 중 불포함 오류가 발생하여 모집단의 대표성을 잃었기 때문이다.", "설문지 문항을 MECE 원칙에 따라 설계하여 응답자의 피로도가 극대화되었기 때문이다."], "explanation_html": "① 필기 노트 [1]주차 'we work: 일 공간 대여, per 기준설정 잘못'에 나타나듯, 위워크는 전통적인 부동산 전대업임에도 불구하고 하이테크 IT 플랫폼이라는 잘못된 앵커(기준점)를 설정하여 기업가치를 비정상적으로 부풀렸던 기준점 설정 오류의 대표적 사례입니다."}, {"id": 35, "set": 2, "no": 5, "type": "choice", "concept": "FGI와 건대입구 롯데백화점 사례", "question": "건대입구 롯데백화점이 '중년층 중심 상권으로 오판하여 매출이 침체'되었을 때, FGI(표적집단면접법)를 실시하여 문제를 해결한 과정에 대한 설명으로 옳은 것은?", "options": ["건대입구 상권의 실제 유동인구인 2030 대학생 및 젊은 층을 표적으로 심층 FGI를 실시하여 그들의 니즈를 파악하고 MD(매장구성)를 젊은 층 위주로 전면 개편하였다.", "기존 중년 단골 고객만을 모아 FGI를 진행한 뒤 프리미엄 명품관을 대폭 확대하였다.", "FGI 대신 10만 명을 대상으로 전수조사를 실시하여 1년 뒤에야 결과를 도출하였다.", "FGI 결과를 바탕으로 조사원의 비표본오류를 0으로 만들었다."], "answer": 1, "explanation": "① 필기 노트 [2]주차 사례에 따르면, 건대입구 롯데백화점은 '중년 상권 오판으로 매출 하락'을 겪다가, 타깃 고객을 명확히 설정한 심층 FGI를 통해 대학생 및 젊은 소비자의 진실된 욕구를 포착하고 매장 공간과 브랜드를 젊은 감성으로 변화(FGI ⟶ 변화)시켜 회생하였습니다.", "question_html": "건대입구 롯데백화점이 '중년층 중심 상권으로 오판하여 매출이 침체'되었을 때, FGI(표적집단면접법)를 실시하여 문제를 해결한 과정에 대한 설명으로 옳은 것은?", "options_html": ["건대입구 상권의 실제 유동인구인 2030 대학생 및 젊은 층을 표적으로 심층 FGI를 실시하여 그들의 니즈를 파악하고 MD(매장구성)를 젊은 층 위주로 전면 개편하였다.", "기존 중년 단골 고객만을 모아 FGI를 진행한 뒤 프리미엄 명품관을 대폭 확대하였다.", "FGI 대신 10만 명을 대상으로 전수조사를 실시하여 1년 뒤에야 결과를 도출하였다.", "FGI 결과를 바탕으로 조사원의 비표본오류를 0으로 만들었다."], "explanation_html": "① 필기 노트 [2]주차 사례에 따르면, 건대입구 롯데백화점은 '중년 상권 오판으로 매출 하락'을 겪다가, 타깃 고객을 명확히 설정한 심층 FGI를 통해 대학생 및 젊은 소비자의 진실된 욕구를 포착하고 매장 공간과 브랜드를 젊은 감성으로 변화(FGI ⟶ 변화)시켜 회생하였습니다."}, {"id": 36, "set": 2, "no": 6, "type": "choice", "concept": "기술조사의 횡단 vs 시계열", "question": "기술조사(Descriptive Research)의 두 가지 형태인 '횡단조사(Cross-sectional Design)'와 '종단/시계열조사(Longitudinal Design)'에 대한 비교로 옳지 않은 것은?", "options": ["횡단조사는 특정 시점에 모집단에서 추출된 표본으로부터 단 1회성으로 정보를 수집하는 정태적 조사이다.", "시계열조사(종단조사)는 동일한 표본(패널)이나 모집단을 대상으로 시간의 흐름에 따라 반복적으로 측정하는 동태적 조사이다.", "소비자 트렌드의 시간에 따른 변화 양상이나 광고 캠페인 전후의 브랜드 선호도 변화를 추적하기에는 횡단조사가 시계열조사보다 훨씬 적합하다.", "시계열조사는 패널 탈락(Panel Attrition) 현상과 높은 유지 비용이 단점으로 작용할 수 있다."], "answer": 3, "explanation": "③ 시간에 따른 변화 추세나 광고 전후의 브랜드 태도 변화를 추적·비교하는 데는 '시계열조사(종단조사)'가 적합합니다. 횡단조사는 특정 한 시점의 스냅샷만을 보여주므로 시간적 변화 과정을 직접 추적하기 어렵습니다.", "question_html": "기술조사(Descriptive Research)의 두 가지 형태인 '횡단조사(Cross-sectional Design)'와 '종단/시계열조사(Longitudinal Design)'에 대한 비교로 옳지 않은 것은?", "options_html": ["횡단조사는 특정 시점에 모집단에서 추출된 표본으로부터 단 1회성으로 정보를 수집하는 정태적 조사이다.", "시계열조사(종단조사)는 동일한 표본(패널)이나 모집단을 대상으로 시간의 흐름에 따라 반복적으로 측정하는 동태적 조사이다.", "소비자 트렌드의 시간에 따른 변화 양상이나 광고 캠페인 전후의 브랜드 선호도 변화를 추적하기에는 횡단조사가 시계열조사보다 훨씬 적합하다.", "시계열조사는 패널 탈락(Panel Attrition) 현상과 높은 유지 비용이 단점으로 작용할 수 있다."], "explanation_html": "③ 시간에 따른 변화 추세나 광고 전후의 브랜드 태도 변화를 추적·비교하는 데는 '시계열조사(종단조사)'가 적합합니다. 횡단조사는 특정 한 시점의 스냅샷만을 보여주므로 시간적 변화 과정을 직접 추적하기 어렵습니다."}, {"id": 37, "set": 2, "no": 7, "type": "choice", "concept": "실험설계의 유형 (원시, 순수, 유사)", "question": "다음 중 실험집단과 통제집단을 모두 두고, 실험대상을 무작위 할당(Randomization)하여 외생변수를 가장 철저하게 통제할 수 있는 가장 발전된 실험설계 형태는?", "options": ["원시실험설계 (Pre-experimental Design)", "순수실험설계 (True Experimental Design)", "유사실험설계 (Quasi-experimental Design)", "비구조적 관찰설계 (Unstructured Observational Design)"], "answer": 2, "explanation": "② 필기 노트 [2]주차에 분류된 원시/순수/유사실험설계 중, 통제집단이 존재하고 무작위 할당(Randomization)을 통해 외생변수를 엄격히 통제할 수 있는 가장 과학적이고 이상적인 형태는 '순수실험설계(True Experimental Design)'입니다.", "question_html": "다음 중 실험집단과 통제집단을 모두 두고, 실험대상을 무작위 할당(Randomization)하여 외생변수를 가장 철저하게 통제할 수 있는 가장 발전된 실험설계 형태는?", "options_html": ["원시실험설계 (Pre-experimental Design)", "순수실험설계 (True Experimental Design)", "유사실험설계 (Quasi-experimental Design)", "비구조적 관찰설계 (Unstructured Observational Design)"], "explanation_html": "② 필기 노트 [2]주차에 분류된 원시/순수/유사실험설계 중, 통제집단이 존재하고 무작위 할당(Randomization)을 통해 외생변수를 엄격히 통제할 수 있는 가장 과학적이고 이상적인 형태는 '순수실험설계(True Experimental Design)'입니다."}, {"id": 38, "set": 도 평가 문항을 설문 초반에 배치해야 응답 집중도가 유지된다.", "동일한 주제의 문항들은 무작위로 여러 페이지에 분산 배치해야 후광효과(Halo effect)를 완전히 없앨 수 있다."], "answer": 2, "explanation": "② 설문지 순서는 일반적이고 쉬운 문항에서 구체적이고 어려운 문항으로 좁혀가는 깔때기(Funnel) 순서가 원칙입니다. 필기 노트 [5]주차에 명시되어 있듯이 '어려운 항목, 개인정보(소득, 학력 등)는 맨 뒤에' 배치하여 응답 거부율과 중도 이탈을 방지해야 합니다.", "question_html": "설문지의 질문 순서 결정에 대한 지침으로 가장 올바른 것은?", "options_html": ["응답자의 가구 소득, 학력, 종교 등 민감한 개인 신상 정보는 설문 시작 부분(1~2번)에 배치하여 신뢰를 얻는다.", "처음에는 응답하기 쉽고 흥미를 유발할 수 있는 일반적인 개방형 질문이나 가벼운 도입 질문으로 시작한다.", "생각을 많이 해야 하는 까다로운 질문이나 복잡한 태도 평가 문항을 설문 초반에 배치해야 응답 집중도가 유지된다.", "동일한 주제의 문항들은 무작위로 여러 페이지에 분산 배치해야 후광효과(Halo effect)를 완전히 없앨 수 있다."], "explanation_html": "② 설문지 순서는 일반적이고 쉬운 문항에서 구체적이고 어려운 문항으로 좁혀가는 깔때기(Funnel) 순서가 원칙입니다. 필기 노트 [5]주차에 명시되어 있듯이 '어려운 항목, 개인정보(소득, 학력 등)는 맨 뒤에' 배치하여 응답 거부율과 중도 이탈을 방지해야 합니다."}, {"id": 42, "set": 2, "no": 12, "type": "choice", "concept": "자료분석 단계: 편집과 코딩", "question": "수집된 설문 데이터를 분석하기 전에 수행하는 '편집(Editing)'과 '코딩(Coding)'에 대한 설명으로 옳은 것은?", "options": ["편집(Editing)은 설문 응답에 번호를 매겨 컴퓨터에 입력 가능한 수치값으로 변환하는 과정이다.", "코딩(Coding)은 누락된 응답, 일괄 기계적 응답, 모순된 응답이 있는 부실 설문지를 검토하여 폐기하거나 수정하는 과정이다.", "편집은 '사용 가능한 설문지 검토'이며, 코딩은 문자로 된 설문 응답을 분석용 '수치값으로 변환하여 자료를 입력'하는 작업이다.", "온라인 서베이를 진행할 경우 편집과 코딩은 완전히 불필요하므로 생략한다."], "answer": 3, "explanation": "③ 필기 노트 [5]주차에 명시된 내용입니다. 편집(Editing)은 수집된 설문지 중 무성의 응답이나 이상치를 검토하여 분석 적합성을 걸러내는 작업이며, 코딩(Coding)은 '남=1, 여=2'처럼 응답 내용을 통계 패키지가 읽을 수 있는 수치 코드로 변환하는 과정입니다.", "question_html": "수집된 설문 데이터를 분석하기 전에 수행하는 '편집(Editing)'과 '코딩(Coding)'에 대한 설명으로 옳은 것은?", "options_html": ["편집(Editing)은 설문 응답에 번호를 매겨 컴퓨터에 입력 가능한 수치값으로 변환하는 과정이다.", "코딩(Coding)은 누락된 응답, 일괄 기계적 응답, 모순된 응답이 있는 부실 설문지를 검토하여 폐기하거나 수정하는 과정이다.", "편집은 '사용 가능한 설문지 검토'이며, 코딩은 문자로 된 설문 응답을 분석용 '수치값으로 변환하여 자료를 입력'하는 작업이다.", "온라인 서베이를 진행할 경우 편집과 코딩은 완전히 불필요하므로 생략한다."], "explanation_html": "③ 필기 노트 [5]주차에 명시된 내용입니다. 편집(Editing)은 수집된 설문지 중 무성의 응답이나 이상치를 검토하여 분석 적합성을 걸러내는 작업이며, 코딩(Coding)은 '남=1, 여=2'처럼 응답 내용을 통계 패키지가 읽을 수 있는 수치 코드로 변환하는 과정입니다."}, {"id": 43, "set": 2, "no": 13, "type": "choice", "concept": "투사법과 인스턴트 커피 사례", "question": "미국의 유명한 '인스턴트 커피 투사법 연구'에서 쇼핑 목록에 일반 원두커피 대신 인스턴트 커피를 적은 주부에 대해 응답자들이 '게으르고 가계 경제를 알뜰하게 돌보지 않는다'고 평가한 실험 결과가 주는 마케팅적 시사점은?", "options": ["소비자들은 직접 질문했을 때는 '맛이 없어서 안 산다'고 핑계를 대었으나, 실제 무의식 속에는 게으른 주부로 보이기 싫은 사회적 체면과 죄책감이 구매 저해 요인이었음을 밝혀내어 '편리성' 대신 '정통 커피의 깊은 맛'을 강조하는 포지셔닝으로 전환하여 성공하였다.", "인스턴트 커피는 어떤 경우에도 원두커피의 품질을 따라갈 수 없다는 점을 통계적으로 입증하였다.", "직접 서베이 질문만으로도 소비자의 무의식적 거부감을 100% 포착할 수 있음을 보여주었다.", "투사법은 시간과 비용이 너무 많이 들어 실무적으로는 전혀 적용 가치가 없음을 보여주었다."], "answer": 1, "explanation": "① 필기 노트 [4]주차 '투사법: ex) 인스턴트커피, 편리성 ⟶ 맛 강조'에 해당합니다. 소비자가 직접 설문에서는 맛 때문이라고 했지만 투사법을 통해 내면의 죄책감(게으름)을 발견하였고, 광고 컨셉을 편리성 강조에서 원두 고유의 깊은 맛과 정성으로 전환하여 큰 성공을 거두었습니다.", "question_html": "미국의 유명한 '인스턴트 커피 투사법 연구'에서 쇼핑 목록에 일반 원두커피 대신 인스턴트 커피를 적은 주부에 대해 응답자들이 '게으르고 가계 경제를 알뜰하게 돌보지 않는다'고 평가한 실험 결과가 주는 마케팅적 시사점은?", "options_html": ["소비자들은 직접 질문했을 때는 '맛이 없어서 안 산다'고 핑계를 대었으나, 실제 무의식 속에는 게으른 주부로 보이기 싫은 사회적 체면과 죄책감이 구매 저해 요인이었음을 밝혀내어 '편리성' 대신 '정통 커피의 깊은 맛'을 강조하는 포지셔닝으로 전환하여 성공하였다.", "인스턴트 커피는 어떤 경우에도 원두커피의 품질을 따라갈 수 없다는 점을 통계적으로 입증하였다.", "직접 서베이 질문만으로도 소비자의 무의식적 거부감을 100% 포착할 수 있음을 보여주었다.", "투사법은 시간과 비용이 너무 많이 들어 실무적으로는 전혀 적용 가치가 없음을 보여주었다."], "explanation_html": "① 필기 노트 [4]주차 '투사법: ex) 인스턴트커피, 편리성 ⟶ 맛 강조'에 해당합니다. 소비자가 직접 설문에서는 맛 때문이라고 했지만 투사법을 통해 내면의 죄책감(게으름)을 발견하였고, 광고 컨셉을 편리성 강조에서 원두 고유의 깊은 맛과 정성으로 전환하여 큰 성공을 거두었습니다."}, {"id": 44, "set": 2, "no": 14, "type": "choice", "concept": "파코 언더힐의 쇼핑 관찰 연구", "question": "소비자 행동 연구가 파코 언더힐(Paco Underhill)의 오프라인 쇼핑 동선 관찰 연구와 관련된 설명으로 가장 적절하지 않은 것은?", "options": ["소비자들은 매장에 진입할 때 무의식적으로 오른쪽 방향으로 시선을 두고 이동하는 경향이 있음을 발견하였다.", "통로가 좁아 뒤에서 다른 사람과 엉덩이가 부딪히는 순간(Bütt-brush effect) 쇼핑을 중단하고 매장을 떠나는 현상을 포착하였다.", "소비자에게 설문지로 '당신은 쇼핑할 때 왜 매장 오른쪽으로 가십니까?'라고 물어보는 것이 관찰법보다 훨씬 더 정확한 답변을 얻을 수 있다.", "관찰법은 소비자의 실제 행동을 현장에서 왜곡 없이 포착할 수 있으나, 그러한 행동을 하게 된 근본적 심리적 원인 규명에는 한계가 있다."], "answer": 3, "explanation": "③ 파코 언더힐의 연구는 소비자가 스스로 자각하지 못하는 무의식적 행동 습관을 관찰로 밝혀낸 것입니다. 설문지로 직접 물어보면 소비자는 그 이유를 알지 못하거나 합리화된 가짜 답변을 내놓으므로, 비언어적 행동 관찰이 훨씬 유효합니다.", "question_html": "소비자 행동 연구가 파코 언더힐(Paco Underhill)의 오프라인 쇼핑 동선 관찰 연구와 관련된 설명으로 가장 적절하지 않은 것은?", "options_html": ["소비자들은 매장에 진입할 때 무의식적으로 오른쪽 방향으로 시선을 두고 이동하는 경향이 있음을 발견하였다.", "통로가 좁아 뒤에서 다른 사람과 엉덩이가 부딪히는 순간(Bütt-brush effect) 쇼핑을 중단하고 매장을 떠나는 현상을 포착하였다.", "소비자에게 설문지로 '당신은 쇼핑할 때 왜 매장 오른쪽으로 가십니까?'라고 물어보는 것이 관찰법보다 훨씬 더 정확한 답변을 얻을 수 있다.", "관찰법은 소비자의 실제 행동을 현장에서 왜곡 없이 포착할 수 있으나, 그러한 행동을 하게 된 근본적 심리적 원인 규명에는 한계가 있다."], "explanation_html": "③ 파코 언더힐의 연구는 소비자가 스스로 자각하지 못하는 무의식적 행동 습관을 관찰로 밝혀낸 것입니다. 설문지로 직접 물어보면 소비자는 그 이유를 알지 못하거나 합리화된 가짜 답변을 내놓으므로, 비언어적 행동 관찰이 훨씬 유효합니다."}, {"id": 45, "set": 2, "no": 15, "type": "choice", "concept": "할당추출 vs 층화추출", "question": "'할당표본추출법(Quota Sampling)'과 '층화표본추출법(Stratified Sampling)'의 공통점과 결정적인 차이점을 바르게 설명한 것은?", "options": ["공통점: 모집단을 인구통계학적 특성(성별, 연령 등)에 따라 하위 집단으로 나눈다는 점 / 차이점: 하위 집단 내에서 층화추출은 '무작위(확률) 추출'을 하고, 할당추출은 조사원의 '편의적(비확률) 판단'으로 추출한다는 점", "공통점: 표본오류를 통계적으로 계산할 수 있다는 점 / 차이점: 층화추출은 비확률추출이고 할당추출은 확률추출이라는 점", "공통점: 표본프레임이 전혀 필요 없다는 점 / 차이점: 할당추출만 전화번호부를 사용한다는 점", "두 방법은 이름만 다를 뿐 표본 추출 방식과 통계적 검증력이 완벽히 동일하다."], "answer": 1, "explanation": "① 층화추출과 할당추출은 둘 다 모집단을 성별, 학년 등 비율에 맞춰 층을 나눈다는 공통점이 있습니다. 그러나 각 집단 내에서 표본을 뽑을 때 층화추출은 '확률적 무작위 추출'을 수행하여 표본오류 계산이 가능한 반면, 할당추출은 조사원이 길거리나 주변에서 임의로 인원을 채우는 '비확률 편의추출'이므로 표본오류 계산 및 검증이 불가능합니다.", "question_html": "'할당표본추출법(Quota Sampling)'과 '층화표본추출법(Stratified Sampling)'의 공통점과 결정적인 차이점을 바르게 설명한 것은?", "options_html": ["공통점: 모집단을 인구통계학적 특성(성별, 연령 등)에 따라 하위 집단으로 나눈다는 점 / 차이점: 하위 집단 내에서 층화추출은 '무작위(확률) 추출'을 하고, 할당추출은 조사원의 '편의적(비확률) 판단'으로 추출한다는 점", "공통점: 표본오류를 통계적으로 계산할 수 있다는 점 / 차이점: 층화추출은 비확률추출이고 할당추출은 확률추출이라는 점", "공통점: 표본프레임이 전혀 필요 없다는 점 / 차이점: 할당추출만 전화번호부를 사용한다는 점", "두 방법은 이름만 다를 뿐 표본 추출 방식과 통계적 검증력이 완벽히 동일하다."], "explanation_html": "① 층화추출과 할당추출은 둘 다 모집단을 성별, 학년 등 비율에 맞춰 층을 나눈다는 공통점이 있습니다. 그러나 각 집단 내에서 표본을 뽑을 때 층화추출은 '확률적 무작위 추출'을 수행하여 표본오류 계산이 가능한 반면, 할당추출은 조사원이 길거리나 주변에서 임의로 인원을 채우는 '비확률 편의추출'이므로 표본오류 계산 및 검증이 불가능합니다."}, {"id": 46, "set": 2, "no": 16, "type": "choice", "concept": "비표본오류의 세부 분류", "question": "비표본오류(Non-sampling Error) 중 '비관찰 오류(Non-observation Error)'에 속하는 두 가지 핵심 유형은?", "options": ["조사원의 기록 오류 / 설문지 인쇄 오류", "불포함 오류(Coverage Error) / 무응답 오류(Non-response Error)", "응답자의 불성실 답변 / 데이터 코딩 오류", "모집단 크기 오류 / 척도 간격 오류"], "answer": 2, "explanation": "② 필기 노트 [4]주차 오류 분류도에 따르면 비표본오류는 관찰 오류(조사현장의 불성실 답변, 자료기록/처리)와 비관찰 오류(불포함: 표본프레임≠모집단, 무응답)로 구분됩니다.", "question_html": "비표본오류(Non-sampling Error) 중 '비관찰 오류(Non-observation Error)'에 속하는 두 가지 핵심 유형은?", "options_html": ["조사원의 기록 오류 / 설문지 인쇄 오류", "불포함 오류(Coverage Error) / 무응답 오류(Non-response Error)", "응답자의 불성실 답변 / 데이터 코딩 오류", "모집단 크기 오류 / 척도 간격 오류"], "explanation_html": "② 필기 노트 [4]주차 오류 분류도에 따르면 비표본오류는 관찰 오류(조사현장의 불성실 답변, 자료기록/처리)와 비관찰 오류(불포함: 표본프레임≠모집단, 무응답)로 구분됩니다."}, {"id": 47, "set": 2, "no": 17, "type": "choice", "concept": "변수의 유형과 통계 분석", "question": "변수 간의 관계를 분석할 때, '분산분석(ANOVA)'이나 '독립표본 t-검정'의 종속변수로 사용될 수 있는 척도 유형으로 가장 적절한 것은?", "options": ["명목척도 (예: 거주지역, 성별)", "서열척도 (예: 브랜드 선호 순위 1, 2, 3위)", "등간척도 또는 비율척도 (예: 만족도 점수, 구매 금액)", "어떤 척도이든 상관없이 자유롭게 종속변수로 사용할 수 있다."], "answer": 3, "explanation": "③ 분산분석(ANOVA)이나 t-검정은 집단 간의 '평균(Mean)' 차이를 검정하는 분석 기법이므로, 종속변수는 반드시 산술평균 계산이 수학적으로 허용되는 '등간척도(Interval)' 또는 '비율척도(Ratio)'의 양적변수(Metric)이어야 합니다(학생 기출 후기 문제 '분산분석의 종속변수는 평균의 계산이 가능해야 한다 (O)' 반영).", "question_html": "변수 간의 관계를 분석할 때, '분산분석(ANOVA)'이나 '독립표본 t-검정'의 종속변수로 사용될 수 있는 척도 유형으로 가장 적절한 것은?", "options_html": ["명목척도 (예: 거주지역, 성별)", "서열척도 (예: 브랜드 선호 순위 1, 2, 3위)", "등간척도 또는 비율척도 (예: 만족도 점수, 구매 금액)", "어떤 척도이든 상관없이 자유롭게 종속변수로 사용할 수 있다."], "explanation_html": "③ 분산분석(ANOVA)이나 t-검정은 집단 간의 '평균(Mean)' 차이를 검정하는 분석 기법이므로, 종속변수는 반드시 산술평균 계산이 수학적으로 허용되는 '등간척도(Interval)' 또는 '비율척도(Ratio)'의 양적변수(Metric)이어야 합니다(학생 기출 후기 문제 '분산분석의 종속변수는 평균의 계산이 가능해야 한다 (O)' 반영)."}, {"id": 48, "set": 2, "no": 18, "type": "choice", "concept": "확률의 정의와 대수의 법칙", "question": "확률(Probability)의 개념 및 '대수의 법칙(Law of Large Numbers)'에 대한 설명으로 옳은 것은?", "options": ["고전적(사전적) 확률은 실험을 직접 해보지 않고도 이론적 논리에 의해 사전에 확률을 알 수 있는 경우이다(예: 공정한 주사위에서 6이 나올 확률은 1/6).", "장기적 상대도수(사후적) 확률은 실험을 반복해도 결코 고전적 확률에 가까워지지 않는다.", "대수의 법칙에 따르면 시행 횟수를 늘릴수록 장기적 상대도수 확률은 고전적 사전 확률로부터 멀어진다.", "주관적 확률은 엄밀한 수학 공식에 의해서만 도출되며 개인의 직관이나 신념은 배제된다."], "answer": 1, "explanation": "① 고전적 확률은 사전에 모든 결과의 가능성이 동등하다고 가정할 때 이론적으로 계산되는 사전 확률입니다. '대수의 법칙'은 시행 횟수가 무한히 커질수록 실험을 통해 얻은 장기적 상대도수 확률이 고전적 확률로 수렴한다는 원리입니다.", "question_html": "확률(Probability)의 개념 및 '대수의 법칙(Law of Large Numbers)'에 대한 설명으로 옳은 것은?", "options_html": ["고전적(사전적) 확률은 실험을 직접 해보지 않고도 이론적 논리에 의해 사전에 확률을 알 수 있는 경우이다(예: 공정한 주사위에서 6이 나올 확률은 1/6).", "장기적 상대도수(사후적) 확률은 실험을 반복해도 결코 고전적 확률에 가까워지지 않는다.", "대수의 법칙에 따르면 시행 횟수를 늘릴수록 장기적 상대도수 확률은 고전적 사전 확률로부터 멀어진다.", "주관적 확률은 엄밀한 수학 공식에 의해서만 도출되며 개인의 직관이나 신념은 배제된다."], "explanation_html": "① 고전적 확률은 사전에 모든 결과의 가능성이 동등하다고 가정할 때 이론적으로 계산되는 사전 확률입니다. '대수의 법칙'은 시행 횟수가 무한히 커질수록 실험을 통해 얻은 장기적 상대도수 확률이 고전적 확률로 수렴한다는 원리입니다."}, {"id": 49, "set": 2, "no": 19, "type": "choice", "concept": "정규분포의 파라미터 (모수)", "question": "정규분포 $X \\sim N(\\mu, \\sigma^2)$의 두 가지 모수인 위치모수(평균 $\\mu$)와 척도모수(분산 $\\sigma^2$)가 변화할 때 그래프 형태의 변화로 올바른 것은?", "options": ["평균 $\\mu$가 증가하면 그래프는 좌우 모양은 그대로 유지한 채 가로축(X축)을 따라 오른쪽으로 평행 이동한다.", "분산 $\\sigma^2$이 커지면 데이터가 평균 주변에 조밀하게 모여 곡선의 정점이 위로 뾰족해진다.", "분산 $\\sigma^2$이 작아지면 곡선의 꼬리가 양옆으로 넓게 퍼지며 중심부 높이는 낮아진다.", "평균과 분산이 바뀌어도 곡선의 중심축 위치는 결코 변하지 않는다."], "answer": 1, "explanation": "① 필기 노트 [7]주차에 명시되어 있듯이, 평균($\\mu$)은 곡선의 중심 '위치'를 결정하므로 $\\mu$가 변하면 그래프 축이 좌우로 이동합니다. 분산($\\sigma^2$)은 '척도(모양)'를 결정하여 분산이 커지면 옆으로 퍼지고 낮아지며, 분산이 작아지면 평균 주변으로 모여 뾰족해집니다.", "question_html": "정규분포 $X \\sim N(\\mu, \\sigma^2)$의 두 가지 모수인 위치모수(평균 $\\mu$)와 척도모수(분산 $\\sigma^2$)가 변화할 때 그래프 형태의 변화로 올바른 것은?", "options_html": ["평균 $\\mu$가 증가하면 그래프는 좌우 모양은 그대로 유지한 채 가로축(X축)을 따라 오른쪽으로 평행 이동한다.", "분산 $\\sigma^2$이 커지면 데이터가 평균 주변에 조밀하게 모여 곡선의 정점이 위로 뾰족해진다.", "분산 $\\sigma^2$이 작아지면 곡선의 꼬리가 양옆으로 넓게 퍼지며 중심부 높이는 낮아진다.", "평균과 분산이 바뀌어도 곡선의 중심축 위치는 결코 변하지 않는다."], "explanation_html": "① 필기 노트 [7]주차에 명시되어 있듯이, 평균($\\mu$)은 곡선의 중심 '위치'를 결정하므로 $\\mu$가 변하면 그래프 축이 좌우로 이동합니다. 분산($\\sigma^2$)은 '척도(모양)'를 결정하여 분산이 커지면 옆으로 퍼지고 낮아지며, 분산이 작아지면 평균 주변으로 모여 뾰족해집니다."}, {"id": 50, "set": 2, "no": 20, "type": "choice", "concept": "표준정규분포 확률 계산 응용", "question": "어느 대학교 학생식당의 고객 만족도 점수가 정규분포 $N(\\mu = 4.2, \\sigma = 0.6^2)$을 따른다고 한다. 68-95 법칙에 기초할 때, 만족도 점수가 '3.6점 이상'일 확률로 가장 근사한 값은?", "options": ["50.0%", "68.0%", "84.0%", "97.5%"], "answer": 3, "explanation": "③ 점수 3.6점은 평균 4.2점에서 $1\\sigma$($0.6$)만큼 뺀 값, 즉 $\\mu - 1\\sigma$ 지점입니다. $\\mu \\pm 1\\sigma$ (3.6~4.8) 구간에 전체의 68%가 속하므로, 그 바깥의 양쪽 꼬리는 각각 $(100 - 68) / 2 = 16\\%$입니다. 따라서 3.6점 이상일 확률은 $100\\% - 16\\% = 84\\%$ (또는 $50\\% + 34\\% = 84\\%$, 필기 노트 [7]주차 Q/A 공식: $68\\% + 32/2\\% = 84\\%$)입니다.", "question_html": "어느 대학교 학생식당의 고객 만족도 점수가 정규분포 $N(\\mu = 4.2, \\sigma = 0.6^2)$을 따른다고 한다. 68-95 법칙에 기초할 때, 만족도 점수가 '3.6점 이상'일 확률로 가장 근사한 값은?", "options_html": ["50.0%", "68.0%", "84.0%", "97.5%"], "explanation_html": "③ 점수 3.6점은 평균 4.2점에서 $1\\sigma$($0.6$)만큼 뺀 값, 즉 $\\mu - 1\\sigma$ 지점입니다. $\\mu \\pm 1\\sigma$ (3.6~4.8) 구간에 전체의 68%가 속하므로, 그 바깥의 양쪽 꼬리는 각각 $(100 - 68) / 2 = 16\\%$입니다. 따라서 3.6점 이상일 확률은 $100\\% - 16\\% = 84\\%$ (또는 $50\\% + 34\\% = 84\\%$, 필기 노트 [7]주차 Q/A 공식: $68\\% + 32/2\\% = 84\\%$)입니다."}, {"id": 51, "set": 2, "no": 21, "type": "ox", "concept": "2차 자료의 내부 vs 외부 구분", "question": "기업 내부의 POS 판매 데이터, 고객 마일리지 데이터베이스, 고객 불만 접수 내역은 '내부 2차 자료'에 해당한다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 필기 노트 [4]주차에 따르면 2차 자료 중 기업 내부 시스템에 이미 저장되어 있는 POS, 고객정보 등은 '내부 2차 자료'이고, 통계청, SK 상권분석 등 외부 기관 자료는 '외부 2차 자료'입니다.", "question_html": "기업 내부의 POS 판매 데이터, 고객 마일리지 데이터베이스, 고객 불만 접수 내역은 '내부 2차 자료'에 해당한다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 필기 노트 [4]주차에 따르면 2차 자료 중 기업 내부 시스템에 이미 저장되어 있는 POS, 고객정보 등은 '내부 2차 자료'이고, 통계청, SK 상권분석 등 외부 기관 자료는 '외부 2차 자료'입니다."}, {"id": 52, "set": 2, "no": 22, "type": "ox", "concept": "FGI 모더레이터의 역할", "question": "FGI(표적집단면접법)는 참석자들 간의 상호작용을 통해 심층 의견을 도출하므로, 사회자(모더레이터)의 진행 역량이나 편향 여부는 결과에 큰 영향을 미치지 않는다.", "options": ["O", "X"], "answer": "X", "explanation": "정답: X. 필기 노트 [2]주차에 명시되어 있듯이 FGI의 대표적인 단점이자 핵심 관리 요소는 '사회자의 능력'입니다. 사회자가 어떻게 probing(심화질문)을 던지고 편향을 통제하느냐에 따라 FGI의 성패가 완전히 좌우됩니다.", "question_html": "FGI(표적집단면접법)는 참석자들 간의 상호작용을 통해 심층 의견을 도출하므로, 사회자(모더레이터)의 진행 역량이나 편향 여부는 결과에 큰 영향을 미치지 않는다.", "options_html": ["O", "X"], "explanation_html": "정답: X. 필기 노트 [2]주차에 명시되어 있듯이 FGI의 대표적인 단점이자 핵심 관리 요소는 '사회자의 능력'입니다. 사회자가 어떻게 probing(심화질문)을 던지고 편향을 통제하느냐에 따라 FGI의 성패가 완전히 좌우됩니다."}, {"id": 53, "set": 2, "no": 23, "type": "ox", "concept": "설문지 사전조사(Pre-test)", "question": "설문지 설계 과정에서 '사전조사(Pre-test)'는 초안이 완성된 후 본 조사를 실시하기 전에 문항의 모호성, 응답 소요 시간, 오해 소지 등을 소표본으로 점검하기 위해 반드시 거쳐야 하는 단계이다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 필기 노트 [5]주차 프로세스에 [7. 설문지 초안 ⟶ 8. 설문지 사전조사 ⟶ 9. 설문지 완성] 단계가 명확히 제시되어 있습니다.", "question_html": "설문지 설계 과정에서 '사전조사(Pre-test)'는 초안이 완성된 후 본 조사를 실시하기 전에 문항의 모호성, 응답 소요 시간, 오해 소지 등을 소표본으로 점검하기 위해 반드시 거쳐야 하는 단계이다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 필기 노트 [5]주차 프로세스에 [7. 설문지 초안 ⟶ 8. 설문지 사전조사 ⟶ 9. 설문지 완성] 단계가 명확히 제시되어 있습니다."}, {"id": 54, "set": 2, "no": 24, "type": "ox", "concept": "체계적 표본추출법 간격 계산", "question": "모집단 크기 $N = 10,000$명에서 표본 $n = 500$명을 체계적 표본추출(Systematic Sampling)로 뽑을 때, 표본 추출 간격 $k$는 20이다.", "options": ["O", "X"], "answer": "O", "explanation": "정답: O. 체계적 표본추출의 추출 간격 $k = N / n = 10,000 / 500 = 20$입니다. 1번부터 20번 사이에서 무작위로 첫 번째 표본을 고른 후, 매 20번째마다 표본을 추출합니다.", "question_html": "모집단 크기 $N = 10,000$명에서 표본 $n = 500$명을 체계적 표본추출(Systematic Sampling)로 뽑을 때, 표본 추출 간격 $k$는 20이다.", "options_html": ["O", "X"], "explanation_html": "정답: O. 체계적 표본추출의 추출 간격 $k = N / n = 10,000 / 500 = 20$입니다. 1번부터 20번 사이에서 무작위로 첫 번째 표본을 고른 후, 매 20번째마다 표본을 추출합니다."}, {"id": 55, "set": 2, "no": 25, "type": "ox", "concept": "비확률추출의 표본오류 계산", "question": "편의표본추출법(Convenience Sampling)은 비확률추출법이지만 표본 크기를 크게 늘리기만 하면 표본오류를 수학적 공식에 의해 정확히 계산할 수 있다.", "options": ["O", "X"], "answer": "X", "explanation": "정답: X. 비확률추출법은 각 표본 단위가 추출될 확률을 알 수 없기 때문에, 표본 크기를 아무리 늘려도 확률론에 기초한 '표본오류'를 수학적으로 계산할 수 없습니다.", "question_html": "편의표본추출법(Convenience S
